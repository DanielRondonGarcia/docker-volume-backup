name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  release-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tags found. Starting at 0.1.0"
            NEW_VERSION="0.1.0"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
            
            case "${{ inputs.bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          echo "Previous tag: ${LATEST_TAG:-none}"
          echo "Bump: ${{ inputs.bump }}"
          echo "New version: ${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating full changelog"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            echo "Generating changelog from $PREV_TAG"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes since last release"
          fi
          
          echo "$CHANGELOG" > /tmp/changelog.txt
          
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          
          cat > /tmp/release_body.md <<EOF
          ## What's Changed
          
          $CHANGELOG
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-initial}...${NEW_VERSION}
          EOF

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_version }}" -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin "${{ steps.version.outputs.new_version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.new_version }}" \
            --title "v${{ steps.version.outputs.new_version }}" \
            --notes-file /tmp/release_body.md \
            ${{ inputs.prerelease && '--prerelease' || '' }}

      # ── Docker build & push ──

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backup runtime image
        id: meta_runtime
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.new_version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.new_version }}
            type=raw,value=latest

      - name: Extract metadata for Control Plane image
        id: meta_control_plane
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-control-plane
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.new_version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.new_version }}
            type=raw,value=latest

      - name: Extract metadata for Worker image
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-worker
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.new_version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.new_version }}
            type=raw,value=latest

      - name: Build and push backup runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backup-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_runtime.outputs.tags }}
          labels: ${{ steps.meta_runtime.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Control Plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: control-plane
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_control_plane.outputs.tags }}
          labels: ${{ steps.meta_control_plane.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
