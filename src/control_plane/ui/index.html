    const SNAPSHOT_CACHE_LIMIT = 8;
    const SNAPSHOT_PREFETCH_LIMIT = 2;
    const SNAPSHOT_MAX_ENTRIES = 200; // catalog and search response cap
    const SNAPSHOT_PAGE_SIZE = 200;
    const SNAPSHOT_MAX_DIRECTORY_ENTRIES = 10_000;
    const SNAPSHOT_SEARCH_MIN_LENGTH = 2;
    const SNAPSHOT_POLL_DELAYS = [150, 300, 500, 800, 1200, 1800, 2600, 3500];
    const SNAPSHOT_POLL_ATTEMPTS = SNAPSHOT_POLL_DELAYS.length;
    const SNAPSHOT_POLL_MAX_MS = 90000;
    const SNAPSHOT_CATALOG_REFRESH_DELAYS = [500, 1000, 2000, 3500, 5000, 7000];
    const SNAPSHOT_REFRESH_LABEL = "Refrescar lista de snapshots";
    const SNAPSHOT_REFRESH_BUSY_LABEL = "Sincronizando snapshots...";
    const SNAPSHOT_MAX_OUTPUT_BYTES = 8 * 1024 * 1024;
    const SNAPSHOT_MAX_BASE64_LENGTH = Math.ceil(SNAPSHOT_MAX_OUTPUT_BYTES * 4 / 3) + 4;
    const SNAPSHOT_STATE_LABELS = {
      loading: "Cargando",
      indexing: "Indexando",
      pending: "Pendiente",
      empty: "Vacio",
      "no-match": "Sin coincidencias",
      error: "Error",
      stale: "Datos en cache",
      canceled: "Cancelado",
      deleted: "Eliminado",
      blocked: "Bloqueado",
      oversized: "Excede el limite",
      offline: "Worker no disponible",
      timeout: "Tiempo agotado",
      unsupported: "No disponible",
      ready: "Listo",
    };
    let snapshotBrowserState = null;

    function createSnapshotBrowserState(target) {
      return {
        target,
        snapshots: [],
        currentSnapshot: null,
        currentPath: "/",
        entries: [],
        directoryLoadedLimit: SNAPSHOT_PAGE_SIZE,
        directoryHasMore: false,
        loadingMore: false,
        loading: false,
        view: "list",
        searchQuery: "",
        searchActive: false,
        searchTimer: null,
        requestSequence: 0,
        activeRequest: null,
        catalogRequestSequence: 0,
        catalogRequest: null,
        catalogSyncRequest: null,
        catalogRefreshTimer: null,
        catalogRefreshActive: false,
        catalogRefreshToken: 0,
        prefetchControllers: new Map(),
        directoryCache: new Map(),
        catalogStatus: "loading",
        catalogError: null,
        notice: null,
        closed: false,
        returnFocus: document.activeElement,
      };
    }

    function snapshotModalIsOpen() {
      return Boolean(snapshotBrowserState && !snapshotBrowserState.closed && snapshotBrowserState.overlay && snapshotBrowserState.overlay.classList.contains("open"));
    }

    function normalizeSnapshotPath(path) {
      const raw = String(path || "").replace(/\\/g, "/");
      if (!raw || raw === "/") return "/";
      const segments = raw.split("/").filter(Boolean);
      if (segments.some(segment => segment === "..")) throw new Error("Invalid snapshot path");
      const safeSegments = segments.filter(segment => segment !== ".");
      return safeSegments.length ? `/${safeSegments.join("/")}` : "/";
    }

    function legacySnapshotPath(path) {
      const normalized = normalizeSnapshotPath(path);
      return normalized === "/" ? "" : normalized.slice(1);
    }

    function snapshotCacheKey(targetId, snapshotId, path) {
      return JSON.stringify([String(targetId), String(snapshotId), normalizeSnapshotPath(path)]);
    }

    function normalizeSnapshotDirectoryLimit(limit) {
      const numericLimit = Number(limit);
      if (!Number.isFinite(numericLimit)) return SNAPSHOT_PAGE_SIZE;
      return Math.min(SNAPSHOT_MAX_DIRECTORY_ENTRIES, Math.max(SNAPSHOT_PAGE_SIZE, Math.floor(numericLimit)));
    }

    function cacheSnapshotDirectory(snapshotId, path, entries, loadedLimit = SNAPSHOT_PAGE_SIZE, hasMore = false) {
      const state = snapshotBrowserState;
      if (!state) return;
      const key = snapshotCacheKey(state.target.id, snapshotId, path);
      const normalizedLimit = normalizeSnapshotDirectoryLimit(loadedLimit);
      const cachedEntries = Array.isArray(entries) ? entries.slice(0, SNAPSHOT_MAX_DIRECTORY_ENTRIES) : [];
      state.directoryCache.delete(key);
      state.directoryCache.set(key, {
        entries: cachedEntries,
        loadedLimit: normalizedLimit,
        hasMore: Boolean(hasMore) && cachedEntries.length >= normalizedLimit && normalizedLimit < SNAPSHOT_MAX_DIRECTORY_ENTRIES,
        cachedAt: Date.now(),
      });
      while (state.directoryCache.size > SNAPSHOT_CACHE_LIMIT) {
        state.directoryCache.delete(state.directoryCache.keys().next().value);
      }
    }

    function getCachedSnapshotDirectory(snapshotId, path) {
      const state = snapshotBrowserState;
      if (!state) return null;
      const key = snapshotCacheKey(state.target.id, snapshotId, path);
      const value = state.directoryCache.get(key);
      if (!value) return null;
      state.directoryCache.delete(key);
      state.directoryCache.set(key, value);
      const loadedLimit = normalizeSnapshotDirectoryLimit(value.loadedLimit);
      return {
        entries: value.entries.slice(),
        loadedLimit,
        hasMore: value.hasMore === true && loadedLimit < SNAPSHOT_MAX_DIRECTORY_ENTRIES,
      };
    }

    function resetSnapshotDirectoryState(state) {
      if (!state) return;
      state.directoryLoadedLimit = SNAPSHOT_PAGE_SIZE;
      state.directoryHasMore = false;
      state.loadingMore = false;
    }

    function clearSnapshotSearchTimer() {
      if (snapshotBrowserState && snapshotBrowserState.searchTimer) {
        clearTimeout(snapshotBrowserState.searchTimer);
        snapshotBrowserState.searchTimer = null;
      }
    }

    function cancelSnapshotJob(jobId) {
      if (!jobId) return;
      void apiPost(`/api/v2/jobs/${encodeURIComponent(jobId)}/cancel`, {}).catch(() => {});
    }

    function abortSnapshotRequest(request) {
      const state = snapshotBrowserState;
      if (!request) return;
      if (!request.controller.signal.aborted) request.controller.abort();
      if (request.jobId && !request.cancelSent) {

        cancelSnapshotJob(request.jobId);

    }

    function abortSnapshotPrefetches() {
      const state = snapshotBrowserState;
      if (!state) return;

        if (item.request.jobId && !item.request.cancelSent) {

      state.prefetchControllers.clear();

    function beginSnapshotRequest(kind, snapshotId, path) {
      const state = snapshotBrowserState;
      if (!state) return null;
      abortSnapshotRequest(state.activeRequest);
      state.requestSequence += 1;
      const request = {
        kind,
        seq: state.requestSequence,
        targetId: String(state.target.id),
        snapshotId: snapshotId ? String(snapshotId) : null,
        path: path ? normalizeSnapshotPath(path) : null,
        controller: new AbortController(),
        jobId: null,
        cancelSent: false,

    function isCurrentSnapshotRequest(request) {

      if (state.requestSequence !== request.seq || String(state.target.id) !== request.targetId) return false;
      if (request.snapshotId && String(state.currentSnapshot) !== request.snapshotId) return false;
      if (request.path && normalizeSnapshotPath(state.currentPath) !== request.path) return false;

    }

    function finishSnapshotRequest(request) {
      if (snapshotBrowserState && snapshotBrowserState.activeRequest === request) snapshotBrowserState.activeRequest = null;
    }

    function abortSnapshotCatalogRequest() {
      const state = snapshotBrowserState;
      if (!state || !state.catalogRequest) return;
      const request = state.catalogRequest;
      if (!request.controller.signal.aborted) request.controller.abort();
      if (state.catalogRequest === request) state.catalogRequest = null;
    }

    function abortSnapshotCatalogSync() {
      const state = snapshotBrowserState;
      if (!state || !state.catalogSyncRequest) return;
      const request = state.catalogSyncRequest;
      if (!request.controller.signal.aborted) request.controller.abort();
      if (state.catalogSyncRequest === request) state.catalogSyncRequest = null;
    }

    function beginSnapshotCatalogSyncRequest() {
      const state = snapshotBrowserState;
      if (!state || state.closed || state.catalogSyncRequest) return null;
      const request = {
        kind: "catalog-sync",
        targetId: String(state.target.id),
        controller: new AbortController(),
        jobId: null,
      };
      state.catalogSyncRequest = request;
      return request;
    }

    function isCurrentSnapshotCatalogSyncRequest(request) {
      const state = snapshotBrowserState;
      return Boolean(
        state
        && !state.closed
        && request
        && !request.controller.signal.aborted
        && state.catalogSyncRequest === request
        && String(state.target.id) === request.targetId
      );
    }

    function finishSnapshotCatalogSyncRequest(request) {
      if (snapshotBrowserState && snapshotBrowserState.catalogSyncRequest === request) snapshotBrowserState.catalogSyncRequest = null;
    }

    function setSnapshotCatalogRefreshBusy(busy, request = null) {
      const state = snapshotBrowserState;
      if (!state || (request && state.catalogSyncRequest !== request)) return;
      const isBusy = Boolean(busy);
      const navigation = state.navigationElement;
      if (!navigation) return;
      navigation.querySelectorAll("[data-snapshot-refresh]").forEach(button => {
        button.classList.add("snapshot-refresh-button");
        if (!button.querySelector("[data-snapshot-refresh-spinner]")) {

        button.title = isBusy ? SNAPSHOT_REFRESH_BUSY_LABEL : SNAPSHOT_REFRESH_LABEL;
        button.dataset.snapshotRefreshState = isBusy ? "busy" : "idle";
      });
    }

    function beginSnapshotCatalogRequest() {
      const state = snapshotBrowserState;
      if (!state) return null;
      abortSnapshotCatalogRequest();
      state.catalogRequestSequence += 1;
      const request = {
        kind: "catalog",
        seq: state.catalogRequestSequence,
        targetId: String(state.target.id),
        controller: new AbortController(),
      };
      state.catalogRequest = request;
      return request;
    }

    function isCurrentSnapshotCatalogRequest(request) {
      const state = snapshotBrowserState;
      return Boolean(
        state
        && !state.closed
        && request
        && !request.controller.signal.aborted
        && state.catalogRequest === request
        && String(state.target.id) === request.targetId

    }

    function finishSnapshotCatalogRequest(request) {
      if (snapshotBrowserState && snapshotBrowserState.catalogRequest === request) snapshotBrowserState.catalogRequest = null;
    }

    function stopSnapshotCatalogRefresh() {
      const state = snapshotBrowserState;
      if (!state) return;
      state.catalogRefreshToken += 1;
      state.catalogRefreshActive = false;
      if (state.catalogRefreshTimer) clearTimeout(state.catalogRefreshTimer);
      state.catalogRefreshTimer = null;
    }

    function scheduleSnapshotCatalogRefreshAfterBackup(job) {
      const state = snapshotBrowserState;
      if (!state || !snapshotModalIsOpen() || !job || job.command !== "backup.run") return;
      if (!["succeeded", "success"].includes(String(job.status || "").toLowerCase())) return;
      if (String(job.target_id) !== String(state.target.id)) return;
      if (state.catalogRefreshActive || state.catalogRefreshTimer) return;

      state.catalogRefreshActive = true;
      const token = ++state.catalogRefreshToken;
      let attempt = 0;
      const refresh = async () => {
        const current = snapshotBrowserState;
        if (
          !current
          || current.closed
          || current.catalogRefreshToken !== token
          || !snapshotModalIsOpen()
          || String(current.target.id) !== String(job.target_id)
        ) {
          if (current && current.catalogRefreshToken === token) current.catalogRefreshActive = false;
          return;
        }
        current.catalogRefreshTimer = null;
        try {
          const result = await loadSnapshotsList(current.target, { background: true });
          if (result && result.changed) {
            current.catalogRefreshActive = false;
            return;
          }
        } catch (error) {
          // The next bounded catalog-only attempt may observe the follow-up sync.
        }
        if (
          !snapshotBrowserState
          || snapshotBrowserState.closed
          || snapshotBrowserState.catalogRefreshToken !== token
          || !snapshotModalIsOpen()
        ) {
          if (snapshotBrowserState && snapshotBrowserState.catalogRefreshToken === token) snapshotBrowserState.catalogRefreshActive = false;
          return;
        }
        attempt += 1;
        if (attempt >= SNAPSHOT_CATALOG_REFRESH_DELAYS.length) {
          snapshotBrowserState.catalogRefreshActive = false;
          return;
        }
        snapshotBrowserState.catalogRefreshTimer = setTimeout(refresh, SNAPSHOT_CATALOG_REFRESH_DELAYS[attempt]);
      };
      state.catalogRefreshTimer = setTimeout(refresh, SNAPSHOT_CATALOG_REFRESH_DELAYS[0]);
    }

    function invalidateSnapshotRequest(showCanceled) {
      const state = snapshotBrowserState;
      if (!state) return;
      const request = state.activeRequest;
      if (request) {
        state.requestSequence += 1;
        abortSnapshotRequest(request);
        if (showCanceled && !state.closed) {
          state.loading = false;
          state.loadingMore = false;
          state.notice = { kind: "canceled", message: "La operacion fue cancelada.", retry: true };
          renderCurrentSnapshotBrowser(false);
        }
      }
    }

    function isSnapshotAbortError(error) {
      return Boolean(error && (error.name === "AbortError" || error.code === 20));
    }

    function unsupportedSnapshotResponse(message) {
      const error = new Error(message || "Unsupported snapshot API response");
      error.code = "unsupported-v2";
      return error;
    }

    function isUnsupportedSnapshotError(error) {
      if (!error) return false;
      if (error.code === "unsupported-v2") return true;
      return [404, 405, 501].includes(error.status) || /unsupported|not found|schema/i.test(error.message || "");
    }

    function snapshotStatus(result) {
      return String((result && result.status) || "").toLowerCase().replace(/-/g, "_");
    }

    function isSnapshotTerminalStatus(status) {
      return ["succeeded", "success", "failed", "error", "canceled", "cancelled", "deleted", "missing"].includes(status);
    }

    function normalizeSnapshotContract(result) {
      if (!result || typeof result !== "object") return null;
      const summary = result.result_summary && typeof result.result_summary === "object" ? result.result_summary : {};
      const normalized = { ...result };
      if (!Array.isArray(normalized.entries) && Array.isArray(summary.entries)) normalized.entries = summary.entries;
      if (typeof normalized.b64_content !== "string" && typeof summary.b64_content === "string") normalized.b64_content = summary.b64_content;
      if (!normalized.error && typeof summary.error === "string") normalized.error = summary.error;
      return normalized;
    }

    function isSnapshotContract(result) {
      const normalized = normalizeSnapshotContract(result);
      if (!normalized) return false;
      return Array.isArray(normalized.entries)
        || typeof normalized.job_id === "string"
        || ["pending", "queued", "running", "in_progress", "succeeded", "success", "failed", "error", "canceled", "cancelled"].includes(snapshotStatus(normalized));
    }

    function waitForSnapshotPoll(delay, signal) {
      return new Promise((resolve, reject) => {
        if (signal.aborted) {
          reject(new DOMException("Aborted", "AbortError"));
          return;
        }
        const timer = setTimeout(resolve, delay);
        signal.addEventListener("abort", () => {
          clearTimeout(timer);
          reject(new DOMException("Aborted", "AbortError"));
        }, { once: true });
      });
    }

    async function pollSnapshotJob(request, initialResult) {
      let result = normalizeSnapshotContract(initialResult);
      request.jobId = result.job_id || request.jobId;
      if (!request.jobId) return result;
      if (isSnapshotTerminalStatus(snapshotStatus(result))) return result;
      const deadline = Date.now() + SNAPSHOT_POLL_MAX_MS;
      let attempt = 0;
      let useLegacyJobPolling = false;
      while (Date.now() < deadline) {
        const remaining = deadline - Date.now();
        const delay = SNAPSHOT_POLL_DELAYS[Math.min(attempt, SNAPSHOT_POLL_ATTEMPTS - 1)];
        await waitForSnapshotPoll(Math.min(delay, remaining), request.controller.signal);
        if (Date.now() >= deadline) break;
        let polled;
        if (useLegacyJobPolling) {
          polled = await apiGet(`/api/v1/jobs/${encodeURIComponent(request.jobId)}`, { signal: request.controller.signal });
        } else {
          try {
            polled = await apiGet(`/api/v2/jobs/${encodeURIComponent(request.jobId)}`, { signal: request.controller.signal });
          } catch (error) {
            if (!isUnsupportedSnapshotError(error)) throw error;
            useLegacyJobPolling = true;
            polled = await apiGet(`/api/v1/jobs/${encodeURIComponent(request.jobId)}`, { signal: request.controller.signal });
          }
        }
        if (!isSnapshotContract(polled)) throw unsupportedSnapshotResponse("Unsupported snapshot job response");
        result = normalizeSnapshotContract(polled);
        if (isSnapshotTerminalStatus(snapshotStatus(result))) return result;
        attempt += 1;
      }
      const timeout = new Error("La operacion sigue indexando despues del limite de espera.");
      timeout.code = "snapshot-poll-timeout";
      throw timeout;
    }

    async function requestSnapshotOperation(request, operation, payload, legacyFallback) {
      try {
        const result = await apiPost(`/api/v2/targets/${encodeURIComponent(request.targetId)}/${operation}`, payload, { signal: request.controller.signal });
        if (!isSnapshotContract(result)) throw unsupportedSnapshotResponse("Unsupported snapshot response");
        request.jobId = result.job_id || null;
        return await pollSnapshotJob(request, result);
      } catch (error) {
        if (isSnapshotAbortError(error) || request.controller.signal.aborted) throw error;
        if (!legacyFallback || !isUnsupportedSnapshotError(error)) throw error;
        if (request.jobId) {
          cancelSnapshotJob(request.jobId);
          request.jobId = null;
        }
        return await legacyFallback(request.controller.signal);
      }
    }

    async function legacyBrowseSnapshot(request) {
      const result = await apiPost(`/api/v1/targets/${encodeURIComponent(request.targetId)}/snapshot-ls`, {
        snapshot_id: request.snapshotId,
        path: legacySnapshotPath(request.path),
      }, { signal: request.controller.signal });
      return {
        schema_version: 1,
        status: result && result.error ? "failed" : "succeeded",
        source: "legacy",
        entries: Array.isArray(result && result.entries) ? result.entries : [],
        error: result && result.error ? String(result.error) : null,
      };
    }

    async function legacyDumpSnapshot(request) {
      const result = await apiPost(`/api/v1/targets/${encodeURIComponent(request.targetId)}/snapshot-dump`, {
        snapshot_id: request.snapshotId,
        path: legacySnapshotPath(request.path),
      }, { signal: request.controller.signal });
      return {
        schema_version: 1,
        status: result && result.success ? "succeeded" : "failed",
        source: "legacy",
        b64_content: result && typeof result.b64_content === "string" ? result.b64_content : "",
        error: result && result.error ? String(result.error) : null,
      };
    }

    function getSnapshotCatalogItems(payload) {
      if (!payload || typeof payload !== "object") return null;
      if (Array.isArray(payload.items)) return payload.items;
      if (Array.isArray(payload.entries)) return payload.entries;
      return null;
    }

    function snapshotCatalogStatus(payload) {
      const status = snapshotStatus(payload);
      if (["pending", "queued", "running", "in_progress", "indexing"].includes(status)) return "indexing";
      return "ready";
    }

    function snapshotItemId(item) {
      return String((item && (item.snapshot_id || item.id)) || "");
    }

    function formatSnapshotBytes(value) {
      const size = Number(value);
      if (!Number.isFinite(size) || size < 0) return "";
      if (size < 1024) return `${size} B`;
      if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KiB`;
      return `${(size / (1024 * 1024)).toFixed(1)} MiB`;
    }

    function normalizeSnapshotEntry(entry) {
      if (!entry || typeof entry !== "object" || !entry.path) return null;
      let path;
      try { path = normalizeSnapshotPath(entry.path); } catch (error) { return null; }
      if (path === "/") return null;
      const type = String(entry.type || entry.kind || "").toLowerCase();
      const isDir = type === "dir" || type === "directory" || entry.is_dir === true || entry.kind === "directory";
      const rawSize = entry.size_bytes !== undefined ? entry.size_bytes : entry.size;
      const numericSize = Number(rawSize);
      const size = Number.isFinite(numericSize) && numericSize >= 0 ? numericSize : null;
      return {
        path,
        name: path.split("/").pop() || path,
        isDir,
        size,
      };
    }

    function normalizeSnapshotEntries(entries) {
      if (!Array.isArray(entries)) return [];
      return entries.slice(0, SNAPSHOT_MAX_DIRECTORY_ENTRIES).map(normalizeSnapshotEntry).filter(Boolean);
    }

    function isImmediateSnapshotChild(path, parentPath) {
      const normalizedPath = normalizeSnapshotPath(path);
      const normalizedParent = normalizeSnapshotPath(parentPath);
      const parent = normalizedPath.slice(0, normalizedPath.lastIndexOf("/")) || "/";
      return parent === normalizedParent;
    }

    function filterSnapshotEntries(entries, path, searchQuery) {
      const normalizedPath = normalizeSnapshotPath(path);
      const normalizedEntries = normalizeSnapshotEntries(entries);
      if (searchQuery) {
        const query = searchQuery.toLowerCase();
        return normalizedEntries.filter(entry => entry.path.toLowerCase().includes(query) || entry.name.toLowerCase().includes(query));
      }
      return normalizedEntries.filter(entry => isImmediateSnapshotChild(entry.path, normalizedPath));
    }

    function renderSnapshotState(kind, message, options = {}) {
      const label = SNAPSHOT_STATE_LABELS[kind] || kind;
      const role = ["error", "deleted", "blocked", "oversized"].includes(kind) ? "alert" : "status";
      const retry = options.retry ? `<button type="button" class="btn ghost xs" data-snapshot-retry>Reintentar</button>` : "";
      const cancel = options.cancel ? `<button type="button" class="btn ghost xs" data-snapshot-cancel>Cancelar</button>` : "";
      return `<div class="snapshot-status" data-state="${escapeHtml(kind)}" role="${role}" aria-live="polite"><strong>${escapeHtml(label)}</strong><span>${escapeHtml(message)}</span>${retry}${cancel}</div>`;
    }

    function renderSnapshotList() {
      const state = snapshotBrowserState;
      const list = document.getElementById("snapshotList");
      if (!state || !list) return;
      const snapshots = Array.isArray(state.snapshots) ? state.snapshots : [];
      const syncBusy = Boolean(state.catalogSyncRequest);
      let status = "";
      if (state.catalogStatus === "loading" && snapshots.length === 0) {
        list.innerHTML = `<div class="snapshot-skeleton-list" aria-hidden="true">${[1, 2, 3, 4].map(() => `<div class="snapshot-skeleton-row"></div>`).join("")}</div>`;
        setSnapshotCatalogRefreshBusy(syncBusy);
        return;
      }
      if (state.catalogError) {
        const errorKind = ["deleted", "offline", "timeout"].includes(state.catalogStatus) ? state.catalogStatus : "error";
        status = renderSnapshotState(errorKind, state.catalogError, { retry: true });
      } else if (state.catalogStatus === "refreshing" || state.catalogStatus === "indexing") {
        status = renderSnapshotState("stale", state.catalogStatus === "indexing" ? "El indice se esta preparando." : "Actualizando snapshots en segundo plano.");
      }
      if (state.catalogError && snapshots.length === 0) {
        const errorKind = ["deleted", "offline", "timeout"].includes(state.catalogStatus) ? state.catalogStatus : "error";
        list.innerHTML = `${renderSnapshotState(errorKind, state.catalogError, { retry: true })}`;

        return;

      if (snapshots.length === 0) {
        list.innerHTML = `${status}<div class="snapshot-empty" data-state="empty"><strong>No hay snapshots disponibles</strong><span>Refresca para comprobar si el indice ya esta listo.</span><button type="button" class="btn ghost xs" data-snapshot-refresh style="margin-top:12px;">Refrescar</button></div>`;
        setSnapshotCatalogRefreshBusy(syncBusy);
        return;

        const id = snapshotItemId(item);
        const date = item && item.created_at ? fmtDate(item.created_at) : "Fecha no disponible";
        const paths = Array.isArray(item && item.paths) ? item.paths : [];
        const pathText = paths.length ? paths.join(", ") : "Todos los paths";
        const selected = String(state.currentSnapshot || "") === id;
        return `<div class="snapshot-option" role="option" tabindex="${selected ? "0" : "-1"}" aria-selected="${selected ? "true" : "false"}" data-snapshot-option data-snapshot-id="${escapeHtml(id)}">
          <div class="snapshot-option-main"><span class="snapshot-option-id">${escapeHtml(id || "Sin ID")}</span><span class="snapshot-option-date">${escapeHtml(date)}</span></div>
          <div class="snapshot-option-paths">${escapeHtml(pathText)}</div>
          <div class="snapshot-option-actions"><button type="button" class="btn ghost xs danger" data-snapshot-restore data-snapshot-id="${escapeHtml(id)}" data-snapshot-date="${escapeHtml(date)}">Restaurar</button></div>
        </div>`;
      }).join("")}`;
      const selected = list.querySelector(`[data-snapshot-option][aria-selected="true"]`);
      if (selected && state.focusSnapshotId === selected.dataset.snapshotId) {

    }

    function renderSnapshotWorkspaceIntro() {
      const state = snapshotBrowserState;
      const workspace = document.getElementById("snapshotWorkspace");
      if (!state || !workspace) return;

      const catalogIndexing = state.catalogStatus === "loading" || state.catalogStatus === "indexing";
      workspace.innerHTML = `
        <div class="snapshot-empty" data-state="${hasSnapshots ? "empty" : catalogIndexing ? "indexing" : "empty"}">
          <strong>${hasSnapshots ? "Selecciona un snapshot" : "El catalogo esta vacio"}</strong>
          <span>${hasSnapshots ? "Elige un snapshot en la izquierda para abrir su raiz." : "Los snapshots solo se consultan dentro del target seleccionado."}</span>
          <div class="snapshot-safe-note">Los archivos no se muestran como HTML. Solo se permiten descargas acotadas.</div>
        </div>`;
    }

    function renderSnapshotWorkspaceLoading(message) {
      const state = snapshotBrowserState;
      const workspace = document.getElementById("snapshotWorkspace");
      if (!state || !workspace) return;
      const snapshotId = state.currentSnapshot || "";
      const path = normalizeSnapshotPath(state.currentPath || "/");
      workspace.innerHTML = `
        <div class="snapshot-workspace-header"><div><h4 class="snapshot-workspace-title">${escapeHtml(snapshotId)}</h4><div class="snapshot-workspace-subtitle">${escapeHtml(path)}</div></div></div>
        <div class="snapshot-search-row"><div class="snapshot-search-field"><input id="snapshotSearch" type="search" value="${escapeHtml(state.searchQuery)}" placeholder="Buscar en el path actual..." aria-label="Buscar en el snapshot y path actual" autocomplete="off" /><button type="button" class="snapshot-search-clear" aria-label="Limpiar busqueda" data-snapshot-clear-search>&times;</button></div></div>

    }

    function renderCurrentSnapshotBrowser(focusFirst) {
      const state = snapshotBrowserState;
      if (!state || !state.currentSnapshot || state.view !== "browser") return;

        renderSnapshotWorkspaceLoading(state.searchActive ? "Buscando resultados..." : "Listando contenido...");

    function renderSnapshotBrowser(snapshotId, path, entries, options = {}) {
      const state = snapshotBrowserState;
      const workspace = document.getElementById("snapshotWorkspace");
      if (!state || !workspace) return;
      const normalizedPath = normalizeSnapshotPath(path);
      const visibleEntries = filterSnapshotEntries(entries, normalizedPath, state.searchActive ? state.searchQuery : "");
      visibleEntries.sort((a, b) => Number(b.isDir) - Number(a.isDir) || a.name.localeCompare(b.name));
      const pathParts = normalizedPath === "/" ? [] : normalizedPath.slice(1).split("/").filter(Boolean);
      const breadcrumbs = [`<button type="button" class="snapshot-breadcrumb" data-breadcrumb-path="/" aria-label="Abrir la raiz del snapshot">Raiz</button>`];
      let accumulated = "/";
      for (const part of pathParts) {
        accumulated = normalizeSnapshotPath(`${accumulated}/${part}`);
        breadcrumbs.push(`<span aria-hidden="true">/</span><button type="button" class="snapshot-breadcrumb" data-breadcrumb-path="${escapeHtml(accumulated)}" aria-label="Abrir ${escapeHtml(accumulated)}">${escapeHtml(part)}</button>`);
      }
      const notice = state.notice || null;
      const statusMarkup = notice ? renderSnapshotState(notice.kind, notice.message, { retry: notice.retry, cancel: notice.kind === "loading" }) : "";
      const emptyKind = state.searchActive ? "no-match" : "empty";
      const emptyMarkup = visibleEntries.length ? "" : `<div class="snapshot-empty" data-state="${emptyKind}"><strong>${escapeHtml(SNAPSHOT_STATE_LABELS[emptyKind])}</strong><span>${state.searchActive ? "Prueba con otra busqueda o limpia el filtro." : "Esta carpeta no contiene entradas visibles."}</span></div>`;
      const loadMoreMarkup = !state.searchActive && state.directoryHasMore
        ? `<div class="snapshot-pagination-control"><button type="button" class="btn ghost xs" data-snapshot-load-more aria-busy="${state.loadingMore ? "true" : "false"}" aria-label="${state.loadingMore ? "Cargando más entradas" : "Cargar más"}" ${state.loadingMore ? "disabled" : ""}>${state.loadingMore ? "Cargando..." : "Cargar más"}</button></div>`
        : "";
      const rows = visibleEntries.map(entry => {
        const sizeText = entry.size === null ? "" : formatSnapshotBytes(entry.size);
        const tooLarge = !entry.isDir && entry.size !== null && entry.size > SNAPSHOT_MAX_OUTPUT_BYTES;
        const displayName = state.searchActive ? entry.path : entry.name;
        const action = entry.isDir
          ? `<span class="snapshot-entry-meta">Abrir con Enter</span>`
          : `<button type="button" class="btn ${tooLarge ? "ghost" : "primary"} xs snapshot-entry-action" data-entry-download data-download-path="${escapeHtml(entry.path)}" data-entry-size="${entry.size === null ? "" : escapeHtml(String(entry.size))}" ${tooLarge ? "disabled title=\"El archivo excede el limite de descarga\"" : ""}>${tooLarge ? "Bloqueado" : "Descargar"}</button>`;
        return `<div class="snapshot-entry-option" role="option" tabindex="-1" aria-selected="false" data-entry-option data-entry-kind="${entry.isDir ? "directory" : "file"}" data-entry-path="${escapeHtml(entry.path)}" aria-label="${escapeHtml(entry.isDir ? `Abrir directorio ${displayName}` : `Descargar archivo ${displayName}`)}">
          <span class="snapshot-entry-icon" aria-hidden="true">${entry.isDir ? "[+]" : "[file]"}</span>
          <span><span class="snapshot-entry-name">${escapeHtml(displayName)}${entry.isDir ? "/" : ""}</span>${sizeText ? `<span class="snapshot-entry-meta"> ${escapeHtml(sizeText)}</span>` : ""}</span>
          ${action}
        </div>`;
      }).join("");
      workspace.innerHTML = `
        <div class="snapshot-workspace-header"><div><h4 class="snapshot-workspace-title">Snapshot <code>${escapeHtml(snapshotId)}</code></h4><div class="snapshot-workspace-subtitle">Path POSIX: <code>${escapeHtml(normalizedPath)}</code></div></div><div class="snapshot-workspace-actions"><button type="button" class="btn ghost xs" data-snapshot-refresh-browser>Refrescar</button></div></div>
        <div class="snapshot-search-row"><div class="snapshot-search-field"><input id="snapshotSearch" type="search" value="${escapeHtml(state.searchQuery)}" placeholder="Buscar en el path actual..." aria-label="Buscar en el snapshot y path actual" autocomplete="off" /><button type="button" class="snapshot-search-clear" aria-label="Limpiar busqueda" data-snapshot-clear-search>&times;</button></div><span class="snapshot-entry-meta">Minimo ${SNAPSHOT_SEARCH_MIN_LENGTH} caracteres</span></div>
        ${statusMarkup}
        <div class="snapshot-breadcrumbs" aria-label="Ruta del snapshot">${breadcrumbs.join("")}</div>
        <div class="snapshot-entry-list" id="snapshotEntryList" role="listbox" aria-label="Entradas de ${escapeHtml(normalizedPath)}" tabindex="0" aria-busy="false">${rows || emptyMarkup}</div>
        ${loadMoreMarkup}
        <div class="snapshot-safe-note">Los contenidos de archivos nunca se renderizan. Descargas limitadas a ${formatSnapshotBytes(SNAPSHOT_MAX_OUTPUT_BYTES)}; los archivos mayores se bloquean.</div>`;
      if (options.focusFirst !== false) {
        const first = workspace.querySelector("[data-entry-option]") || workspace.querySelector("#snapshotSearch");
        if (first && document.contains(first) && snapshotModalIsOpen()) first.focus();
      }
    }

    function selectSnapshot(snapshotId) {
      const state = snapshotBrowserState;
      if (!state || !snapshotId) return;
      const selectedId = String(snapshotId);
      abortSnapshotPrefetches();
      clearSnapshotSearchTimer();
      invalidateSnapshotRequest(false);
      resetSnapshotDirectoryState(state);
      state.currentSnapshot = selectedId;
      state.currentPath = "/";
      state.entries = [];
      state.searchQuery = "";
      state.searchActive = false;
      state.view = "browser";
      state.notice = null;
      renderSnapshotList();
      browseSnapshot(selectedId, "/");
    }

    function moveSnapshotFocus(container, selector, key) {
      const options = Array.from(container.querySelectorAll(selector));
      if (!options.length) return;
      const currentIndex = options.indexOf(document.activeElement);
      let nextIndex = currentIndex;
      if (key === "ArrowDown" || key === "ArrowRight") nextIndex = currentIndex < 0 ? 0 : Math.min(options.length - 1, currentIndex + 1);
      if (key === "ArrowUp" || key === "ArrowLeft") nextIndex = currentIndex < 0 ? options.length - 1 : Math.max(0, currentIndex - 1);
      if (key === "Home") nextIndex = 0;
      if (key === "End") nextIndex = options.length - 1;
      if (nextIndex !== currentIndex && options[nextIndex] && document.contains(options[nextIndex])) {
        options[nextIndex].focus();
      }
    }

    function activateSnapshotEntry(option) {
      if (!option || !snapshotBrowserState) return;
      const path = option.dataset.entryPath;
      if (option.dataset.entryKind === "directory" && path) {
        browseSnapshot(snapshotBrowserState.currentSnapshot, path);
      }
    }

    function retrySnapshotAction() {
      const state = snapshotBrowserState;
      if (!state) return;
      state.notice = null;
      if (!state.currentSnapshot) {
        loadSnapshotsList(state.target);
      } else if (state.searchActive && state.searchQuery.length >= SNAPSHOT_SEARCH_MIN_LENGTH) {
        searchSnapshot(state.currentSnapshot, state.currentPath, state.searchQuery);
      } else {
        browseSnapshot(state.currentSnapshot, state.currentPath);
      }
    }

    function scheduleSnapshotSearch(value) {
      const state = snapshotBrowserState;
      if (!state || !state.currentSnapshot) return;
      clearSnapshotSearchTimer();
      state.searchQuery = String(value || "").trim();
      state.notice = null;
      resetSnapshotDirectoryState(state);
      if (!state.searchQuery) {
        state.searchActive = false;
        browseSnapshot(state.currentSnapshot, state.currentPath);
        return;
      }
      invalidateSnapshotRequest(false);
      if (state.searchQuery.length < SNAPSHOT_SEARCH_MIN_LENGTH) {
        state.searchActive = false;
        state.loading = false;
        state.notice = { kind: "pending", message: `Escribe al menos ${SNAPSHOT_SEARCH_MIN_LENGTH} caracteres para buscar.` };
        renderCurrentSnapshotBrowser(false);
        return;
      }
      state.searchActive = true;
      state.searchTimer = setTimeout(() => {
        state.searchTimer = null;
        searchSnapshot(state.currentSnapshot, state.currentPath, state.searchQuery);
      }, 250);
    }

    function handleSnapshotNavigationClick(event) {
      const state = snapshotBrowserState;
      if (!state) return;
      const refresh = event.target.closest("[data-snapshot-refresh]");
      if (refresh) { void refreshSnapshotCatalog(); return; }
      const retry = event.target.closest("[data-snapshot-retry]");
      if (retry) { void refreshSnapshotCatalog(); return; }
      const restore = event.target.closest("[data-snapshot-restore]");
      if (restore) {
        openRestoreFromSnapshotModal(restore.dataset.snapshotId, restore.dataset.snapshotDate);
        return;
      }
      const option = event.target.closest("[data-snapshot-option]");
      if (option && !event.target.closest("[data-snapshot-restore]")) selectSnapshot(option.dataset.snapshotId);
    }

    function handleSnapshotNavigationKeydown(event) {
      const list = event.currentTarget;
      if (event.target.closest("[data-snapshot-restore]")) return;
      const option = event.target.closest("[data-snapshot-option]");
      if (["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key)) {
        event.preventDefault();
        moveSnapshotFocus(list, "[data-snapshot-option]", event.key);
        return;
      }
      if (option && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        selectSnapshot(option.dataset.snapshotId);
      }
    }

    function handleSnapshotWorkspaceClick(event) {
      const state = snapshotBrowserState;
      if (!state) return;
      if (event.target.closest("[data-snapshot-cancel]")) { invalidateSnapshotRequest(true); return; }
      if (event.target.closest("[data-snapshot-retry]")) { retrySnapshotAction(); return; }
      if (event.target.closest("[data-snapshot-clear-search]")) {
        const search = document.getElementById("snapshotSearch");
        if (search) search.value = "";
        scheduleSnapshotSearch("");
        return;
      }
      if (event.target.closest("[data-snapshot-refresh-browser]")) {
        if (state.currentSnapshot) {
          if (state.searchActive) searchSnapshot(state.currentSnapshot, state.currentPath, state.searchQuery);
          else browseSnapshot(state.currentSnapshot, state.currentPath);
        }
        return;
      }
      if (event.target.closest("[data-snapshot-load-more]")) {
        void loadMoreSnapshotDirectory();
        return;
      }
      const breadcrumb = event.target.closest("[data-breadcrumb-path]");
      if (breadcrumb) { browseSnapshot(state.currentSnapshot, breadcrumb.dataset.breadcrumbPath); return; }
      const download = event.target.closest("[data-entry-download]");
      if (download && !download.disabled) {
        downloadSnapshotFile(state.currentSnapshot, download.dataset.downloadPath, download.dataset.entrySize);
        return;
      }
      const option = event.target.closest("[data-entry-option]");
      if (option && !event.target.closest("[data-entry-download]")) activateSnapshotEntry(option);
    }

    function handleSnapshotWorkspaceInput(event) {
      if (event.target && event.target.id === "snapshotSearch") scheduleSnapshotSearch(event.target.value);
    }

    function handleSnapshotWorkspaceKeydown(event) {
      if (event.target.closest("[data-entry-download]")) return;
      const option = event.target.closest("[data-entry-option]");
      const list = document.getElementById("snapshotEntryList");
      if (option && list && ["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key)) {
        event.preventDefault();
        moveSnapshotFocus(list, "[data-entry-option]", event.key);
        return;
      }
      if (option && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        if (option.dataset.entryKind === "directory") activateSnapshotEntry(option);
        else downloadSnapshotFile(snapshotBrowserState.currentSnapshot, option.dataset.entryPath, option.dataset.entrySize);
        return;
      }
      if (event.target && event.target.id === "snapshotSearch" && event.key === "Enter") {
        const query = event.target.value.trim();
        if (query.length >= SNAPSHOT_SEARCH_MIN_LENGTH) {
          clearSnapshotSearchTimer();
          searchSnapshot(snapshotBrowserState.currentSnapshot, snapshotBrowserState.currentPath, query);
        }
      }
    }

    function bindSnapshotModalEvents() {
      const state = snapshotBrowserState;
      const navigation = document.getElementById("snapshotNavigation");
      const list = document.getElementById("snapshotList");
      const workspace = document.getElementById("snapshotWorkspace");
      if (!state || !navigation || !list || !workspace) return;
      state.navigationElement = navigation;
      state.listElement = list;
      state.workspaceElement = workspace;
      navigation.addEventListener("click", handleSnapshotNavigationClick);
      list.addEventListener("keydown", handleSnapshotNavigationKeydown);
      workspace.addEventListener("click", handleSnapshotWorkspaceClick);
      workspace.addEventListener("input", handleSnapshotWorkspaceInput);
      workspace.addEventListener("keydown", handleSnapshotWorkspaceKeydown);
    }

    function renderSnapshotModalFrame() {
      const state = snapshotBrowserState;
      const overlay = state && state.overlay;
      if (!state || !overlay) return;
      overlay.innerHTML = `
        <div class="modal modal-snapshots" role="dialog" aria-modal="true" aria-labelledby="snapshotExplorerTitle" tabindex="-1">
          <div class="modal-header">
            <div><h3 id="snapshotExplorerTitle">Snapshots de ${escapeHtml(state.target.name)}</h3><div class="subtitle" style="font-size:12px; color:var(--muted-foreground); margin-top:2px;">Explora contenido inmutable del target seleccionado</div></div>
            <button type="button" class="close" data-snapshot-close aria-label="Cerrar Snapshot Explorer">&times;</button>
          </div>
          <div class="snapshot-explorer-shell">
            <aside class="snapshot-navigation" id="snapshotNavigation" aria-label="Target y snapshots">
              <div class="snapshot-target-card"><div class="snapshot-target-label">Target seleccionado</div><div class="snapshot-target-name">${escapeHtml(state.target.name || "Sin nombre")}</div><div class="snapshot-target-id">${escapeHtml(state.target.id || "")}</div></div>
               <div class="snapshot-navigation-header"><span class="snapshot-section-label">Snapshots</span><button type="button" class="btn ghost xs snapshot-refresh-button" data-snapshot-refresh data-snapshot-refresh-state="idle" aria-busy="false" aria-label="Refrescar lista de snapshots" title="Refrescar lista de snapshots"><span class="snapshot-refresh-spinner" data-snapshot-refresh-spinner aria-hidden="true"></span><span>Refrescar</span></button></div>
              <div class="snapshot-list" id="snapshotList" role="listbox" aria-label="Snapshots disponibles" tabindex="0" aria-busy="false"></div>
            </aside>
            <section class="snapshot-workspace" id="snapshotWorkspace" aria-label="Contenido del snapshot" aria-live="polite"></section>
          </div>
        </div>`;
      bindSnapshotModalEvents();
      renderSnapshotList();
      if (state.currentSnapshot && state.view === "browser") {
        if (state.loading) renderSnapshotWorkspaceLoading(state.searchActive ? "Buscando resultados..." : "Listando contenido...");
        else renderSnapshotBrowser(state.currentSnapshot, state.currentPath, state.entries, { focusFirst: false });
      } else {
        renderSnapshotWorkspaceIntro();
      }
    }

    async function openSnapshotsModal(target) {
      const overlay = document.getElementById("modalOverlay");
      if (!overlay || !target) return;
      if (snapshotBrowserState) closeSnapshotsModal();
      snapshotBrowserState = createSnapshotBrowserState(target);
      snapshotBrowserState.overlay = overlay;
      snapshotBrowserState.onOverlayClick = event => {
        if (event.target === overlay || event.target.closest("[data-snapshot-close]")) closeSnapshotsModal();
      };
      snapshotBrowserState.onOverlayKeydown = event => {
        if (event.key === "Escape") { event.preventDefault(); closeSnapshotsModal(); }
      };
      overlay.addEventListener("click", snapshotBrowserState.onOverlayClick);
      overlay.addEventListener("keydown", snapshotBrowserState.onOverlayKeydown);
      renderSnapshotModalFrame();
      overlay.classList.add("open");
      const closeButton = overlay.querySelector("[data-snapshot-close]");
      if (closeButton && document.contains(closeButton)) closeButton.focus();
      void loadSnapshotsList(target).then(() => {
        if (snapshotBrowserState && !snapshotBrowserState.closed && String(snapshotBrowserState.target.id) === String(target.id)) {
          void refreshSnapshotCatalog();
        }
      });
    }

    function closeSnapshotsModal() {
      const state = snapshotBrowserState;
      if (!state) return;
      state.closed = true;
      clearSnapshotSearchTimer();
      stopSnapshotCatalogRefresh();
      abortSnapshotCatalogRequest();
      abortSnapshotCatalogSync();
      setSnapshotCatalogRefreshBusy(false);
      state.requestSequence += 1;
      abortSnapshotRequest(state.activeRequest);
      abortSnapshotPrefetches();
      if (state.overlay) {
        if (state.onOverlayClick) state.overlay.removeEventListener("click", state.onOverlayClick);
        if (state.onOverlayKeydown) state.overlay.removeEventListener("keydown", state.onOverlayKeydown);
        state.overlay.classList.remove("open");
        state.overlay.innerHTML = "";
      }
      const returnFocus = state.returnFocus;
      snapshotBrowserState = null;
      if (returnFocus && typeof returnFocus.focus === "function" && document.contains(returnFocus)) returnFocus.focus();
    }

    async function loadSnapshotsList(target, options = {}) {
      const state = snapshotBrowserState;
      if (!state || state.closed || String(state.target.id) !== String(target.id)) return;
      if (options.background !== true) stopSnapshotCatalogRefresh();
      const request = beginSnapshotCatalogRequest();
      if (!request) return;
      state.catalogError = null;
      state.catalogStatus = state.snapshots.length ? "refreshing" : "loading";
      renderSnapshotList();
      if (!state.currentSnapshot) renderSnapshotWorkspaceIntro();
      const previousSnapshotIds = state.snapshots.map(snapshotItemId).join("\n");
      try {
        let payload;
        try {
          payload = await apiGet(`/api/v2/targets/${encodeURIComponent(target.id)}/snapshots`, { signal: request.controller.signal });
          if (!getSnapshotCatalogItems(payload)) throw unsupportedSnapshotResponse("Unsupported snapshot catalog response");
        } catch (error) {
          if (isSnapshotAbortError(error) || request.controller.signal.aborted) throw error;
          if (!isUnsupportedSnapshotError(error)) throw error;
          payload = await apiGet(`/api/v1/targets/${encodeURIComponent(target.id)}/snapshots`, { signal: request.controller.signal });
          if (!getSnapshotCatalogItems(payload)) throw new Error("Invalid snapshot catalog response");
        }
        if (!isCurrentSnapshotCatalogRequest(request)) return;
        const nextSnapshots = getSnapshotCatalogItems(payload).slice(0, SNAPSHOT_MAX_ENTRIES);
        const changed = previousSnapshotIds !== nextSnapshots.map(snapshotItemId).join("\n");
        state.snapshots = nextSnapshots;
        state.catalogStatus = snapshotCatalogStatus(payload);
        const stillExists = state.currentSnapshot && state.snapshots.some(item => snapshotItemId(item) === String(state.currentSnapshot));
        if (state.currentSnapshot && !stillExists) {
          state.currentSnapshot = null;
          state.currentPath = "/";
          state.entries = [];
          state.view = "list";
          state.notice = { kind: "deleted", message: "El snapshot seleccionado ya no existe." };
        }
        renderSnapshotList();
        if (!state.currentSnapshot) renderSnapshotWorkspaceIntro();
        return { changed, status: state.catalogStatus };
      } catch (error) {
        if (isSnapshotAbortError(error) || request.controller.signal.aborted || !isCurrentSnapshotCatalogRequest(request)) return;
        state.catalogStatus = error.status === 404 ? "deleted" : "error";
        state.catalogError = error.status === 404 ? "El target o su catalogo ya no existe." : String(error.message || error);
        renderSnapshotList();
        if (!state.currentSnapshot) {
          const workspace = document.getElementById("snapshotWorkspace");
          if (workspace) workspace.innerHTML = renderSnapshotState(state.catalogStatus, state.catalogError, { retry: true });
        } else {
          state.loading = false;
          state.notice = error.status === 404
            ? { kind: "deleted", message: "El target o snapshot seleccionado ya no existe.", retry: true }
            : { kind: "stale", message: "No se pudo actualizar el catalogo; se conserva la vista actual.", retry: true };
          renderCurrentSnapshotBrowser(false);
        }
      } finally {
        finishSnapshotCatalogRequest(request);
      }
    }

    async function refreshSnapshotCatalog() {
      const state = snapshotBrowserState;
      if (!state || state.closed) return;
      const syncRequest = beginSnapshotCatalogSyncRequest();
      if (!syncRequest) return;
      state.catalogError = null;
      state.catalogStatus = state.snapshots.length ? "refreshing" : "loading";
      renderSnapshotList();
      setSnapshotCatalogRefreshBusy(true, syncRequest);
      try {
        const syncJob = await apiPost(`/api/v1/targets/${encodeURIComponent(state.target.id)}/snapshots-sync`, { requested_by: "ui" }, { signal: syncRequest.controller.signal });
        const jobId = syncJob && (syncJob.job_id || syncJob.id);
        if (!jobId) throw unsupportedSnapshotResponse("Unsupported snapshot sync response");
        syncRequest.jobId = String(jobId);
        const syncResult = await pollSnapshotJob(syncRequest, { ...syncJob, job_id: syncRequest.jobId });
        const syncStatus = snapshotStatus(syncResult);
        if (!["succeeded", "success"].includes(syncStatus)) {
          const failure = new Error((syncResult && (syncResult.error || syncResult.result_summary && syncResult.result_summary.error)) || "El worker no pudo sincronizar el catalogo.");
          failure.status = syncResult && syncResult.status_code;
          failure.code = syncStatus === "failed" || syncStatus === "error" ? "snapshot-sync-failed" : "snapshot-sync-incomplete";
          throw failure;
        }
        if (!isCurrentSnapshotCatalogSyncRequest(syncRequest)) return;
        await loadSnapshotsList(state.target);
      } catch (error) {
        if (isSnapshotAbortError(error) || syncRequest.controller.signal.aborted) return;
        const timeout = error && error.code === "snapshot-poll-timeout";
        const failed = error && ["snapshot-sync-failed", "snapshot-sync-incomplete"].includes(error.code);
        const offline = !timeout && !failed && (!error || typeof error.status !== "number" || error.status === 0 || [400, 401, 404, 409, 502, 503, 504].includes(error.status));
        state.catalogStatus = timeout ? "timeout" : offline ? "offline" : "error";
        state.catalogError = String(error && error.message || error || "No se pudo sincronizar el catalogo.").slice(0, 300);
        renderSnapshotList();
        if (!state.currentSnapshot) {
          const workspace = document.getElementById("snapshotWorkspace");
          if (workspace) workspace.innerHTML = renderSnapshotState(state.catalogStatus, state.catalogError, { retry: true });
        } else {
          state.notice = { kind: state.catalogStatus, message: `No se pudo actualizar el catalogo: ${state.catalogError}`, retry: true };
          renderCurrentSnapshotBrowser(false);
        }
      } finally {
        setSnapshotCatalogRefreshBusy(false, syncRequest);
        finishSnapshotCatalogSyncRequest(syncRequest);
      }
    }

    function showSnapshotOperationError(request, error) {
      const state = snapshotBrowserState;
      if (!state || !isCurrentSnapshotRequest(request)) return;
      state.loading = false;
      state.loadingMore = false;
      let kind = "error";
      let message = String(error && error.message || error || "No se pudo completar la operacion.");
      if (error && error.code === "snapshot-poll-timeout") kind = "indexing";
      else if (error && error.status === 404) { kind = "deleted"; message = "El target o snapshot ya no existe."; }
      state.notice = { kind, message, retry: true };
      renderCurrentSnapshotBrowser(false);
    }

    function showSnapshotResultError(request, result) {
      const state = snapshotBrowserState;
      if (!state || !isCurrentSnapshotRequest(request)) return;
      const status = snapshotStatus(result);
      if (status === "canceled" || status === "cancelled") {
        state.notice = { kind: "canceled", message: result.error || "La operacion fue cancelada.", retry: true };
      } else if (status === "deleted" || status === "missing") {
        state.notice = { kind: "deleted", message: result.error || "El target o snapshot ya no existe.", retry: true };
      } else {
        state.notice = { kind: "error", message: result.error || "El worker no pudo listar el snapshot.", retry: true };
      }
      state.loading = false;
      state.loadingMore = false;
      renderCurrentSnapshotBrowser(false);
    }

    function isSuccessfulSnapshotResult(result) {
      const status = snapshotStatus(result);
      return status === "succeeded" || status === "success" || (!status && !result.error);
    }

    function isWarmSnapshotResult(result) {
      const source = String(result && result.source || "").toLowerCase();
      return Boolean(result && result.cache_hit === true) || ["redis", "local", "memory"].includes(source);
    }

    async function browseSnapshot(snapshotId, path) {
      const state = snapshotBrowserState;
      if (!state || !snapshotId) return;
      let normalizedPath;
      try { normalizedPath = normalizeSnapshotPath(path); } catch (error) { return; }
      abortSnapshotPrefetches();
      clearSnapshotSearchTimer();
      state.currentSnapshot = String(snapshotId);
      state.currentPath = normalizedPath;
      state.searchQuery = "";
      state.searchActive = false;
      state.view = "browser";
      resetSnapshotDirectoryState(state);
      state.loading = true;
      state.notice = null;
      const request = beginSnapshotRequest("browse", state.currentSnapshot, normalizedPath);
      renderSnapshotList();
      renderSnapshotWorkspaceLoading("Listando contenido...");
      const cachedDirectory = getCachedSnapshotDirectory(state.currentSnapshot, normalizedPath);
      const requestedLimit = cachedDirectory ? cachedDirectory.loadedLimit : SNAPSHOT_PAGE_SIZE;
      state.directoryLoadedLimit = requestedLimit;
      state.directoryHasMore = cachedDirectory ? cachedDirectory.hasMore : false;
      if (cachedDirectory && isCurrentSnapshotRequest(request)) {
        state.entries = cachedDirectory.entries;
        state.loading = false;
        state.notice = { kind: "stale", message: "Mostrando datos en cache mientras se actualiza el directorio." };
        renderSnapshotBrowser(state.currentSnapshot, normalizedPath, cachedDirectory.entries, { focusFirst: false });
      }
      try {
        const result = await requestSnapshotOperation(request, "browse", {
          snapshot_id: state.currentSnapshot,
          path: normalizedPath,
          request_id: `ui-${request.seq}`,
          max_entries: requestedLimit,
        }, legacyBrowseSnapshot);
        if (!isCurrentSnapshotRequest(request)) return;
        if (!isSuccessfulSnapshotResult(result)) { showSnapshotResultError(request, result); return; }
        const resultEntries = Array.isArray(result.entries) ? result.entries : [];
        state.entries = resultEntries.slice(0, SNAPSHOT_MAX_DIRECTORY_ENTRIES);
        state.directoryLoadedLimit = requestedLimit;
        state.directoryHasMore = resultEntries.length >= requestedLimit && requestedLimit < SNAPSHOT_MAX_DIRECTORY_ENTRIES;
        cacheSnapshotDirectory(state.currentSnapshot, normalizedPath, state.entries, requestedLimit, state.directoryHasMore);
        state.loading = false;
        state.loadingMore = false;
        state.notice = null;
        renderSnapshotBrowser(state.currentSnapshot, normalizedPath, state.entries);
        if (isWarmSnapshotResult(result)) {
          prefetchSnapshotDirectories(state.currentSnapshot, normalizedPath, state.entries);
        }
      } catch (error) {
        if (!isSnapshotAbortError(error)) showSnapshotOperationError(request, error);
      } finally {
        finishSnapshotRequest(request);
      }
    }

    async function loadMoreSnapshotDirectory() {
      const state = snapshotBrowserState;
      if (!state || state.closed || !state.currentSnapshot || state.loading || state.loadingMore || state.searchActive || !state.directoryHasMore) return;
      const currentLimit = normalizeSnapshotDirectoryLimit(state.directoryLoadedLimit);
      const nextLimit = Math.min(currentLimit + SNAPSHOT_PAGE_SIZE, SNAPSHOT_MAX_DIRECTORY_ENTRIES);
      if (nextLimit <= currentLimit) {
        state.directoryHasMore = false;
        renderCurrentSnapshotBrowser(false);
        return;
      }
      const snapshotId = String(state.currentSnapshot);
      const normalizedPath = normalizeSnapshotPath(state.currentPath);
      state.directoryLoadedLimit = currentLimit;
      state.loadingMore = true;
      state.notice = null;
      const request = beginSnapshotRequest("browse", snapshotId, normalizedPath);
      if (!request) {
        state.loadingMore = false;
        return;
      }
      renderCurrentSnapshotBrowser(false);
      try {
        const result = await requestSnapshotOperation(request, "browse", {
          snapshot_id: snapshotId,
          path: normalizedPath,
          request_id: `ui-${request.seq}`,
          max_entries: nextLimit,
        }, legacyBrowseSnapshot);
        if (!isCurrentSnapshotRequest(request)) return;
        if (!isSuccessfulSnapshotResult(result)) { showSnapshotResultError(request, result); return; }
        const resultEntries = Array.isArray(result.entries) ? result.entries : [];
        state.entries = resultEntries.slice(0, SNAPSHOT_MAX_DIRECTORY_ENTRIES);
        state.directoryLoadedLimit = nextLimit;
        state.directoryHasMore = resultEntries.length >= nextLimit && nextLimit < SNAPSHOT_MAX_DIRECTORY_ENTRIES;
        cacheSnapshotDirectory(snapshotId, normalizedPath, state.entries, nextLimit, state.directoryHasMore);
        state.loadingMore = false;
        state.notice = null;
        renderSnapshotBrowser(snapshotId, normalizedPath, state.entries, { focusFirst: false });
        if (isWarmSnapshotResult(result)) prefetchSnapshotDirectories(snapshotId, normalizedPath, state.entries);
      } catch (error) {
        if (!isSnapshotAbortError(error)) {
          state.loadingMore = false;
          showSnapshotOperationError(request, error);
        }
      } finally {
        finishSnapshotRequest(request);
      }
    }

    async function searchSnapshot(snapshotId, path, query) {
      const state = snapshotBrowserState;
      if (!state || !snapshotId || String(query || "").trim().length < SNAPSHOT_SEARCH_MIN_LENGTH) return;
      const normalizedPath = normalizeSnapshotPath(path);
      const normalizedQuery = String(query).trim();
      const matchesCurrentDirectory = String(state.currentSnapshot || "") === String(snapshotId)
        && normalizeSnapshotPath(state.currentPath) === normalizedPath;
      const localSource = matchesCurrentDirectory ? state.entries.slice(0, SNAPSHOT_MAX_ENTRIES).filter(entry => {
        const normalized = normalizeSnapshotEntry(entry);
        return normalized && (normalized.path === normalizedPath || normalized.path.startsWith(normalizedPath === "/" ? "/" : `${normalizedPath}/`));
      }) : [];
      const useLocalSearch = matchesCurrentDirectory && state.entries.length < SNAPSHOT_MAX_ENTRIES;
      abortSnapshotPrefetches();
      clearSnapshotSearchTimer();
      resetSnapshotDirectoryState(state);
      state.currentSnapshot = String(snapshotId);
      state.currentPath = normalizedPath;
      state.searchQuery = normalizedQuery;
      state.searchActive = true;
      state.view = "browser";
      state.notice = null;
      const request = beginSnapshotRequest("search", state.currentSnapshot, normalizedPath);
      if (useLocalSearch) {
        const needle = normalizedQuery.toLowerCase();
        const localResults = localSource.filter(entry => {
          const normalized = normalizeSnapshotEntry(entry);
          return normalized && (normalized.path.toLowerCase().includes(needle) || normalized.name.toLowerCase().includes(needle));
        }).slice(0, SNAPSHOT_MAX_ENTRIES);
        if (!isCurrentSnapshotRequest(request)) {
          finishSnapshotRequest(request);
          return;
        }
        state.entries = localResults;
        state.loading = false;
        state.notice = localResults.length ? null : { kind: "no-match", message: "No se encontraron entradas para esta busqueda." };
        renderSnapshotBrowser(state.currentSnapshot, normalizedPath, state.entries);
        finishSnapshotRequest(request);
        return;
      }
      state.loading = true;
      renderSnapshotWorkspaceLoading("Buscando resultados...");
      try {
        const result = await requestSnapshotOperation(request, "search", {
          snapshot_id: state.currentSnapshot,
          path: normalizedPath,
          query: normalizedQuery,
          max_entries: SNAPSHOT_MAX_ENTRIES,
        }, null);
        if (!isCurrentSnapshotRequest(request)) return;
        if (!isSuccessfulSnapshotResult(result)) { showSnapshotResultError(request, result); return; }
        state.entries = Array.isArray(result.entries) ? result.entries.slice(0, SNAPSHOT_MAX_ENTRIES) : [];
        state.loading = false;
        state.notice = state.entries.length ? null : { kind: "no-match", message: "No se encontraron entradas para esta busqueda." };
        renderSnapshotBrowser(state.currentSnapshot, normalizedPath, state.entries);
      } catch (error) {
        if (isSnapshotAbortError(error)) return;
        if (isUnsupportedSnapshotError(error)) {
          const localResults = localSource.filter(entry => {
            const normalized = normalizeSnapshotEntry(entry);
            return normalized && (normalized.path.toLowerCase().includes(normalizedQuery.toLowerCase()) || normalized.name.toLowerCase().includes(normalizedQuery.toLowerCase()));
          }).slice(0, SNAPSHOT_MAX_ENTRIES);
          if (isCurrentSnapshotRequest(request)) {
            state.entries = localResults;
            state.loading = false;
            state.notice = { kind: "stale", message: "La busqueda remota no esta disponible; se muestran resultados locales acotados." };
            renderSnapshotBrowser(state.currentSnapshot, normalizedPath, state.entries);
          }
        } else {
          showSnapshotOperationError(request, error);
        }
      } finally {
        finishSnapshotRequest(request);
      }
    }

    function classifySnapshotDownloadFailure(result) {
      const text = String(result && result.error || "").toLowerCase();
      if (result && (result.oversized || result.truncated || /size|large|limit|cap|oversiz|too big|truncat/.test(text))) return "oversized";
      if (result && result.blocked) return "blocked";
      return "error";
    }

    }

    async function downloadSnapshotFile(snapshotId, filePath, knownSize) {
      const state = snapshotBrowserState;
      if (!state || !snapshotId || !filePath) return;
      const normalizedPath = normalizeSnapshotPath(filePath);
      const numericKnownSize = Number(knownSize);
      if (Number.isFinite(numericKnownSize) && numericKnownSize > SNAPSHOT_MAX_OUTPUT_BYTES) {
        state.notice = { kind: "oversized", message: `El archivo excede el limite de ${formatSnapshotBytes(SNAPSHOT_MAX_OUTPUT_BYTES)} y fue bloqueado.`, retry: false };
        renderCurrentSnapshotBrowser(false);
        return;
      }
      abortSnapshotPrefetches();
      const request = beginSnapshotRequest("dump", String(snapshotId), state.currentPath);
      state.loading = true;
      state.notice = { kind: "loading", message: "Preparando descarga acotada..." };
      renderCurrentSnapshotBrowser(false);
      try {
        const result = await requestSnapshotOperation(request, "dump", {
          snapshot_id: String(snapshotId),
          path: normalizedPath,
          archive: false,
          max_output_bytes: SNAPSHOT_MAX_OUTPUT_BYTES,
        }, legacyDumpSnapshot);
        if (!isCurrentSnapshotRequest(request)) return;
        const status = snapshotStatus(result);
        if (status === "canceled" || status === "cancelled") {
          state.loading = false;
          state.notice = { kind: "canceled", message: "La descarga fue cancelada.", retry: true };
          renderCurrentSnapshotBrowser(false);
          return;
        }
        if (!isSuccessfulSnapshotResult(result) || !result.b64_content) {
          state.loading = false;
          const kind = classifySnapshotDownloadFailure(result);
          state.notice = { kind, message: result.error || (kind === "oversized" ? "El archivo excede el limite de descarga." : "La descarga fue bloqueada."), retry: true };
          renderCurrentSnapshotBrowser(false);
          return;
        }
        if (result.b64_content.length > SNAPSHOT_MAX_BASE64_LENGTH || result.oversized || result.truncated || result.blocked) {
          state.loading = false;
          state.notice = { kind: result.blocked && !result.oversized ? "blocked" : "oversized", message: "La respuesta excede el limite seguro de descarga y no se guardo.", retry: true };
          renderCurrentSnapshotBrowser(false);
          return;
        }
        const binary = atob(result.b64_content);
        if (binary.length > SNAPSHOT_MAX_OUTPUT_BYTES) throw Object.assign(new Error("El archivo excede el limite de descarga."), { code: "snapshot-oversized" });
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        const blob = new Blob([bytes], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = normalizedPath.split("/").pop() || "download";
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
        URL.revokeObjectURL(url);
        state.loading = false;
        state.notice = { kind: "ready", message: "Descarga iniciada. El contenido no se renderiza en el navegador." };
        renderCurrentSnapshotBrowser(false);
      } catch (error) {
        if (!isSnapshotAbortError(error) && isCurrentSnapshotRequest(request)) {
          state.loading = false;
          state.notice = { kind: error.code === "snapshot-oversized" ? "oversized" : "error", message: String(error.message || error), retry: true };
          renderCurrentSnapshotBrowser(false);
        }
      } finally {
        finishSnapshotRequest(request);
      }
    }

    function prefetchSnapshotDirectories(snapshotId, path, entries) {
      const state = snapshotBrowserState;
      if (!state || !snapshotModalIsOpen()) return;
      const directories = normalizeSnapshotEntries(entries).filter(entry => entry.isDir && isImmediateSnapshotChild(entry.path, path)).slice(0, SNAPSHOT_PREFETCH_LIMIT);
      for (const directory of directories) {
        if (state.prefetchControllers.size >= SNAPSHOT_PREFETCH_LIMIT) break;
        const key = snapshotCacheKey(state.target.id, snapshotId, directory.path);
        if (state.directoryCache.has(key) || state.prefetchControllers.has(key)) continue;
        const controller = new AbortController();
        const request = { kind: "prefetch", seq: state.requestSequence, targetId: String(state.target.id), snapshotId: String(snapshotId), path: directory.path, controller, jobId: null, cancelSent: false };
        state.prefetchControllers.set(key, { controller, request });
        requestSnapshotOperation(request, "browse", {
          snapshot_id: String(snapshotId),
          path: directory.path,
          request_id: `prefetch-${request.seq}`,
          max_entries: SNAPSHOT_PAGE_SIZE,
        }, legacyBrowseSnapshot).then(result => {
          if (controller.signal.aborted || !snapshotModalIsOpen() || !snapshotBrowserState || String(snapshotBrowserState.target.id) !== String(request.targetId)) return;
          if (isSuccessfulSnapshotResult(result)) {
            const resultEntries = Array.isArray(result.entries) ? result.entries : [];
            cacheSnapshotDirectory(snapshotId, directory.path, resultEntries, SNAPSHOT_PAGE_SIZE, resultEntries.length >= SNAPSHOT_PAGE_SIZE && SNAPSHOT_PAGE_SIZE < SNAPSHOT_MAX_DIRECTORY_ENTRIES);
          }
        }).catch(() => {}).finally(() => {
          if (snapshotBrowserState) snapshotBrowserState.prefetchControllers.delete(key);
        });
      }
    }

    function cronDescribe(cronExpr) {
      const parts = cronExpr.trim().split(/\s+/);
      if (parts.length !== 5) return "";
      const [m, h, dom, mon, dow] = parts;
      if (m === "*" && h === "*" && dom === "*" && mon === "*" && dow === "*") return "cada minuto";
      const timeStr = (hh, mm) => `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
      if (m !== "*" && h !== "*" && !m.includes("/") && !h.includes("/") && dom === "*" && mon === "*" && dow === "*") {
        return `diario a las ${timeStr(parseInt(h,10), parseInt(m,10))}`;
      }
      if (m !== "*" && h !== "*" && !m.includes("/") && !h.includes("/") && dom === "*" && mon === "*" && dow !== "*") {
        const days = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
        const d = parseInt(dow,10) % 7;
        return `cada ${days[d]||""} a las ${timeStr(parseInt(h,10), parseInt(m,10))}`;
      }
      if (m !== "*" && h === "*" && dom === "*" && mon === "*" && dow === "*") {
        return `cada hora en el minuto ${parseInt(m,10)}`;
      }
      if (h.includes("*/") && m === "0" && dom === "*" && mon === "*" && dow === "*") {
        const every = parseInt(h.split("/")[1],10);
        return `cada ${every} horas`;
      }
      if (m.includes("*/") && h === "*" && dom === "*" && mon === "*" && dow === "*") {
        const every = parseInt(m.split("/")[1],10);
        return `cada ${every} minutos`;
      }
      if (dom !== "*" && mon === "*" && m !== "*" && h !== "*") {
        return `el dia ${dom} de cada mes a las ${timeStr(parseInt(h,10), parseInt(m,10))}`;
      }
      return `cron: ${cronExpr}`;
    }

    const cronPreviewRequests = {};

    async function updateCronPreview(inputId, previewId, targetId, targetContext) {
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);
      if (!input || !preview) return;
      const expr = input.value.trim();
      const requestId = (cronPreviewRequests[previewId] || 0) + 1;
      cronPreviewRequests[previewId] = requestId;
      const query = new URLSearchParams();
      if (targetId) query.set("target_id", targetId);
      if (targetContext) query.set("target_context", "true");
      query.set("cron_expression", expr);
      preview.innerHTML = '<span class="cron-next">Consultando scheduler...</span>';
      try {
        const result = await apiGet(`/api/v1/scheduler/preview?${query.toString()}`);
        if (cronPreviewRequests[previewId] !== requestId || !document.contains(preview)) return;
        const timeZone = result.scheduler_timezone || state.schedulerTimezone || "";
        const zoneLabel = timeZone ? `Zona del scheduler: ${timeZone}` : "Zona del scheduler no disponible";
        if (!result.effective_cron_expression) {
          preview.innerHTML = `<span class="cron-manual">Solo manual (sin cron)</span><br><span class="helper">${escapeHtml(zoneLabel)}</span>`;
          return;
        }
        if (result.cron_valid === false) {
          preview.innerHTML = `<span class="cron-error">Expresion cron invalida</span><br><span class="helper">${escapeHtml(zoneLabel)}</span>`;
          return;
        }
        const next = result.next_scheduled_at ? new Date(result.next_scheduled_at) : null;
        if (!next || Number.isNaN(next.getTime())) {
          preview.innerHTML = `<span class="cron-error">No se encontro proxima ejecucion valida</span><br><span class="helper">${escapeHtml(zoneLabel)}</span>`;
          return;
        }
        const desc = cronDescribe(result.effective_cron_expression);
        const diffMs = next.getTime() - Date.now();
        const diffMin = Math.round(diffMs / 60000);
        let inStr;
        if (diffMin < 1) inStr = "ahora";
        else if (diffMin < 60) inStr = `en ${diffMin} min`;
        else if (diffMin < 1440) inStr = `en ${Math.floor(diffMin/60)}h ${diffMin%60}m`;
        else inStr = `en ${Math.floor(diffMin/1440)}d ${Math.floor((diffMin%1440)/60)}h`;
        const dateStr = fmtSchedulerDate(result.next_scheduled_at, timeZone);
        const source = cronSourceLabel(result.cron_source);
        preview.innerHTML = `<span class="cron-badge">Cron ${escapeHtml(source)}: ${escapeHtml(desc)}</span><br><span class="cron-next">Proxima: <strong>${escapeHtml(dateStr)}</strong> (${inStr})</span><br><span class="helper">${escapeHtml(zoneLabel)}</span>`;
      } catch (e) {
        if (cronPreviewRequests[previewId] !== requestId || !document.contains(preview)) return;
        preview.innerHTML = '<span class="cron-error">No se pudo consultar el scheduler</span>';
      }
    }
