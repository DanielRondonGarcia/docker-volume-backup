    function closeTargetModal() {
      const overlay = document.getElementById("modalOverlay");
      if (overlay) { overlay.innerHTML = ""; overlay.classList.remove("active"); }
      targetModalState = { mode: "create", target: null, volumeProject: null, isEditing: false };
    }

    let jobPollTimer = null;
    let currentLogJobId = null;
    let currentLogTargetId = null;
    let currentLogJobSnapshot = null;
    let targetJobEventSource = null;
    const LOG_POLL_MAX_FAILURES = 5;
    const LOG_POLL_FAILURE_WINDOW_MS = 60000;

    function setJobLiveState(root, text, stateName) {
      const status = root ? root.querySelector("[data-job-live-state]") : null;
      if (!status) return;
      status.dataset.state = stateName || "idle";
      const label = String(text || "Estado del job");
      status.setAttribute("aria-label", label);
      status.title = label;
    }

    function mergeJobProjection(job) {
      if (!job || !job.id) return job;
      const jobs = Array.isArray(state.jobs) ? state.jobs : [];
      const index = jobs.findIndex(item => item.id === job.id);
      if (index < 0) {
        state.jobs = [job, ...jobs];
      } else {
        state.jobs = jobs.map((item, itemIndex) => itemIndex === index ? job : item);
      }
      return job;
    }

    function connectJobEvents(jobId, { isActive, onJob, onState, onFallback }) {
      const fallback = () => {
        onState("fallback");
        onFallback();
      };
      if (typeof EventSource !== "function") {
        fallback();
        return null;
      }

      let closed = false;
      let source;
      const close = () => {
        if (closed) return;
        closed = true;
        if (source) source.close();
      };
      try {
        source = new EventSource(`/api/v1/jobs/${encodeURIComponent(jobId)}/events`, { withCredentials: true });
      } catch (error) {
        fallback();
        return null;
      }
      source.onopen = () => {
        if (!closed && isActive()) onState("live");
      };
      source.onmessage = (event) => {
        if (closed || !isActive()) return;
        let job;
        try {
          job = JSON.parse(event.data);
        } catch (error) {
          close();
          fallback();
          return;
        }
        if (!job || String(job.id) !== String(jobId)) {
          close();
          fallback();
          return;
        }
        onJob(job);
        if (isTerminalJobStatus(job.status)) close();
      };
      source.onerror = () => {
        if (closed) return;
        close();
        if (isActive()) fallback();
      };
      return close;
    }

    function renderLogPollingError(container, message, retryHandler) {
      if (!container) return;
      const safeMessage = escapeHtml(String(message || "No se pudo cargar el log.").slice(0, 240));
      container.innerHTML = `<div class="log-line error">No se pudieron cargar los logs: ${safeMessage}</div>${retryHandler ? '<button type="button" class="btn ghost xs" data-log-poll-retry>Reintentar</button>' : ""}`;
      const retry = container.querySelector("[data-log-poll-retry]");
      if (retry && retryHandler) retry.addEventListener("click", retryHandler);
    }

    function isTerminalJobStatus(status) {
      const terminalStatuses = ["succeeded", "failed", "canceled", "cancelled"];
      return terminalStatuses.includes(String(status || "").toLowerCase()) || terminalStatuses.includes(normalizeJobStatus(status));
    }

    function targetLogDomKey(value) {
      return String(value || "job").replace(/[^a-zA-Z0-9_-]/g, "-");
    }

    function targetLogRowId(targetId) {
      return `target-log-row-${targetLogDomKey(targetId)}`;
    }

    function targetLogContentId(targetId) {
      return `target-log-content-${targetLogDomKey(targetId)}`;
    }

    function targetLogHeadingId(targetId) {
      return `target-log-heading-${targetLogDomKey(targetId)}`;
    }

    function targetLogPanelMarkup(jobId, targetId) {
      const existingJob = (state.jobs || []).find(j => j.id === jobId);
      const target = targetId ? state.targets.find(t => t.id === targetId) : null;
      const status = normalizeJobStatus(existingJob ? existingJob.status : "pending");
      const targetLabel = target ? target.name : (targetId || "job");
      const key = targetLogDomKey(targetId || jobId);
      const statusId = `target-log-status-${key}`;
      const containerId = `target-log-container-${key}`;
      const closeId = `target-log-close-${key}`;
      return `
        <div class="log-panel">
          <div class="log-panel-header">
            <div class="log-panel-title">
              <h3 id="${targetLogHeadingId(targetId)}">Logs: ${escapeHtml(targetLabel)}</h3>
              <div class="job-status-bar" id="${statusId}" data-target-log-status>
                <span class="job-status-pill ${status}">${escapeHtml(jobStatusLabel(status))}</span>
                <span class="job-meta">Job: ${escapeHtml(jobId)}</span>
                <span class="job-live-indicator" data-job-live-state data-state="connecting" role="status" aria-live="polite" aria-label="Conectando…" title="Conectando…"></span>
              </div>
            </div>
            <button type="button" class="btn ghost xs" id="${closeId}" data-target-log-close aria-label="Cerrar logs de ${escapeHtml(targetLabel)}">Cerrar</button>
          </div>
          <div class="log-container" id="${containerId}" data-target-log-container><div class="log-line info">Cargando logs...</div></div>
        </div>

    function renderTargetLogDetailRow(target) {
      const targetId = target.id;
      return `<tr class="target-log-row" id="${targetLogRowId(targetId)}" data-target-log-row="${escapeHtml(targetId)}">
        <td colspan="9">
          <div class="target-log-content" id="${targetLogContentId(targetId)}" role="region" aria-live="polite" aria-labelledby="${targetLogHeadingId(targetId)}">
            ${targetLogPanelMarkup(currentLogJobId, targetId)}
          </div>
        </td>
      </tr>`;

    function bindTargetLogClose(root) {
      const closeButton = root ? root.querySelector("[data-target-log-close]") : null;
      if (closeButton) closeButton.addEventListener("click", closeLogPanel);
    }

    function renderTargetJobLogsInto(job, root) {
      if (!root) return;
      const statusEl = root.querySelector("[data-target-log-status]");
      if (statusEl) {
        const status = normalizeJobStatus(job.status);
        const pill = statusEl.querySelector(".job-status-pill");
        if (pill) {
          pill.className = `job-status-pill ${status}`;
          pill.textContent = jobStatusLabel(status);
        }
        const meta = statusEl.querySelector(".job-meta");
        if (meta) meta.textContent = `Job: ${job.id}`;
      }
      const container = root.querySelector("[data-target-log-container]");
      if (!container) return;
      const lines = job.log_lines || [];
      const progressMarkup = renderJobProgress(job);
      const storageMarkup = renderJobStorageContext(job);
      if (!lines.length) {
        const terminal = isTerminalJobStatus(job.status);
        container.innerHTML = `${progressMarkup}${storageMarkup}<div class="log-line info">${terminal ? "Sin logs disponibles para esta ejecucion." : "Esperando logs del worker..."}</div>`;
        return;
      }
      container.innerHTML = `${progressMarkup}${storageMarkup}${lines.map(line => {
        const lower = line.toLowerCase();
        let cls = "info";
        if (lower.includes("error") || lower.includes("err:") || lower.includes("failed") || lower.includes("traceback") || lower.includes("exception")) cls = "error";
        else if (lower.includes("warn") || lower.includes("warning")) cls = "warning";
        else if (lower.includes("info") || lower.includes("status") || lower.includes("starting") || lower.includes("success") || lower.includes("snapshot") || lower.includes("backup")) cls = "info";
        return `<div class="log-line ${cls}">${escapeHtml(line)}</div>`;
      }).join("")}`;
      container.scrollTop = container.scrollHeight;
    }

    function getTargetLogHost() {
      const targetsTable = document.querySelector(".targets-table");
      if (targetsTable) {
        return currentLogTargetId ? document.getElementById(targetLogContentId(currentLogTargetId)) : null;
      }
      return document.getElementById("targetLogPanel");
    }

    function ensureTargetLogFallback() {
      let panel = document.getElementById("targetLogPanel");
      if (panel) return panel;
      const content = document.getElementById("content");
      if (!content) return null;
      panel = document.createElement("div");
      panel.id = "targetLogPanel";
      content.appendChild(panel);
      return panel;
    }

    function renderTargetLogPanelInto(host, jobId, targetId) {
      if (!host) return null;
      host.innerHTML = targetLogPanelMarkup(jobId, targetId);
      if (host.id === "targetLogPanel") host.classList.add("active");
      bindTargetLogClose(host);
      const existingJob = (state.jobs || []).find(j => j.id === jobId);
      const job = existingJob || (currentLogJobSnapshot && currentLogJobSnapshot.id === jobId ? currentLogJobSnapshot : null);
      if (job) renderTargetJobLogsInto(job, host);
      return host;
    }

    function openLogPanel(jobId, targetId) {
      if (jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
      stopTargetJobEvents();
      const existingJob = (state.jobs || []).find(j => j.id === jobId);
      const tid = targetId || (existingJob ? existingJob.target_id : null);
      currentLogJobId = jobId;
      currentLogTargetId = tid || null;
      currentLogJobSnapshot = existingJob || null;
      const targetsTable = document.querySelector(".targets-table");
      if (targetsTable) {
        const target = tid ? state.targets.find(t => String(t.id) === String(tid)) : null;
        if (!target) { closeLogPanel(); return; }
        renderTargetsTableBody();
        const host = getTargetLogHost();
        if (!host) { closeLogPanel(); return; }
        renderTargetLogPanelInto(host, jobId, tid);
      } else {
        const panel = ensureTargetLogFallback();
        if (!panel) { closeLogPanel(); return; }
        renderTargetLogPanelInto(panel, jobId, tid);
      }
      if (existingJob && isTerminalJobStatus(existingJob.status)) {
        setJobLiveState(getTargetLogHost(), "Finalizado", "terminal");
      } else {
        startTargetJobEvents(jobId);
      }
    }

    function closeLogPanel() {
      if (jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
      stopTargetJobEvents();
      const targetId = currentLogTargetId;
      currentLogJobId = null;
      currentLogTargetId = null;
      currentLogJobSnapshot = null;
      if (targetId) {
        const row = document.getElementById(targetLogRowId(targetId));
        if (row) row.remove();
      }
      const panel = document.getElementById("targetLogPanel");
      if (panel) { panel.innerHTML = ""; panel.classList.remove("active"); }
    }

    function reopenLogPanel(jobId, targetId) {
      if (!jobId) return;
      if (jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
      stopTargetJobEvents();
      const existingJob = (state.jobs || []).find(j => j.id === jobId);
      const tid = targetId || (existingJob ? existingJob.target_id : null);
      currentLogJobId = jobId;
      currentLogTargetId = tid || null;
      currentLogJobSnapshot = existingJob || (currentLogJobSnapshot && currentLogJobSnapshot.id === jobId ? currentLogJobSnapshot : null);
      const targetsTable = document.querySelector(".targets-table");
      if (targetsTable) {
        const target = tid ? state.targets.find(t => String(t.id) === String(tid)) : null;
        if (!target) { closeLogPanel(); return; }
        if (!document.getElementById(targetLogContentId(tid))) renderTargetsTableBody();
        const host = getTargetLogHost();
        if (!host) { closeLogPanel(); return; }
        renderTargetLogPanelInto(host, jobId, tid);
      } else {
        const panel = ensureTargetLogFallback();
        if (!panel) { closeLogPanel(); return; }
        renderTargetLogPanelInto(panel, jobId, tid);
      }
      const knownJob = existingJob || currentLogJobSnapshot;
      if (!knownJob || !isTerminalJobStatus(knownJob.status)) startTargetJobEvents(jobId);
      else setJobLiveState(getTargetLogHost(), "Finalizado", "terminal");
    }

    function renderJobLogs(job) {
      const host = getTargetLogHost();
      if (host) renderTargetJobLogsInto(job, host);
    }

    function stopTargetJobEvents() {
      if (targetJobEventSource) targetJobEventSource();
      targetJobEventSource = null;
    }

    function startTargetJobEvents(jobId) {
      stopTargetJobEvents();
      const fallback = () => {
        targetJobEventSource = null;
        const knownJob = (state.jobs || []).find(j => j.id === jobId);
        if (currentLogJobId === jobId && (!knownJob || !isTerminalJobStatus(knownJob.status))) pollJobLogs(jobId);
      };
      targetJobEventSource = connectJobEvents(jobId, {
        isActive: () => currentLogJobId === jobId,
        onState: (connectionState) => {
          const host = getTargetLogHost();
          if (!host) return;
          setJobLiveState(
            host,
            connectionState === "live" ? "En vivo" : "Actualizando por polling",
            connectionState,
          );
        },
        onJob: (job) => {
          mergeJobProjection(job);
          currentLogJobSnapshot = job;
          renderJobLogs(job);
          if (isTerminalJobStatus(job.status)) {
            stopTargetJobEvents();
            if (jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
            setJobLiveState(getTargetLogHost(), "Finalizado", "terminal");
            scheduleSnapshotCatalogRefreshAfterBackup(job);
            void refreshAll();
          }
        },
        onFallback: fallback,
      });
    }

    function pollJobLogs(jobId) {
      if (jobPollTimer) clearInterval(jobPollTimer);
      let failures = 0;
      let firstFailureAt = 0;
      const fetchJob = async () => {
        if (currentLogJobId !== jobId) return;
        try {
          setJobLiveState(getTargetLogHost(), "Actualizando por polling", "fallback");
          const job = await apiGet(`/api/v1/jobs/${jobId}`);
          if (currentLogJobId !== jobId) return;
          failures = 0;
          firstFailureAt = 0;
          currentLogJobSnapshot = job;
          renderJobLogs(job);
          if (isTerminalJobStatus(job.status)) {
            if (jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
            stopTargetJobEvents();
            setJobLiveState(getTargetLogHost(), "Finalizado", "terminal");
            scheduleSnapshotCatalogRefreshAfterBackup(job);
            await refreshAll();
          }
        } catch (error) {
          if (currentLogJobId !== jobId) return;
          failures += 1;
          if (!firstFailureAt) firstFailureAt = Date.now();
          const stopped = failures >= LOG_POLL_MAX_FAILURES || Date.now() - firstFailureAt >= LOG_POLL_FAILURE_WINDOW_MS;
          const host = getTargetLogHost();
          const container = host ? host.querySelector("[data-target-log-container]") : null;
          renderLogPollingError(
            container,
            stopped
              ? "La consulta se detuvo tras varios fallos."
              : `Reintentando (${failures}/${LOG_POLL_MAX_FAILURES})${error && error.message ? `: ${error.message}` : ""}`,
            stopped ? () => pollJobLogs(jobId) : null,
          );
          if (stopped && jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
        }
      };
      fetchJob();
      jobPollTimer = setInterval(fetchJob, 2000);
    }

    let volumeSelectionState = { stacks: {}, expanded: {} };

    function renderVolumeCheckboxes(project) {
      const container = document.getElementById("targetVolumeList");
      if (!container) return;
      if (!project) {
        container.innerHTML = `<div class="helper">Selecciona un compose project para ver los volumenes disponibles.</div>`;
        return;
      }
      const volumes = project.volume_targets || [];
      const runtimeVols = project.runtime_volumes || {};
      if (!volumes.length) {
        container.innerHTML = `<div class="helper">Este proyecto no tiene volumenes de datos detectados.</div>`;
        return;
      }
      const stackKey = project.name;
      if (!volumeSelectionState.stacks[stackKey]) {
        volumeSelectionState.stacks[stackKey] = {};
        volumes.forEach(v => { volumeSelectionState.stacks[stackKey][v] = true; });
      }
      if (volumeSelectionState.expanded[stackKey] === undefined) {
        volumeSelectionState.expanded[stackKey] = true;
      }
      const isExpanded = volumeSelectionState.expanded[stackKey];
      const selectedCount = Object.values(volumeSelectionState.stacks[stackKey]).filter(Boolean).length;
      const totalCount = volumes.length;
      const allSelected = selectedCount === totalCount;
      container.innerHTML = `
        <div class="volume-group" data-stack="${escapeHtml(stackKey)}">
          <div class="volume-group-header" data-stack-toggle="${escapeHtml(stackKey)}">
            <div>
              <div class="stack-name">${escapeHtml(stackKey)}</div>
              <div class="stack-meta">${selectedCount}/${totalCount} volumenes seleccionados</div>
            </div>
            <div class="stack-toggle">${isExpanded ? "▾" : "▸"}</div>
          </div>
          <div class="volume-group-body${isExpanded ? "" : " collapsed"}">
            ${volumes.map(v => {
              const volName = Object.keys(runtimeVols).find(k => runtimeVols[k].bind === v) || "";
              const isSelected = volumeSelectionState.stacks[stackKey][v];
              return `<div class="volume-card ${isSelected ? "selected" : ""}" data-volume="${escapeHtml(v)}" data-stack="${escapeHtml(stackKey)}">
                <div class="vol-icon">📦</div>
                <div class="vol-info">
                  <div class="vol-path">${escapeHtml(v)}</div>
                  ${volName ? `<div class="vol-name">${escapeHtml(volName)}</div>` : ""}
                </div>
                <div class="vol-check"></div>
              </div>`;
            }).join("")}
          </div>
        </div>
      `;
      const group = container.querySelector(".volume-group");
      if (group) {
        const header = group.querySelector(".volume-group-header");
        if (header) {
          header.addEventListener("click", () => {
            volumeSelectionState.expanded[stackKey] = !volumeSelectionState.expanded[stackKey];
            renderVolumeCheckboxes(project);
          });
        }
        group.querySelectorAll(".volume-card").forEach(card => {
          card.addEventListener("click", () => {
            const vol = card.dataset.volume;
            volumeSelectionState.stacks[stackKey][vol] = !volumeSelectionState.stacks[stackKey][vol];
            renderVolumeCheckboxes(project);
          });
        });
      }
    }

    function getSelectedVolumes() {
      const container = document.getElementById("targetVolumeList");
      if (!container) return [];
      const stackKey = container.querySelector(".volume-group")?.dataset.stack;
      if (!stackKey || !volumeSelectionState.stacks[stackKey]) return [];
      return Object.entries(volumeSelectionState.stacks[stackKey])
        .filter(([_, selected]) => selected)
        .map(([vol]) => vol);
    }

    let jobsTableState = { sortKey: "started_at", sortDir: "desc", page: 1, pageSize: 25, filters: { id: "", target: "", command: "", status: "", origin: "", started: "", finished: "" } };
    let jobsPollTimer = null;
    let jobsPolling = false;
    let jobsPollFailures = 0;
    let jobsPollFirstFailureAt = 0;
    let accordionLogJobId = null;
    let accordionLogTimer = null;
    let accordionContentEl = null;
    let accordionJobEventSource = null;

    function stopAccordionJobEvents() {
      if (accordionJobEventSource) accordionJobEventSource();
      accordionJobEventSource = null;
    }

    function startAccordionJobEvents(jobId) {
      stopAccordionJobEvents();
      const fallback = () => {
        accordionJobEventSource = null;
        const knownJob = (state.jobs || []).find(j => j.id === jobId);
        if (accordionLogJobId === jobId && (!knownJob || !isTerminalJobStatus(knownJob.status))) pollAccordionJobLogs(jobId);

            pill.className = "job-status-pill " + status;
            pill.textContent = jobStatusLabel(status);
          }
          if (isTerminalJobStatus(job.status)) {
            stopAccordionJobEvents();
            if (accordionLogTimer) { clearInterval(accordionLogTimer); accordionLogTimer = null; }

    }

    function toggleJobLogAccordion(jobId, content) {
      const accordionRow = document.getElementById("log-accordion-" + jobId);
      if (!accordionRow) return;
      const isOpen = accordionRow.style.display !== "none";
      if (isOpen) {
        closeJobLogAccordion();
        return;
      }
      closeJobLogAccordion();
      const existingJob = (state.jobs || []).find(j => j.id === jobId);
      const tid = existingJob ? existingJob.target_id : null;
      const target = tid ? state.targets.find(t => t.id === tid) : null;
      const targetLabel = target ? target.name : (tid || "job");
      const status = normalizeJobStatus(existingJob ? existingJob.status : "pending");
      const contentDiv = document.getElementById("log-content-" + jobId);
      if (!contentDiv) return;
      contentDiv.innerHTML = `
        <div class="log-panel">
          <div class="log-panel-header">
            <div class="log-panel-title">
              <h3>Logs: ${escapeHtml(targetLabel)}</h3>
              <div class="job-status-bar" id="jobStatusBar">
                <span class="job-status-pill ${status}">${escapeHtml(jobStatusLabel(status))}</span>
                <span class="job-meta">Job: ${escapeHtml(jobId)}</span>
                <span class="job-live-indicator" data-job-live-state data-state="connecting" role="status" aria-live="polite" aria-label="Conectando…" title="Conectando…"></span>
              </div>
            </div>
            <button type="button" class="btn ghost xs" id="logAccordionClose" aria-label="Cerrar logs de ${escapeHtml(targetLabel)}">Cerrar</button>
          </div>
          <div class="log-container" id="logContainer"><div class="log-line info">Cargando logs...</div></div>
        </div>
      `;
      accordionRow.style.display = "";
      accordionLogJobId = jobId;
      accordionContentEl = contentDiv;
      const closeBtn = document.getElementById("logAccordionClose");
      if (closeBtn) closeBtn.addEventListener("click", closeJobLogAccordion);
      if (existingJob && isTerminalJobStatus(existingJob.status)) {
        setJobLiveState(contentDiv, "Finalizado", "terminal");
      } else {
        startAccordionJobEvents(jobId);
      }
      accordionRow.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function closeJobLogAccordion() {
      stopAccordionJobEvents();
      if (accordionLogTimer) { clearInterval(accordionLogTimer); accordionLogTimer = null; }
      if (accordionLogJobId) {
        const row = document.getElementById("log-accordion-" + accordionLogJobId);
        if (row) row.style.display = "none";
        const contentDiv = document.getElementById("log-content-" + accordionLogJobId);
        if (contentDiv) contentDiv.innerHTML = "";
      }
      accordionLogJobId = null;
      accordionContentEl = null;
    }

    function pollAccordionJobLogs(jobId) {
      if (accordionLogTimer) clearInterval(accordionLogTimer);
      let failures = 0;
      let firstFailureAt = 0;
      const fetchJobLogs = async () => {
        if (accordionLogJobId !== jobId) return;
        try {
          setJobLiveState(accordionContentEl, "Actualizando por polling", "fallback");
          const job = await apiGet("/api/v1/jobs/" + jobId);
          failures = 0;
          firstFailureAt = 0;
          mergeJobProjection(job);
          const container = accordionContentEl ? accordionContentEl.querySelector("#logContainer") : null;
          if (container) renderJobLogsInto(job, container);
          const pill = accordionContentEl ? accordionContentEl.querySelector(".job-status-pill") : null;
          if (pill) { const status = normalizeJobStatus(job.status); pill.className = "job-status-pill " + status; pill.textContent = jobStatusLabel(status); }
          if (isTerminalJobStatus(job.status)) {
            if (accordionLogTimer) { clearInterval(accordionLogTimer); accordionLogTimer = null; }
            stopAccordionJobEvents();
            setJobLiveState(accordionContentEl, "Finalizado", "terminal");
            scheduleSnapshotCatalogRefreshAfterBackup(job);
          }
        } catch (error) {
          failures += 1;
          if (!firstFailureAt) firstFailureAt = Date.now();
          const stopped = failures >= LOG_POLL_MAX_FAILURES || Date.now() - firstFailureAt >= LOG_POLL_FAILURE_WINDOW_MS;
          const container = accordionContentEl ? accordionContentEl.querySelector("#logContainer") : null;
          renderLogPollingError(
            container,
            stopped
              ? "La consulta se detuvo tras varios fallos."
              : `Reintentando (${failures}/${LOG_POLL_MAX_FAILURES})${error && error.message ? `: ${error.message}` : ""}`,
            stopped ? () => pollAccordionJobLogs(jobId) : null,
          );
          if (stopped && accordionLogTimer) { clearInterval(accordionLogTimer); accordionLogTimer = null; }
        }
      };
      fetchJobLogs();
      accordionLogTimer = setInterval(fetchJobLogs, 3000);
    }

    function renderJobLogsInto(job, container) {
      if (!container) return;
      const lines = job.log_lines || [];
      const progressMarkup = renderJobProgress(job);
      const storageMarkup = renderJobStorageContext(job);
      if (lines.length === 0) {
        container.innerHTML = `${progressMarkup}${storageMarkup}<div class="log-line info">Sin logs disponibles</div>`;
        return;
      }
      container.innerHTML = `${progressMarkup}${storageMarkup}${lines.map(l => {
        const escaped = escapeHtml(l);
        if (/ERROR|FAILED|CRITICAL/i.test(l)) return `<div class="log-line error">${escaped}</div>`;
        if (/WARN/i.test(l)) return `<div class="log-line warn">${escaped}</div>`;
        return `<div class="log-line info">${escaped}</div>`;
      }).join("")}`;
      container.scrollTop = container.scrollHeight;
    }

    function renderJobs(content) {
      const targetMap = {};
      (state.targets || []).forEach(t => { targetMap[t.id] = t.name; });

      const renderTableBody = () => {
        const allJobs = state.jobs || [];
        let jobs = allJobs.slice();
        jobs = jobs.filter(j => {
          const id = String(j.id || "").toLowerCase();
          const target = (targetMap[j.target_id] || j.target_id || "").toLowerCase();
          const cmd = (j.command || "").toLowerCase();
          const status = (j.status || "").toLowerCase();
          const origin = `${jobTriggerLabel(j.trigger)} ${String(j.trigger || "")}`.toLowerCase();
          const started = j.started_at ? new Date(j.started_at).toLocaleString().toLowerCase() : "";
          const finished = j.finished_at ? new Date(j.finished_at).toLocaleString().toLowerCase() : "";
          if (jobsTableState.filters.id && !id.includes(jobsTableState.filters.id.toLowerCase())) return false;
          if (jobsTableState.filters.target && !target.includes(jobsTableState.filters.target.toLowerCase())) return false;
          if (jobsTableState.filters.command && !cmd.includes(jobsTableState.filters.command.toLowerCase())) return false;
          if (jobsTableState.filters.status && !status.includes(jobsTableState.filters.status.toLowerCase())) return false;
          if (jobsTableState.filters.origin && !origin.includes(jobsTableState.filters.origin.toLowerCase())) return false;
          if (jobsTableState.filters.started && !started.includes(jobsTableState.filters.started.toLowerCase())) return false;
          if (jobsTableState.filters.finished && !finished.includes(jobsTableState.filters.finished.toLowerCase())) return false;
          return true;
        });
        const dir = jobsTableState.sortDir === "asc" ? 1 : -1;
        jobs.sort((a, b) => {
          let va, vb;
          if (jobsTableState.sortKey === "started_at") {
            va = new Date(a.started_at || 0).getTime();
            vb = new Date(b.started_at || 0).getTime();
          } else if (jobsTableState.sortKey === "finished_at") {
            va = new Date(a.finished_at || 0).getTime();
            vb = new Date(b.finished_at || 0).getTime();
          } else if (jobsTableState.sortKey === "status") {
            va = a.status || ""; vb = b.status || "";
          } else if (jobsTableState.sortKey === "target") {
            va = targetMap[a.target_id] || a.target_id || "";
            vb = targetMap[b.target_id] || b.target_id || "";
          } else if (jobsTableState.sortKey === "command") {
            va = a.command || ""; vb = b.command || "";
          } else if (jobsTableState.sortKey === "origin") {
            va = jobTriggerLabel(a.trigger); vb = jobTriggerLabel(b.trigger);
          } else {
            va = String(a.id || ""); vb = String(b.id || "");
          }
          if (va < vb) return -1 * dir;
          if (va > vb) return 1 * dir;
          return 0;
        });

        const pageSize = jobsTableState.pageSize;
        const totalFiltered = jobs.length;
        const totalPages = Math.max(1, Math.ceil(totalFiltered / pageSize));
        if (jobsTableState.page > totalPages) jobsTableState.page = totalPages;
        if (jobsTableState.page < 1) jobsTableState.page = 1;
        const startIdx = (jobsTableState.page - 1) * pageSize;
        const pagedJobs = jobs.slice(startIdx, startIdx + pageSize);
        const showingFrom = totalFiltered === 0 ? 0 : startIdx + 1;
        const showingTo = Math.min(startIdx + pageSize, totalFiltered);

        const sortIcon = (key) => {
          if (jobsTableState.sortKey !== key) return " ↕";
          return jobsTableState.sortDir === "asc" ? " ↑" : " ↓";
        };
        const sortAttrs = (key) => `data-sort="${key}" style="cursor:pointer; user-select:none;"`;

        const pageBtn = (label, page, disabled, active) => `<button class="btn sm ${active ? "primary" : ""}" data-page="${page}" ${disabled ? "disabled" : ""}>${escapeHtml(label)}</button>`;
        const pageButtons = [];
        const cur = jobsTableState.page;
        pageButtons.push(pageBtn("«", 1, cur <= 1, false));
        pageButtons.push(pageBtn("‹", cur - 1, cur <= 1, false));
        const maxPageBtns = 7;
        let pageStart = Math.max(1, cur - 3);
        let pageEnd = Math.min(totalPages, pageStart + maxPageBtns - 1);
        pageStart = Math.max(1, pageEnd - maxPageBtns + 1);
        for (let p = pageStart; p <= pageEnd; p++) {
          pageButtons.push(pageBtn(String(p), p, false, p === cur));
        }
        pageButtons.push(pageBtn("›", cur + 1, cur >= totalPages, false));
        pageButtons.push(pageBtn("»", totalPages, cur >= totalPages, false));

        const tbody = content.querySelector("#jobsTbody");
        if (tbody) {
          tbody.innerHTML = pagedJobs.length === 0 ? `<tr><td colspan="8" class="empty-state">Sin jobs que coincidan con los filtros</td></tr>` : pagedJobs.map(j => {
            const canCancel = normalizeJobStatus(j.status) === "pending" || normalizeJobStatus(j.status) === "in_progress";
            return `
            <tr id="job-row-${escapeHtml(j.id)}">
              <td class="mono">${escapeHtml(String(j.id).slice(0,8))}</td>
              <td>${escapeHtml(targetMap[j.target_id] || j.target_id || "—")}</td>
              <td>${fmtJobCommand(j.command)}</td>
              <td>${fmtJobTrigger(j.trigger)}</td>
              <td>${fmtJobStatus(j.status)}</td>
              <td class="mono">${fmtDate(j.started_at)}</td>
              <td class="mono">${fmtDate(j.finished_at)}</td>
              <td class="action-cell">
                <button class="btn ghost xs" data-view-logs="${escapeHtml(j.id)}">Ver logs</button>
                ${canCancel ? `<button class="btn ghost xs danger" data-cancel-job="${escapeHtml(j.id)}">Cancelar</button>` : ""}
              </td>
            </tr>
            <tr class="log-accordion-row" id="log-accordion-${escapeHtml(j.id)}" style="display:none;">
              <td colspan="8">
                <div class="log-accordion-content" id="log-content-${escapeHtml(j.id)}"></div>
              </td>
            </tr>
          `;
          }).join("");
        }

        const subtitle = content.querySelector(".page-header .subtitle");
        if (subtitle) subtitle.textContent = `Historico de jobs de backup/restore (${totalFiltered} de ${allJobs.length})`;

        const pagInfo = content.querySelector(".pagination-info");
        if (pagInfo) pagInfo.textContent = `Mostrando ${showingFrom}-${showingTo} de ${totalFiltered} jobs`;

        const pagControls = content.querySelector(".pagination-controls");
        if (pagControls) pagControls.innerHTML = pageButtons.join("");

        const sortThs = content.querySelectorAll("[data-sort]");
        sortThs.forEach(th => {
          const key = th.dataset.sort;
          th.innerHTML = `${key === "id" ? "ID" : key === "target" ? "Target" : key === "command" ? "Comando" : key === "origin" ? "Origen" : key === "status" ? "Status" : key === "started_at" ? "Inicio" : "Fin"}${sortIcon(key)}`;
        });

        bindJobsRowEvents();
      };

      const renderTable = () => {
        const sortIcon = (key) => {
          if (jobsTableState.sortKey !== key) return " ↕";
          return jobsTableState.sortDir === "asc" ? " ↑" : " ↓";
        };
        const sortAttrs = (key) => `data-sort="${key}" style="cursor:pointer; user-select:none;"`;
        content.innerHTML = `
          <div class="page-header"><div><h2>Jobs</h2><div class="subtitle">Historico de jobs de backup/restore</div></div>
          </div>
          <div id="jobsRefreshNotice" class="snapshot-status jobs-refresh-notice" data-state="error" role="status" aria-live="polite" aria-atomic="true" hidden></div>
          <div class="table-wrap"><div class="sheet"><table class="table datatable">
            <thead>
              <tr>
                <th ${sortAttrs("id")}>ID${sortIcon("id")}</th>
                <th ${sortAttrs("target")}>Target${sortIcon("target")}</th>
                <th ${sortAttrs("command")}>Comando${sortIcon("command")}</th>
                <th ${sortAttrs("origin")}>Origen${sortIcon("origin")}</th>
                <th ${sortAttrs("status")}>Status${sortIcon("status")}</th>
                <th ${sortAttrs("started_at")}>Inicio${sortIcon("started_at")}</th>
                <th ${sortAttrs("finished_at")}>Fin${sortIcon("finished_at")}</th>
                <th>Acciones</th>
              </tr>
              <tr class="filter-row">
                <th><input type="text" class="dt-filter" data-col="id" placeholder="Filtrar ID..." value="${escapeHtml(jobsTableState.filters.id)}" /></th>
                <th><input type="text" class="dt-filter" data-col="target" placeholder="Filtrar target..." value="${escapeHtml(jobsTableState.filters.target)}" /></th>
                <th><input type="text" class="dt-filter" data-col="command" placeholder="Filtrar comando..." value="${escapeHtml(jobsTableState.filters.command)}" /></th>
                <th><input type="text" class="dt-filter" data-col="origin" placeholder="Filtrar origen..." value="${escapeHtml(jobsTableState.filters.origin)}" /></th>
                <th><input type="text" class="dt-filter" data-col="status" placeholder="Filtrar status..." value="${escapeHtml(jobsTableState.filters.status)}" /></th>
                <th><input type="text" class="dt-filter" data-col="started" placeholder="Filtrar inicio..." value="${escapeHtml(jobsTableState.filters.started)}" /></th>
                <th><input type="text" class="dt-filter" data-col="finished" placeholder="Filtrar fin..." value="${escapeHtml(jobsTableState.filters.finished)}" /></th>
                <th></th>
              </tr>
            </thead>
            <tbody id="jobsTbody"></tbody>
          </table></div></div>
          <div class="pagination">
            <div class="pagination-info"></div>
            <div class="pagination-controls"></div>
            <div class="pagination-size">
              <label>Por pagina:
                <select id="jobsPageSize">
                  <option value="10" ${jobsTableState.pageSize === 10 ? "selected" : ""}>10</option>
                  <option value="25" ${jobsTableState.pageSize === 25 ? "selected" : ""}>25</option>
                  <option value="50" ${jobsTableState.pageSize === 50 ? "selected" : ""}>50</option>
                  <option value="100" ${jobsTableState.pageSize === 100 ? "selected" : ""}>100</option>
                </select>
              </label>
            </div>
          </div>
        <div id="targetLogPanel"></div>
      `;

        content.querySelectorAll("[data-sort]").forEach(th => {
          th.addEventListener("click", () => {
            const key = th.dataset.sort;
            if (jobsTableState.sortKey === key) {
              jobsTableState.sortDir = jobsTableState.sortDir === "asc" ? "desc" : "asc";
            } else {
              jobsTableState.sortKey = key;
              jobsTableState.sortDir = "desc";
            }
            renderTableBody();
          });
        });
        content.querySelectorAll(".dt-filter").forEach(input => {
          input.addEventListener("input", () => {
            jobsTableState.filters[input.dataset.col] = input.value;
            jobsTableState.page = 1;
            renderTableBody();
          });
        });
        const pageSizeSelect = document.getElementById("jobsPageSize");
        if (pageSizeSelect) {
          pageSizeSelect.addEventListener("change", () => {
            jobsTableState.pageSize = parseInt(pageSizeSelect.value, 10);
            jobsTableState.page = 1;
            renderTableBody();
          });
        }
        renderTableBody();
      };

      function bindJobsRowEvents() {
        content.querySelectorAll("[data-page]").forEach(btn => {
          btn.addEventListener("click", () => {
            if (btn.disabled) return;
            jobsTableState.page = parseInt(btn.dataset.page, 10);
            renderTableBody();
          });
        });
        content.querySelectorAll("[data-view-logs]").forEach(btn => {
          btn.addEventListener("click", () => toggleJobLogAccordion(btn.dataset.viewLogs, content));
        });
        content.querySelectorAll("[data-cancel-job]").forEach(btn => {
          btn.addEventListener("click", () => withBtnLoading(btn, async () => {
            const jobId = btn.dataset.cancelJob;
            if (!confirm(`¿Cancelar el job ${jobId.slice(0,8)}?`)) return;
            await apiPost(`/api/v1/jobs/${jobId}/cancel`, {});
            const jobsResp = await apiGet("/api/v1/jobs");
            state.jobs = jobsResp.items || [];
            renderJobs(content);
          }, "Cancelando...").catch(() => {}));
        });
      }

      renderTable();
      _jobsRenderTableBody = renderTableBody;
      startJobsPolling();
    }

    let _jobsRenderTableBody = null;

    function clearJobsRefreshNotice() {
      const notice = document.getElementById("jobsRefreshNotice");
      if (!notice) return;
      notice.hidden = true;
      notice.innerHTML = "";
    }

    function renderJobsRefreshNotice(message, retryHandler) {
      const notice = document.getElementById("jobsRefreshNotice");
      if (!notice) return;
      notice.innerHTML = `<span>${escapeHtml(String(message || "").slice(0, 240))}</span>${retryHandler ? '<button type="button" class="btn ghost xs" data-jobs-refresh-retry>Reintentar</button>' : ""}`;
      notice.hidden = false;
      const retry = notice.querySelector("[data-jobs-refresh-retry]");
      if (retry && retryHandler) retry.addEventListener("click", retryHandler);
    }

    function retryJobsPolling() {
      jobsPolling = false;
      if (jobsPollTimer) {
        clearTimeout(jobsPollTimer);
        jobsPollTimer = null;
      }
      jobsPollFailures = 0;
      jobsPollFirstFailureAt = 0;
      clearJobsRefreshNotice();
      startJobsPolling();
    }

    function startJobsPolling() {
      if (jobsPolling) return;
      jobsPolling = true;
      const tick = async () => {
        if (!jobsPolling) return;
        try {
          const jobsResp = await apiGet("/api/v1/jobs");
          jobsPollFailures = 0;
          jobsPollFirstFailureAt = 0;
          clearJobsRefreshNotice();
          const newJobs = jobsResp.items || [];
          const oldIds = new Set((state.jobs || []).map(j => j.id));
          const hasNew = newJobs.some(j => !oldIds.has(j.id));
          const jobFingerprint = j => JSON.stringify([j.id, normalizeJobStatus(j.status), j.updated_at || "", j.progress || (j.result_summary && j.result_summary.progress) || null, (j.log_lines || []).length]);
          const hasChanged = JSON.stringify(newJobs.map(jobFingerprint)) !== JSON.stringify((state.jobs || []).map(jobFingerprint));
          state.jobs = newJobs;
          if (hasNew || hasChanged) {
            const content = document.getElementById("content");
            if (content && state.currentView === "jobs") {
              if (_jobsRenderTableBody) {
                _jobsRenderTableBody();
              } else {
                renderJobs(content);
              }
            }
          }
        } catch (e) {
          jobsPollFailures += 1;
          if (!jobsPollFirstFailureAt) jobsPollFirstFailureAt = Date.now();
          const stopped = jobsPollFailures >= LOG_POLL_MAX_FAILURES || Date.now() - jobsPollFirstFailureAt >= LOG_POLL_FAILURE_WINDOW_MS;
          renderJobsRefreshNotice(
            stopped
              ? "La actualizacion de Jobs se detuvo tras varios fallos."
              : `No se pudo actualizar Jobs. Reintentando (${jobsPollFailures}/${LOG_POLL_MAX_FAILURES}).`,
            stopped ? retryJobsPolling : null,
          );
          if (stopped) {
            jobsPolling = false;
            jobsPollTimer = null;
          }
        }
        if (jobsPolling) {
          jobsPollTimer = setTimeout(tick, 3000);
        }
      };
      jobsPollTimer = setTimeout(tick, 3000);
    }

    function stopJobsPolling() {
      jobsPolling = false;
      _jobsRenderTableBody = null;
      if (jobsPollTimer) {
        clearTimeout(jobsPollTimer);
        jobsPollTimer = null;
      }
      jobsPollFailures = 0;
      jobsPollFirstFailureAt = 0;
    }

          <div class="pagination-controls"></div>
          <div class="pagination-size">
            <label>Por pagina:
              <select id="storagePageSize">
                <option value="10" ${storageTableState.pageSize === 10 ? "selected" : ""}>10</option>
                <option value="25" ${storageTableState.pageSize === 25 ? "selected" : ""}>25</option>
                <option value="50" ${storageTableState.pageSize === 50 ? "selected" : ""}>50</option>
                <option value="100" ${storageTableState.pageSize === 100 ? "selected" : ""}>100</option>

      content.querySelectorAll(".dt-filter").forEach(input => {

          storageTableState.page = 1;

    function getFilteredStorageProfiles() {
      const f = storageTableState.filters;
      return (state.storageProfiles || []).filter(p => {
        if (f.name && !(p.name || "").toLowerCase().includes(f.name.toLowerCase())) return false;
        if (f.backend && !(p.backend_type || "").toLowerCase().includes(f.backend.toLowerCase())) return false;
        return true;
      });
    }

    function renderStorageCards() {
      const container = document.getElementById("storageCardsContainer");
      if (!container) return;
      const filtered = getFilteredStorageProfiles();
      const dir = storageTableState.sortDir === "asc" ? 1 : -1;
      const key = storageTableState.sortKey;
      filtered.sort((a, b) => {
        const va = key === "backend" ? (a.backend_type || "") : (a.name || "");
        const vb = key === "backend" ? (b.backend_type || "") : (b.name || "");
        return va.localeCompare(vb) * dir;
      });
      const total = filtered.length;
      const pageSize = storageTableState.pageSize;
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      if (storageTableState.page > totalPages) storageTableState.page = totalPages;
      if (storageTableState.page < 1) storageTableState.page = 1;
      const startIdx = (storageTableState.page - 1) * pageSize;
      const paged = filtered.slice(startIdx, startIdx + pageSize);
      const emptyState = document.getElementById("storageEmptyState");
      if (emptyState) {
        if (total > 0) {
          emptyState.hidden = true;
        } else {
          emptyState.hidden = false;
          emptyState.textContent = (state.storageProfiles || []).length === 0
            ? "Sin storage profiles"
            : "Sin profiles que coincidan con los filtros";
        }
      }
      container.innerHTML = paged.length ? paged.map(p => renderStorageCard(p)).join("") : "";
      const infoEl = document.querySelector("#storageCardsContainer ~ .pagination .pagination-info");
      if (infoEl) infoEl.textContent = total === 0 ? "Sin resultados" : `Mostrando ${startIdx + 1}-${Math.min(startIdx + pageSize, total)} de ${total}`;
      const controlsEl = document.querySelector("#storageCardsContainer ~ .pagination .pagination-controls");
      if (controlsEl) {
        const cur = storageTableState.page;
        controlsEl.innerHTML = totalPages <= 1 ? "" : Array.from({length: totalPages}, (_, i) => i + 1).map(p =>
          `<button class="btn ghost xs ${p === cur ? "active" : ""}" data-storage-page="${p}">${p}</button>`
        ).join("");
        controlsEl.querySelectorAll("[data-storage-page]").forEach(btn => {
          btn.addEventListener("click", () => {
            storageTableState.page = parseInt(btn.dataset.storagePage, 10);
            renderStorageCards();
          });
        });
      }
    }

    function renderStorageCard(profile) {
      const about = storageAboutState[profile.id] || { state: "loading", metrics: null, error: null };
      let metricsHtml = "";
      let stateBadge = "";
      if (about.state === "available" && about.metrics) {
        const m = about.metrics;
        const fmtBytes = (v) => {
          const n = Number(v);
          if (!isFinite(n) || n < 0) return "—";
          if (n === 0) return "0 B";
          const units = ["B", "KB", "MB", "GB", "TB"];
          const i = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
          return `${(n / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
        };
        metricsHtml = `
          <div class="storage-metrics">
            <div class="storage-metric"><span class="storage-metric-label">Total</span><span class="storage-metric-value">${escapeHtml(fmtBytes(m.total))}</span></div>
            <div class="storage-metric"><span class="storage-metric-label">Usado</span><span class="storage-metric-value">${escapeHtml(fmtBytes(m.used))}</span></div>
            <div class="storage-metric"><span class="storage-metric-label">Libre</span><span class="storage-metric-value">${escapeHtml(fmtBytes(m.free))}</span></div>
            <div class="storage-metric"><span class="storage-metric-label">Papelera</span><span class="storage-metric-value">${escapeHtml(fmtBytes(m.trashed))}</span></div>
          </div>`;
        stateBadge = `<span class="pill ok">Disponible</span>`;
      } else if (about.state === "about-unsupported") {
        stateBadge = `<span class="pill warn">About not supported</span>`;
      } else if (about.state === "transient-failure") {
        stateBadge = `<span class="pill warn">Fallo transitorio</span>`;
      } else if (about.state === "not-configured") {
        stateBadge = `<span class="pill muted">No configurado</span>`;
      } else if (about.state === "loading") {
        stateBadge = `<span class="pill muted">Consultando...</span>`;
      } else {
        stateBadge = `<span class="pill muted">${escapeHtml(about.state || "Desconocido")}</span>`;
      }
      const errorHtml = about.error ? `<div class="storage-card-error">${escapeHtml(about.error)}</div>` : "";
      return `
        <article class="storage-card" data-profile-id="${escapeHtml(profile.id)}">
          <div class="storage-card-header">
            <div class="storage-card-title">
              <h3>${escapeHtml(profile.name)}</h3>
              <div class="storage-card-backend">${escapeHtml(profile.backend_type)}</div>
            </div>
            ${stateBadge}
          </div>
          ${metricsHtml}
          ${errorHtml}
          <div class="storage-card-actions">
            <button class="btn ghost xs" data-storage-refresh="${escapeHtml(profile.id)}">Refrescar</button>
            <button class="btn ghost xs" onclick="editStorageProfile('${escapeHtml(profile.id)}')">Editar</button>
            <button class="btn danger xs" onclick="deleteStorageProfile('${escapeHtml(profile.id)}','${escapeHtml(profile.name)}', event)">Eliminar</button>
          </div>
        </article>`;
    }

    async function refreshStorageAbout(profileId) {
      storageAboutState[profileId] = { state: "loading", metrics: null, error: null };
      renderStorageCards();
      try {
        const resp = await apiGet(`/api/v1/storage-profiles/${encodeURIComponent(profileId)}/about`);
        storageAboutState[profileId] = {
          state: resp.state || "transient-failure",
          metrics: resp.metrics || null,
          error: resp.error || null,
        };
      } catch (e) {
        storageAboutState[profileId] = { state: "transient-failure", metrics: null, error: e.message || null };
      }
      renderStorageCards();
    }

            <div class="modal-header"><h3>Eliminar secreto</h3><button class="close" id="secDelClose">&times;</button></div>
            <div class="modal-body">
              <p>¿Eliminar el secreto <strong>${escapeHtml(name)}</strong>?</p>
              <div id="secDelUsages"><div class="helper">Verificando uso...</div></div>
            </div>
            <div class="modal-footer">
              <button class="btn" id="secDelCancel">Cancelar</button>
              <button class="btn danger" id="secDelConfirm" disabled>Eliminar</button>
            </div>
          </div>
        `;
        overlay.classList.add("open");

        const usagesDiv = document.getElementById("secDelUsages");
        const deleteConfirm = document.getElementById("secDelConfirm");

        function closeSecretDeleteModal() {
          overlay.classList.remove("open");
          overlay.innerHTML = "";
          deletingSecretId = null;
        }

        document.getElementById("secDelClose").addEventListener("click", closeSecretDeleteModal);
        document.getElementById("secDelCancel").addEventListener("click", closeSecretDeleteModal);
        overlay.addEventListener("click", (e) => { if (e.target === overlay) closeSecretDeleteModal(); });

        try {
          const resp = await apiGet(`/api/v1/secrets/${id}/usages`);
          const usages = resp.items || [];
          if (usages.length === 0) {
            usagesDiv.innerHTML = '<div class="secret-safe"><span class="secret-safe-icon">✓</span> El secreto no esta en uso. Se puede eliminar.</div>';
            deleteConfirm.disabled = false;
          } else {
            const usageList = usages.map(u => `<li><span class="pill muted">${escapeHtml(u.type)}</span> <strong>${escapeHtml(u.name)}</strong> — ${escapeHtml(u.field)}</li>`).join("");
            usagesDiv.innerHTML = `<div class="secret-blocked"><span class="secret-blocked-icon">⚠</span> No se puede eliminar: el secreto esta en uso por:</div><ul class="secret-usage-list">${usageList}</ul>`;
            deleteConfirm.disabled = true;
          }
        } catch (error) {
          usagesDiv.innerHTML = `<div class="secret-blocked">Error verificando uso: ${escapeHtml(error.message)}</div>`;
          deleteConfirm.disabled = true;
        }

        deleteConfirm.addEventListener("click", async (e) => {
          if (!deletingSecretId || deleteConfirm.disabled) return;
          await withBtnLoading(e.currentTarget, async () => {
            await apiDelete(`/api/v1/secrets/${deletingSecretId}`);
            await refreshAll();
            closeSecretDeleteModal();
          }, "Eliminando...").catch(() => {});
        });
      }
    }

    function renderUsers(content) {
      const canManage = state.currentRole === "admin";
      content.innerHTML = `
        <div class="page-header"><div><h2>Usuarios</h2><div class="subtitle">Usuarios locales del Control Plane</div></div></div>
        ${canManage ? `<details class="form-section"><summary>Crear usuario</summary><div class="form-body">
          <form id="createUserForm">
            <div class="form-grid">
              <div class="field"><label for="usrName">Usuario</label><input id="usrName" required /></div>
              <div class="field"><label for="usrPassword">Contraseña</label><input id="usrPassword" type="password" required /></div>
              <div class="field"><label for="usrRole">Rol</label><select id="usrRole"><option value="viewer">viewer</option><option value="operator">operator</option><option value="admin">admin</option></select></div>
            </div>
            <div class="btn-row"><button type="submit" class="btn primary sm">Crear usuario</button></div>
          </form>
        </div></details>` : ""}
        <div class="page-header"><div><h2>Usuarios configurados</h2></div></div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>Usuario</th><th>Rol</th><th>Cambio obligatorio</th><th>Creado</th></tr></thead>
          <tbody>${state.localUsers.length ? state.localUsers.map(u => `<tr><td>${escapeHtml(u.username)}</td><td><span class="pill muted">${escapeHtml(u.role)}</span></td><td>${u.must_change_password ? '<span class="pill warn">si</span>' : '<span class="pill ok">no</span>'}</td><td class="mono">${fmtDate(u.created_at)}</td></tr>`).join("") : `<tr><td colspan="4" class="empty-state">Sin usuarios</td></tr>`}</tbody>
        </table></div></div>
      `;
      const form = document.getElementById("createUserForm");
      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          await withBtnLoading(e.submitter, async () => {
            await apiPost("/api/v1/admin/users", {
              username: document.getElementById("usrName").value.trim(),
              password: document.getElementById("usrPassword").value,
              role: document.getElementById("usrRole").value,
            });
            await refreshAll();
          }, "Creando...").catch(() => {});
        });
      }
    }

    function renderSettings(content) {
      const settings = state.settings || {};
      const hasDefaultPassword = !!(settings.restic_password_secret_id);
      const hasRcloneConf = !!(settings.rclone_conf_secret_id);
      const passwordSecretOptions = state.secrets.map(s => `<option value="${escapeHtml(s.id)}" ${s.id === settings.restic_password_secret_id ? "selected" : ""}>${escapeHtml(s.name)}</option>`).join("");
      const rcloneSecretOptions = state.secrets.filter(s => s.secret_type === "file").map(s => `<option value="${escapeHtml(s.id)}" ${s.id === settings.rclone_conf_secret_id ? "selected" : ""}>${escapeHtml(s.name)}</option>`).join("");
      content.innerHTML = `
        <div class="page-header"><div><h2>Settings</h2><div class="subtitle">Configuracion global del Control Plane para backups restic</div></div></div>
        <form id="settingsForm" class="settings-grid">
          <div class="settings-card">
            <div class="settings-card-header">
              <span class="settings-icon">📦</span>
              <div>
                <h3>Repositorio restic</h3>
                <div class="settings-card-sub">Ruta base del repositorio</div>
              </div>
            </div>
            <div class="helper">Define la ruta base del repositorio. Para cada target se usara <code>{base}/{target_name}</code>. Si el target tiene su propio <code>RESTIC_REPOSITORY</code>, ese tiene prioridad.</div>
            <div class="field full" style="margin-top:12px;">
              <label for="settingsRepoBase">Ruta base del repositorio restic</label>
              <input id="settingsRepoBase" value="${escapeHtml(settings.restic_repository_base || "")}" placeholder="rclone:daniel.actsis:backup" />
              <div class="helper">Para cada target se usara <code>{base}/{target_name}</code> como repositorio.</div>
              <div id="repoPreview" class="cron-preview" style="margin-top:8px;"></div>
              <div id="repoWarning" style="margin-top:6px;"></div>
            </div>
          </div>

          <div class="settings-card">
            <div class="settings-card-header">
              <span class="settings-icon">🔗</span>
              <div>
                <h3>rclone.conf global</h3>
                <div class="settings-card-sub">Backend rclone (opcional)</div>
              </div>
            </div>
            <div class="helper">Si el <code>RESTIC_REPOSITORY</code> usa <code>rclone:</code> como backend, monta este <code>rclone.conf</code> en el contenedor de backup. Solo se aplica si el storage profile del target no monta el suyo propio.</div>
            <div class="field full" style="margin-top:12px;">
              <label for="settingsRcloneSecret">rclone.conf (secret tipo rclone)</label>
              <select id="settingsRcloneSecret"><option value="">-- Sin rclone.conf --</option>${rcloneSecretOptions}</select>
              <div class="helper">${hasRcloneConf ? '<span class="pill ok" style="font-size:10px;">rclone.conf activo</span> Se montara en el contenedor y se usara automaticamente.' : '<span class="pill muted" style="font-size:10px;">Sin rclone.conf</span> Solo necesario si usas <code>rclone:</code> en el repositorio.'}</div>
            </div>
          </div>

          <div class="settings-card">
            <div class="settings-card-header">
              <span class="settings-icon">⏰</span>
              <div>
                <h3>Cron global (fallback)</h3>
                <div class="settings-card-sub">Programacion por defecto</div>
              </div>
            </div>
            <div class="helper">Cron por defecto para targets que no tengan cron propio. Si un target tiene su propio cron, ese tiene prioridad. Vacio = solo backups manuales para targets sin cron.</div>
            <div class="field full" style="margin-top:12px;">
              <label for="settingsGlobalCron">Cron global (opcional)</label>
              <input id="settingsGlobalCron" value="${escapeHtml(settings.global_cron_expression || "")}" placeholder="0 3 * * * (diario 3am)" />
              <div class="helper">Expresion cron de 5 campos. Ej: <code>0 3 * * *</code> (diario 3am), <code>0 */6 * * *</code> (cada 6h). Los targets sin cron usaran este. Zona del scheduler: <strong>${escapeHtml(state.schedulerTimezone || "no disponible")}</strong>.</div>
              <div id="settingsGlobalCronPreview" class="cron-preview"></div>
            </div>
          </div>

          <div class="settings-card">
            <div class="settings-card-header">
              <span class="settings-icon">🔑</span>
              <div>
                <h3>Password por defecto</h3>
                <div class="settings-card-sub">Password restic global</div>
              </div>
            </div>
            <div class="helper">Si se configura, los targets no necesitan especificar password (queda en opciones avanzadas). Si no se configura, cada target debe elegir su propio secret de password.</div>
            <div class="field full" style="margin-top:12px;">
              <label for="settingsPasswordSecret">Password restic por defecto (secret)</label>
              <select id="settingsPasswordSecret"><option value="">-- Sin default --</option>${passwordSecretOptions}</select>
              <div class="helper">${hasDefaultPassword ? '<span class="pill ok" style="font-size:10px;">Default activo</span> Los targets usaran este password por defecto.' : '<span class="pill muted" style="font-size:10px;">Sin default</span> Cada target debe especificar su propio password.'}</div>
            </div>
          </div>

          <div class="settings-card">
            <div class="settings-card-header">
              <span class="settings-icon">🌐</span>
              <div>
                <h3>URL pública del Control Plane</h3>
                <div class="settings-card-sub">URL para los comandos del worker</div>
              </div>
            </div>
            <div class="helper">URL que la UI usa al generar los comandos de despliegue del worker. Úsala cuando el Control Plane esté detrás de un proxy, en un puerto distinto, o con un dominio. Si se deja vacío, la UI usa la URL del navegador.</div>
            <div class="field full" style="margin-top:12px;">
              <label for="settingsPublicUrl">URL pública (opcional)</label>
              <input id="settingsPublicUrl" value="${escapeHtml(settings.control_plane_public_url || "")}" placeholder="https://backups.miempresa.com" />
              <div class="helper">Ej: <code>https://backups.miempresa.com</code> o <code>http://192.168.1.10:18080</code></div>
            </div>
          </div>

          <div class="settings-actions">
            <button type="submit" class="btn primary">Guardar configuracion</button>
            <div id="settingsFeedback"></div>
          </div>
        </form>
      `;
      const feedbackEl = () => document.getElementById("settingsFeedback");
      const showFeedback = (msg, type) => {
        const el = feedbackEl();
        if (!el) return;
        const color = type === "error" ? "var(--destructive)" : type === "success" ? "var(--success)" : "var(--muted-foreground)";
        el.innerHTML = `<div style="padding:10px 12px; border-radius:var(--radius); background:color-mix(in srgb, ${color} 10%, var(--background)); border:1px solid color-mix(in srgb, ${color} 30%, transparent); color:${color}; font-size:13px; font-weight:600;">${escapeHtml(msg)}</div>`;
        if (type === "success") setTimeout(() => { if (el) el.innerHTML = ""; }, 4000);
      };
      const updateRepoPreview = () => {
        const base = document.getElementById("settingsRepoBase").value.trim();
        const previewEl = document.getElementById("repoPreview");
        const warningEl = document.getElementById("repoWarning");
        if (!previewEl || !warningEl) return;
        const rcloneSecret = document.getElementById("settingsRcloneSecret").value;
        const rcloneRemote = state.rcloneRemote || "";
        if (!base) {
          let hint = 'Ejemplo: <code>backup</code>';
          if (rcloneSecret && rcloneRemote) hint = `Con rclone.conf seleccionado solo pon la ruta. Ej: <code>backup</code> → <code>rclone:${escapeHtml(rcloneRemote)}:backup/nginx</code>`;
          previewEl.innerHTML = `<span style="color:var(--muted-foreground);">${hint}</span>`;
          warningEl.innerHTML = "";
          return;
        }
        const startsSlash = /^\//.test(base);
        const endsSlash = /\/$/.test(base);
        if (startsSlash || endsSlash) {
          previewEl.innerHTML = `<span style="color:var(--destructive); font-weight:700;">✗ La ruta no debe empezar ni terminar con /</span>`;
          warningEl.innerHTML = `<div style="padding:6px 10px; border-radius:var(--radius); background:color-mix(in srgb, var(--destructive) 10%, var(--background)); border:1px solid color-mix(in srgb, var(--destructive) 30%, transparent); color:var(--destructive); font-size:12px; font-weight:600;">⚠ La ruta base no debe tener slash al inicio ni al final.</div>`;
        } else {
          previewEl.innerHTML = `<span style="color:var(--success); font-weight:700;">✓ ${escapeHtml(base)}</span>`;
          warningEl.innerHTML = "";
        }
      };
      document.getElementById("settingsRepoBase").addEventListener("input", updateRepoPreview);
      document.getElementById("settingsRcloneSecret").addEventListener("change", updateRepoPreview);
      updateRepoPreview();
      const globalCronInput = document.getElementById("settingsGlobalCron");
      if (globalCronInput) {
        globalCronInput.addEventListener("input", () => updateCronPreview("settingsGlobalCron", "settingsGlobalCronPreview"));
        updateCronPreview("settingsGlobalCron", "settingsGlobalCronPreview");
      }
      document.getElementById("settingsForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const repoBase = document.getElementById("settingsRepoBase").value.trim();
        const passwordSecret = emptyToNull(document.getElementById("settingsPasswordSecret").value);
        const rcloneSecret = emptyToNull(document.getElementById("settingsRcloneSecret").value);
        const globalCron = emptyToNull(document.getElementById("settingsGlobalCron").value);
        const publicUrl = document.getElementById("settingsPublicUrl").value.trim();
        if (!repoBase) {
          showFeedback("La ruta base del repositorio es obligatoria.", "error");
          document.getElementById("settingsRepoBase").focus();
          return;
        }
        if (/^\//.test(repoBase) || /\/$/.test(repoBase)) {
          showFeedback("La ruta base no debe tener slash al inicio ni al final.", "error");
          document.getElementById("settingsRepoBase").focus();
          return;
        }
        await withBtnLoading(e.submitter, async () => {
          await apiPatch("/api/v1/settings", {
            restic_repository_base: repoBase,
            restic_password_secret_id: passwordSecret,
            rclone_conf_secret_id: rcloneSecret,
            global_cron_expression: globalCron,
            control_plane_public_url: publicUrl,
          });
          await refreshAll();
          showFeedback("Guardado exitosamente.", "success");
        }, "Guardando...").catch((error) => {
          showFeedback(`Error guardando configuracion: ${error.message}`, "error");
        });
      });
    }

    async function refreshAll() {
      try {
        const me = await apiGet("/api/v1/auth/me");
        state.currentUser = me.username;
        state.currentRole = me.role;
        const [workers, targets, jobs, storageProfiles, retentionPolicies, secrets, users, settings, schedulerConfig] = await Promise.all([
          apiGet("/api/v1/workers"),
          apiGet("/api/v1/targets"),
          apiGet(currentLogJobId ? "/api/v1/jobs?include_logs=true" : "/api/v1/jobs"),
          apiGet("/api/v1/storage-profiles"),
          apiGet("/api/v1/retention-policies"),
          apiGet("/api/v1/secrets").catch(() => ({ items: [] })),
          apiGet("/api/v1/admin/users").catch(() => ({ items: [] })),
          apiGet("/api/v1/settings").catch(() => ({})),
          apiGet("/api/v1/config/public").catch(() => ({})),
        ]);
        state.workers = workers.items || [];
        state.targets = targets.items || [];
        state.jobs = jobs.items || [];
        state.storageProfiles = storageProfiles.items || [];
        state.retentionPolicies = retentionPolicies.items || [];
        state.secrets = secrets.items || [];
        state.localUsers = users.items || [];
        state.settings = settings || {};
        state.schedulerTimezone = schedulerConfig.scheduler_timezone || state.settings.scheduler_timezone || null;
        let rcloneRemote = null;
        try {
          const rr = await apiGet("/api/v1/settings/rclone-remote");
          rcloneRemote = rr.remote_name || null;
        } catch (e) {}
        state.rcloneRemote = rcloneRemote;
        state.workerInventories = {};
        try { state.systemVersion = (await apiGet("/api/v1/version")).version || "dev"; } catch (e) {}
        try {
          const latest = await apiGet("/api/v1/version/latest");
          if (latest && latest.tag_name) {
            const normalize = v => (v || "").replace(/^v/, "").trim();
            state.latestVersion = latest.tag_name;
            state.latestVersionUrl = latest.html_url || "https://github.com/DanielRondonGarcia/docker-volume-backup/releases/latest";
          }
        } catch (e) {}
        renderVersionBanner();
        route();
      } catch (error) {
        if (error.message !== "auth") console.error(error);
      }
    }

    window.addEventListener("resize", () => {
      document.querySelectorAll(".dropdown-menu.open").forEach(menu => {
        const trigger = menu.parentElement?.querySelector(".dropdown-trigger");
        if (trigger) positionTargetDropdown(trigger, menu);
      });
    });
    window.addEventListener("scroll", () => {
      document.querySelectorAll(".dropdown-menu.open").forEach(menu => {
        const trigger = menu.parentElement?.querySelector(".dropdown-trigger");
        if (trigger) positionTargetDropdown(trigger, menu);
      });
    }, true);
    document.addEventListener("click", (event) => {
      const target = event.target instanceof Element ? event.target : null;
      if (target && target.closest(".dropdown")) return;
      closeTargetDropdowns();
    });

    (async function init() {
      try {
        const me = await apiGet("/api/v1/auth/me");
        state.currentUser = me.username;
        state.currentRole = me.role;
        if (me.must_change_password) { window.location.href = "/change-password"; return; }
        await refreshAll();
        hideAppLoader();
      } catch (error) {
        if (error.message !== "auth") console.error(error);
        hideAppLoader();
      }
    })();

    function hideAppLoader() {
      const loader = document.getElementById("appLoader");
      const app = document.getElementById("app");
      if (loader) {
        loader.classList.add("app-loader-hidden");
        setTimeout(() => { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 300);
      }
      if (app) app.style.visibility = "";
    }
  </script>
</body>
</html>
