<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docker Volume Backup | Control Plane</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/app.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div class="modal-overlay" id="modalOverlay"></div>

  <script>
    const ICONS = {
      dashboard: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>',
      workers: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 6h12M6 3v10"/></svg>',
      targets: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r="0.5" fill="currentColor"/></svg>',
      jobs: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v4l3 2"/><circle cx="8" cy="8" r="6"/></svg>',
      storage: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1 2 2 5 2s5-1 5-2V4M3 8c0 1 2 2 5 2s5-1 5-2"/></svg>',
      retention: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v6l4 2"/><circle cx="8" cy="8" r="6"/><path d="M5 1.5 3 3M11 1.5 13 3"/></svg>',
      secrets: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>',
      users: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3 3-5 6-5s6 2 6 5"/></svg>',
      logout: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2H3v12h3M10 5l3 3-3 3M6 8h7"/></svg>',
    };

    const NAV_ITEMS = [
      { id: "dashboard", label: "Dashboard", icon: "dashboard", roles: ["admin", "operator", "viewer"] },
      { id: "workers", label: "Workers", icon: "workers", roles: ["admin", "operator", "viewer"] },
      { id: "targets", label: "Targets", icon: "targets", roles: ["admin", "operator", "viewer"] },
      { id: "jobs", label: "Jobs", icon: "jobs", roles: ["admin", "operator", "viewer"] },
      { id: "storage", label: "Storage", icon: "storage", roles: ["admin", "operator"] },
      { id: "retention", label: "Retention", icon: "retention", roles: ["admin", "operator"] },
      { id: "secrets", label: "Secretos", icon: "secrets", roles: ["admin"] },
      { id: "users", label: "Usuarios", icon: "users", roles: ["admin"] },
      { id: "settings", label: "Settings", icon: "settings", roles: ["admin"] },
    ];

    const state = {
      workers: [],
      targets: [],
      jobs: [],
      storageProfiles: [],
      retentionPolicies: [],
      secrets: [],
      localUsers: [],
      userManagement: null,
      currentUser: null,
      currentRole: null,
      workerInventories: {},
      currentView: "dashboard",
    };

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function emptyToNull(v) { return v && v.trim() ? v.trim() : null; }
    function parseJsonField(id, label) {
      const raw = document.getElementById(id).value.trim();
      if (!raw) return {};
      try { return JSON.parse(raw); } catch (e) { throw new Error(`JSON invalido en ${label}: ${e.message}`); }
    }
    function fmtDate(ts) {
      if (!ts) return "—";
      try { return new Date(ts).toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" }); } catch (e) { return ts; }
    }
    function fmtStatus(status) {
      const cls = status === "online" ? "ok" : status === "offline" ? "warn" : "muted";
      return `<span class="pill ${cls}">${escapeHtml(status || "—")}</span>`;
    }

    function fmtJobStatus(status) {
      const map = {
        succeeded: { cls: "job-success", icon: "✓", label: "Success" },
        failed: { cls: "job-failed", icon: "✕", label: "Failed" },
        running: { cls: "job-running", icon: "↻", label: "Running" },
        pending: { cls: "job-pending", icon: "◔", label: "Pending" },
        canceled: { cls: "job-canceled", icon: "⊘", label: "Canceled" },
      };
      const m = map[status] || { cls: "job-unknown", icon: "•", label: status || "—" };
      return `<span class="job-badge ${m.cls}"><span class="job-badge-icon">${m.icon}</span>${escapeHtml(m.label)}</span>`;
    }

    function fmtJobCommand(cmd) {
      const map = {
        "backup.run": { cls: "cmd-backup", icon: "▲", label: "backup.run" },
        "restore.run": { cls: "cmd-restore", icon: "▼", label: "restore.run" },
        "snapshots.list": { cls: "cmd-list", icon: "≡", label: "snapshots.list" },
        "snapshot.ls": { cls: "cmd-list", icon: "≡", label: "snapshot.ls" },
        "snapshot.dump": { cls: "cmd-dump", icon: "◆", label: "snapshot.dump" },
        "snapshot.restore": { cls: "cmd-restore", icon: "▼", label: "snapshot.restore" },
      };
      const m = map[cmd] || { cls: "cmd-other", icon: "•", label: cmd || "—" };
      return `<span class="cmd-badge ${m.cls}"><span class="cmd-badge-icon">${m.icon}</span>${escapeHtml(m.label)}</span>`;
    }

    async function apiGet(path) {
      const resp = await fetch(path);
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
      return resp.json();
    }
    async function apiPost(path, body) {
      const resp = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `${resp.status} ${resp.statusText}`);
      }
      return resp.json();
    }
    async function apiPatch(path, body) {
      const resp = await fetch(path, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `${resp.status} ${resp.statusText}`);
      }
      return resp.json();
    }
    async function apiDelete(path) {
      const resp = await fetch(path, { method: "DELETE" });
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (resp.status === 204) return null;
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `${resp.status} ${resp.statusText}`);
      }
      return resp.json();
    }

    async function fetchWorkerInventory(workerId) {
      if (!workerId) return null;
      if (state.workerInventories[workerId]) return state.workerInventories[workerId];
      try {
        const snapshot = await apiGet(`/api/v1/workers/${encodeURIComponent(workerId)}/inventory`);
        state.workerInventories[workerId] = snapshot;
        return snapshot;
      } catch (e) { return null; }
    }
    function getWorkerComposeProjects(workerId) {
      const snapshot = state.workerInventories[workerId];
      if (!snapshot || !snapshot.inventory) return [];
      return snapshot.inventory.compose_project_details || [];
    }

    function renderSidebar() {
      const sidebar = document.getElementById("sidebar");
      const items = NAV_ITEMS.filter(item => !state.currentRole || item.roles.includes(state.currentRole));
      sidebar.innerHTML = `
        <div class="workspace"><span class="logo">DV</span><span>Docker Volume Backup</span></div>
        <div class="section-label">Operacion</div>
        <nav class="section">
          ${items.map(item => `
            <a class="item ${state.currentView === item.id ? "active" : ""}" href="#/${item.id}" data-view="${item.id}">
              ${ICONS[item.icon] || ""}<span>${escapeHtml(item.label)}</span>
            </a>
          `).join("")}
        </nav>
        <div class="footer">
          <div class="section-label">Sesion</div>
          <nav class="section">
            <a class="item" href="#" id="logoutBtn">${ICONS.logout}<span>Cerrar sesion</span></a>
          </nav>
        </div>
      `;
      sidebar.querySelector("#logoutBtn").addEventListener("click", async (e) => {
        e.preventDefault();
        try { await fetch("/api/v1/auth/logout", { method: "POST" }); } catch (err) {}
        window.location.href = "/login";
      });
    }

    function renderTopbar() {
      const topbar = document.getElementById("topbar");
      const titles = {
        dashboard: "Dashboard", workers: "Workers", targets: "Targets", jobs: "Jobs",
        storage: "Storage Profiles", retention: "Retention Policies", secrets: "Secretos", users: "Usuarios", settings: "Settings",
      };
      topbar.innerHTML = `
        <div class="page-title">${escapeHtml(titles[state.currentView] || "")}</div>
        <div class="spacer"></div>
        <div class="user-chip">
          <span class="name">${escapeHtml(state.currentUser || "")}</span>
          <span class="pill muted">${escapeHtml(state.currentRole || "")}</span>
        </div>
      `;
    }

    function setView(view) {
      state.currentView = view;
      if (view !== "jobs") stopJobsPolling();
      renderSidebar();
      renderTopbar();
      const content = document.getElementById("content");
      content.innerHTML = "";
      const viewRenderers = {
        dashboard: renderDashboard, workers: renderWorkers, targets: renderTargets, jobs: renderJobs,
        storage: renderStorage, retention: renderRetention, secrets: renderSecrets, users: renderUsers, settings: renderSettings,
      };
      const renderer = viewRenderers[view];
      if (renderer) renderer(content);
    }

    function route() {
      const hash = window.location.hash.replace(/^#\/?/, "") || "dashboard";
      const view = NAV_ITEMS.some(i => i.id === hash) ? hash : "dashboard";
      setView(view);
    }
    window.addEventListener("hashchange", route);

    function statCard(eyebrow, title, value, meta) {
      return `<article class="card compact"><span class="eyebrow">${escapeHtml(eyebrow)}</span><div class="title">${escapeHtml(title)}</div><div class="value">${escapeHtml(String(value))}</div><div class="meta">${escapeHtml(meta || "")}</div></article>`;
    }

    function renderDashboard(content) {
      const onlineWorkers = state.workers.filter(w => w.status === "online").length;
      content.innerHTML = `
        <div class="page-header"><div><h2>Resumen</h2><div class="subtitle">Estado general del Control Plane</div></div></div>
        <div class="stat-grid">
          ${statCard("Workers", "Online", onlineWorkers, `${state.workers.length} total`)}
          ${statCard("Targets", "Configurados", state.targets.length, "targets de backup")}
          ${statCard("Jobs", "Total", state.jobs.length, "historico de jobs")}
          ${statCard("Storage", "Profiles", state.storageProfiles.length, "profiles configurados")}
        </div>
        <div class="page-header"><div><h2>Workers recientes</h2><div class="subtitle">Estado de los agentes registrados</div></div></div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>Nombre</th><th>Host</th><th>Status</th><th>Version</th><th>Ult. seen</th></tr></thead>
          <tbody>${state.workers.length ? state.workers.slice(0, 5).map(w => `<tr><td>${escapeHtml(w.name)}</td><td class="mono">${escapeHtml(w.host_name || "—")}</td><td>${fmtStatus(w.status)}</td><td class="mono">${escapeHtml(w.version || "—")}</td><td class="mono">${fmtDate(w.last_seen_at)}</td></tr>`).join("") : `<tr><td colspan="5" class="empty-state">Sin workers registrados</td></tr>`}</tbody>
        </table></div></div>
        <div class="page-header"><div><h2>Jobs recientes</h2><div class="subtitle">Ultimos jobs ejecutados</div></div></div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>ID</th><th>Target</th><th>Status</th><th>Inicio</th><th>Fin</th></tr></thead>
          <tbody>${state.jobs.length ? state.jobs.slice(0, 5).map(j => `<tr><td class="mono">${escapeHtml(String(j.id).slice(0,8))}</td><td>${escapeHtml(j.target_id || "—")}</td><td>${fmtStatus(j.status)}</td><td class="mono">${fmtDate(j.started_at)}</td><td class="mono">${fmtDate(j.finished_at)}</td></tr>`).join("") : `<tr><td colspan="5" class="empty-state">Sin jobs ejecutados</td></tr>`}</tbody>
        </table></div></div>
      `;
    }

    function renderWorkers(content) {
      const canEnroll = state.currentRole === "admin";
      content.innerHTML = `
        <div class="page-header">
          <div><h2>Workers</h2><div class="subtitle">Agentes registrados en el Control Plane</div></div>
          ${canEnroll ? `<button class="btn primary sm" id="addWorkerBtn">+ Agregar worker</button>` : ""}
        </div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>Nombre</th><th>Host</th><th>Status</th><th>Version</th><th>Labels</th><th>Ult. seen</th></tr></thead>
          <tbody>${state.workers.length ? state.workers.map(w => `<tr><td>${escapeHtml(w.name)}</td><td class="mono">${escapeHtml(w.host_name || "—")}</td><td>${fmtStatus(w.status)}</td><td class="mono">${escapeHtml(w.version || "—")}</td><td class="mono">${escapeHtml(w.labels ? JSON.stringify(w.labels) : "—")}</td><td class="mono">${fmtDate(w.last_seen_at)}</td></tr>`).join("") : `<tr><td colspan="6" class="empty-state">Sin workers registrados</td></tr>`}</tbody>
        </table></div></div>
      `;
      const addBtn = document.getElementById("addWorkerBtn");
      if (addBtn) addBtn.addEventListener("click", openAddWorkerModal);
    }

    let addWorkerState = { step: "form", enrollment: null, activeTab: "compose" };

    async function openAddWorkerModal() {
      addWorkerState = { step: "form", enrollment: null, activeTab: "compose" };
      renderAddWorkerModal();
      const overlay = document.getElementById("modalOverlay");
      if (overlay) overlay.classList.add("open");
    }

    function closeAddWorkerModal() {
      const overlay = document.getElementById("modalOverlay");
      if (overlay) overlay.classList.remove("open");
    }

    async function renderAddWorkerModal() {
      const overlay = document.getElementById("modalOverlay");
      if (!overlay) return;
      if (addWorkerState.step === "form") {
        let tlsEnabled = false;
        try {
          const resp = await fetch("/api/v1/config/public");
          if (resp.ok) {
            const cfg = await resp.json();
            tlsEnabled = cfg.tls_enabled === true;
          }
        } catch (_) {}
        if (tlsEnabled) {
          overlay.innerHTML = `
            <div class="modal">
              <div class="modal-header"><h3>Agregar worker (mTLS)</h3><button class="close" id="modalClose">&times;</button></div>
              <div class="modal-body">
                <div class="helper">El Control Plane tiene TLS habilitado. Genera un token de enrolamiento para registrar un nuevo worker. El token se usa una sola vez y expira automaticamente.</div>
                <div class="field-row">
                  <div class="field"><label for="awName">Nombre del worker</label><input id="awName" placeholder="worker-prod-01" value="worker" /></div>
                  <div class="field"><label for="awHost">Host</label><input id="awHost" placeholder="srv-prod-01" value="unknown-host" /></div>
                  <div class="field"><label for="awTtl">TTL (minutos)</label><input id="awTtl" type="number" value="60" /></div>
                </div>
                <div class="btn-row">
                  <button class="btn primary sm" id="awGenerate">Generar token</button>
                  <button class="btn ghost sm" id="awCancel">Cancelar</button>
                </div>
                <div class="alert" id="awError"></div>
              </div>
            </div>
          `;
          document.getElementById("modalClose").addEventListener("click", closeAddWorkerModal);
          document.getElementById("awCancel").addEventListener("click", closeAddWorkerModal);
          overlay.addEventListener("click", (e) => { if (e.target === overlay) closeAddWorkerModal(); });
          document.getElementById("awGenerate").addEventListener("click", generateEnrollment);
        } else {
          overlay.innerHTML = `
            <div class="modal">
              <div class="modal-header"><h3>Agregar worker</h3><button class="close" id="modalClose">&times;</button></div>
              <div class="modal-body">
                <div class="helper">El worker se registrara automaticamente al arrancar con el nombre y host que definas aqui. No se requiere token ni TLS.</div>
                <div class="field-row">
                  <div class="field"><label for="awName">Nombre del worker</label><input id="awName" placeholder="worker-prod-01" value="worker" /></div>
                  <div class="field"><label for="awHost">Host</label><input id="awHost" placeholder="srv-prod-01" value="unknown-host" /></div>
                </div>
                <div class="btn-row">
                  <button class="btn primary sm" id="awGenerate">Generar comandos</button>
                  <button class="btn ghost sm" id="awCancel">Cancelar</button>
                </div>
              </div>
            </div>
          `;
          document.getElementById("modalClose").addEventListener("click", closeAddWorkerModal);
          document.getElementById("awCancel").addEventListener("click", closeAddWorkerModal);
          overlay.addEventListener("click", (e) => { if (e.target === overlay) closeAddWorkerModal(); });
          document.getElementById("awGenerate").addEventListener("click", () => {
            const name = document.getElementById("awName").value.trim() || "worker";
            const host_name = document.getElementById("awHost").value.trim() || "unknown-host";
            addWorkerState.enrollment = { name, host_name, worker_id: null, token: null, expires_at: null, ca_certificate_pem: null };
            addWorkerState.tlsEnabled = false;
            addWorkerState.step = "commands";
            renderAddWorkerModal();
          });
        }
      } else if (addWorkerState.step === "commands") {
        renderAddWorkerCommands();
      }
    }

    async function generateEnrollment() {
      const errorBox = document.getElementById("awError");
      errorBox.textContent = "";
      const name = document.getElementById("awName").value.trim() || "worker";
      const host_name = document.getElementById("awHost").value.trim() || "unknown-host";
      const ttl_minutes = parseInt(document.getElementById("awTtl").value) || 60;
      try {
        const enrollment = await apiPost("/api/v1/admin/worker-enrollments", { name, host_name, ttl_minutes });
        addWorkerState.enrollment = enrollment;
        addWorkerState.tlsEnabled = true;
        addWorkerState.step = "commands";
        renderAddWorkerModal();
      } catch (error) {
        if (error.message.includes("TLS manager")) {
          addWorkerState.enrollment = { name, host_name, worker_id: "—", token: null, expires_at: null, ca_certificate_pem: null };
          addWorkerState.tlsEnabled = false;
          addWorkerState.step = "commands";
          renderAddWorkerModal();
        } else {
          errorBox.textContent = `Error generando token: ${error.message}`;
        }
      }
    }

    async function renderAddWorkerCommands() {
      const overlay = document.getElementById("modalOverlay");
      if (!overlay) return;
      const e = addWorkerState.enrollment;
      if (!e) return;
      const tlsEnabled = addWorkerState.tlsEnabled !== false;
      let cpUrl = "";
      try {
        const resp = await fetch("/api/v1/config/public");
        if (resp.ok) {
          const cfg = await resp.json();
          if (cfg.public_url) cpUrl = cfg.public_url.replace(/\/+$/, "");
        }
      } catch (_) {}
      if (!cpUrl) {
        const cpHost = window.location.hostname || "localhost";
        const cpPort = window.location.port || "8080";
        const cpProto = window.location.protocol || "http:";
        cpUrl = `${cpProto}//${cpHost}${cpPort ? ":" + cpPort : ""}`;
      }
      const token = e.token || "";
      const workerId = e.worker_id || "";
      const caPem = (e.ca_certificate_pem || "").replace(/\n/g, "\\n");
      const wName = e.name || "worker";
      const wHost = e.host_name || "unknown-host";

      const enrollEnv = tlsEnabled ? `
      WORKER_ENROLLMENT_TOKEN: ${token}
      WORKER_ENROLLMENT_CA_PEM: "${caPem}"
      WORKER_TLS_DIR: /data/tls
      WORKER_TLS_CA_FILE: /data/tls/ca.pem
      WORKER_TLS_CERT_FILE: /data/tls/cert.pem
      WORKER_TLS_KEY_FILE: /data/tls/key.pem` : "";

      const enrollRunEnv = tlsEnabled ? ` \\
  -e WORKER_ENROLLMENT_TOKEN="${token}" \\
  -e WORKER_ENROLLMENT_CA_PEM="${caPem}" \\
  -e WORKER_TLS_DIR="/data/tls" \\
  -e WORKER_TLS_CA_FILE="/data/tls/ca.pem" \\
  -e WORKER_TLS_CERT_FILE="/data/tls/cert.pem" \\
  -e WORKER_TLS_KEY_FILE="/data/tls/key.pem"` : "";

      const enrollVol = tlsEnabled ? `
      - worker_tls:/data/tls` : "";
      const enrollVolRun = tlsEnabled ? ` -v ${wName}-tls:/data/tls` : "";
      const enrollVolName = tlsEnabled ? `
volumes:
  worker_tls:` : "";

      const composeYml = `services:
  worker:
    image: ghcr.io/danielrondongarcia/docker-volume-backup-worker:latest
    restart: unless-stopped
    environment:
      CONTROL_PLANE_URL: ${cpUrl}
      WORKER_NAME: ${wName}
      WORKER_HOST_NAME: ${wHost}
      WORKER_VERSION: ghcr
      WORKER_RUN_ONCE: "false"
      WORKER_POLL_INTERVAL_SECONDS: "15"
      WORKER_HEALTH_PORT: "8081"${enrollEnv}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock${enrollVol}
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5${enrollVolName}`;

      const dockerRun = `docker run -d --name ${wName} \\
  --restart unless-stopped \\
  -v /var/run/docker.sock:/var/run/docker.sock${enrollVolRun} \\
  -e CONTROL_PLANE_URL="${cpUrl}" \\
  -e WORKER_NAME="${wName}" \\
  -e WORKER_HOST_NAME="${wHost}" \\
  -e WORKER_VERSION="ghcr" \\
  -e WORKER_RUN_ONCE="false" \\
  -e WORKER_POLL_INTERVAL_SECONDS="15" \\
  -e WORKER_HEALTH_PORT="8081"${enrollRunEnv} \\
  ghcr.io/danielrondongarcia/docker-volume-backup-worker:latest`;

      const composeCmd = `# Guarda este archivo como docker-compose.yml y ejecuta:
docker compose up -d

# El worker se auto-registrara al arrancar.`;

      const tlsNote = tlsEnabled
        ? `<div class="card compact"><div class="eyebrow">Worker ID</div><div class="value" style="font-size:13px;font-family:var(--font-mono);word-break:break-all">${escapeHtml(workerId)}</div><div class="meta">Token expira: ${escapeHtml(fmtDate(e.expires_at))}</div></div>`
        : "";

      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>Comandos para desplegar el worker</h3>
            <button class="close" id="modalClose">&times;</button>
          </div>
          <div class="modal-body">
            ${tlsNote}
            <div class="card compact">
              <div class="eyebrow">URL del Control Plane en los comandos</div>
              <div class="value" style="font-size:13px;font-family:var(--font-mono);word-break:break-all">${escapeHtml(cpUrl)}</div>
              <div class="support">Si esta URL no es correcta (proxy, puerto distinto, dominio), configura <code>CONTROL_PLANE_PUBLIC_URL</code> en Settings.</div>
            </div>
            <div class="tabs">
              <button class="tab ${addWorkerState.activeTab === "compose" ? "active" : ""}" data-tab="compose">docker-compose.yml</button>
              <button class="tab ${addWorkerState.activeTab === "run" ? "active" : ""}" data-tab="run">docker run</button>

              <button class="btn ghost sm" id="awBack">Volver</button>

          </div>

      `;
      document.getElementById("modalClose").addEventListener("click", closeAddWorkerModal);
      document.getElementById("awDone").addEventListener("click", async () => { closeAddWorkerModal(); await refreshAll(); });
      document.getElementById("awBack").addEventListener("click", () => { addWorkerState.step = "form"; renderAddWorkerModal(); });
      overlay.addEventListener("click", (e2) => { if (e2.target === overlay) closeAddWorkerModal(); });

      const tabs = overlay.querySelectorAll(".tab");
      tabs.forEach(tab => tab.addEventListener("click", () => {
        addWorkerState.activeTab = tab.dataset.tab;
        renderAddWorkerCommands();
      }));

      const tabContent = document.getElementById("tabContent");
      let code = "";
      let label = "";
      if (addWorkerState.activeTab === "compose") { code = composeCmd + "\\n\\n# --- docker-compose.yml ---\\n" + composeYml; label = "docker-compose.yml"; }
      else if (addWorkerState.activeTab === "run") { code = dockerRun; label = "docker run"; }
      tabContent.innerHTML = `
        <div class="code-block"><button class="copy-btn" data-code-id="modalCode">Copiar</button><pre id="modalCode">${escapeHtml(code)}</pre></div>
      `;
      const copyBtn = tabContent.querySelector(".copy-btn");
      if (copyBtn) {
        copyBtn.addEventListener("click", () => {
          const codeEl = document.getElementById("modalCode");
          if (!codeEl) return;
          navigator.clipboard.writeText(codeEl.textContent).then(() => {
            copyBtn.textContent = "Copiado";
            copyBtn.classList.add("copied");
            setTimeout(() => { copyBtn.textContent = "Copiar"; copyBtn.classList.remove("copied"); }, 1500);
          }).catch(() => {});
        });
      }
    }

    let targetModalState = { mode: "create", target: null, volumeProject: null, isEditing: false };

    function renderTargets(content) {
      const workerOptions = state.workers.map(w => `<option value="${escapeHtml(w.id)}">${escapeHtml(w.name)}</option>`).join("");
      const storageOptions = state.storageProfiles.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("");
      const retentionOptions = state.retentionPolicies.map(r => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.name)}</option>`).join("");
      const settings = state.settings || {};
      const hasDefaultPassword = !!(settings.restic_password_secret_id);
      const passwordSecretOptions = state.secrets.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("");
      content.innerHTML = `
        <div class="page-header"><div><h2>Targets</h2><div class="subtitle">Configura que se va a backupear por worker y compose project</div></div></div>
        <details class="form-section"><summary>Crear target</summary><div class="form-body">
          <form id="createTargetForm">
            <div class="form-grid">
              <div class="field"><label for="targetName">Nombre</label><input id="targetName" required /></div>
              <div class="field"><label for="targetWorkerId">Worker</label><select id="targetWorkerId" ${state.workers.length ? "" : "disabled"}>${workerOptions}</select></div>
              <div class="field"><label for="targetComposeProject">Compose project</label><select id="targetComposeProject" ${state.workers.length ? "" : "disabled"}><option value="">-- Seleccionar worker --</option></select></div>
              <div class="field"><label for="targetBackupMode">Modo</label><select id="targetBackupMode"><option value="hot">hot</option><option value="cold">cold</option></select></div>
              <div class="field"><label for="targetBackupStrategy">Estrategia</label><select id="targetBackupStrategy"><option value="restic">restic</option><option value="tar">tar</option></select></div>
              <div class="field"><label for="targetStorageProfileId">Storage profile</label><select id="targetStorageProfileId">${storageOptions}</select></div>
              <div class="field"><label for="targetRetentionPolicyId">Retencion</label><select id="targetRetentionPolicyId">${retentionOptions}</select></div>
              <div class="field"><label for="targetCronExpression">Cron (opcional)</label><input id="targetCronExpression" placeholder="0 3 * * * (diario 3am)" /><div class="helper">Expresion cron de 5 campos. Vacio = solo manual. Ej: <code>0 3 * * *</code> (diario 3am), <code>0 */6 * * *</code> (cada 6h).</div><div id="targetCronPreview" class="cron-preview"></div></div>
              ${hasDefaultPassword ? "" : `<div class="field"><label for="targetResticPasswordSecret">Password restic (secret) *</label><select id="targetResticPasswordSecret"><option value="">-- Seleccionar --</option>${passwordSecretOptions}</select><div class="helper">Obligatorio: no hay password default en Settings.</div></div>`}
            </div>
            <div class="field full">
              <label>Volumenes a backupear</label>
              <div id="targetVolumeList" class="volume-list"><div class="helper">Selecciona un compose project para ver los volumenes disponibles.</div></div>
            </div>
            <div id="targetProjectSummary" class="helper">Selecciona un worker para ver sus compose projects y volumenes detectados.</div>
            <details class="sub-section">
              <summary>Opciones avanzadas</summary>
              <div class="form-grid" style="margin-top:8px">
                ${hasDefaultPassword ? `<div class="field"><label for="targetResticPasswordSecret">Password restic (secret) — opcional</label><select id="targetResticPasswordSecret"><option value="">-- Usar default de Settings --</option>${passwordSecretOptions}</select><div class="helper">Si lo dejas vacio, se usara el password default del Control Plane.</div></div>` : ""}
                <div class="field"><label for="targetRuntimeCommand">Comando de backup (opcional)</label><input id="targetRuntimeCommand" placeholder="Por defecto: /root/backup.sh" /></div>
                <div class="field full"><label for="targetRuntimeEnvironment">Runtime environment JSON (opcional)</label><textarea id="targetRuntimeEnvironment" placeholder="{}">{}</textarea></div>
                <div class="field full"><label for="targetRestoreDefaults">Restore defaults JSON (opcional)</label><textarea id="targetRestoreDefaults" placeholder="{}">{"layout":"auto"}</textarea></div>
              </div>
            </details>
            <div class="btn-row"><button type="submit" class="btn primary sm" ${state.workers.length ? "" : "disabled"}>Crear target</button></div>
            <div class="helper">${state.workers.length ? "Selecciona los volumenes que quieres backupear. Si no marcas ninguno, se backupearan todos los del proyecto." : "Primero registra al menos un worker."}</div>
          </form>
        </div></details>
        <div class="page-header"><div><h2>Targets configurados</h2></div></div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>Nombre</th><th>Worker</th><th>Compose project</th><th>Modo</th><th>Volumenes</th><th>Retencion</th><th>Cron</th><th class="col-toggle">Activo</th><th class="col-actions">Acciones</th></tr></thead>
          <tbody>${state.targets.length ? state.targets.map(t => {
            const worker = state.workers.find(w => w.id === t.worker_id);
            const retention = state.retentionPolicies.find(r => r.id === t.retention_policy_id);
            const lastJob = getLastJobForTarget(t.id);
            const cronLabel = t.cron_expression ? `<code class="mono" style="font-size:11px;">${escapeHtml(t.cron_expression)}</code>` : '<span style="color:var(--muted-foreground);">manual</span>';
            return `<tr>
              <td>${escapeHtml(t.name)}</td>
              <td>${escapeHtml(worker ? worker.name : t.worker_id)}</td>
              <td class="mono">${escapeHtml(t.compose_project || "—")}</td>
              <td>${escapeHtml(t.backup_mode)}</td>
              <td class="mono">${escapeHtml((t.volume_targets || []).join(", ") || "—")}</td>
              <td>${escapeHtml(retention ? retention.name : "—")}</td>
              <td>${cronLabel}</td>
              <td class="toggle-cell">
                <label class="switch" title="${t.enabled ? "Deshabilitar backups de este target" : "Habilitar backups de este target"}">
                  <input type="checkbox" data-action="toggle" data-id="${escapeHtml(t.id)}" ${t.enabled ? "checked" : ""} />
                  <span class="slider"></span>
                </label>
                <span class="toggle-label ${t.enabled ? "on" : ""}">${t.enabled ? "Si" : "No"}</span>
              </td>
              <td class="action-cell">
                <div class="dropdown">
                  <button class="btn ghost xs dropdown-trigger" data-dropdown="${escapeHtml(t.id)}">Acciones ▾</button>
                  <div class="dropdown-menu" id="dd-${escapeHtml(t.id)}">
                    <button class="dropdown-item" data-action="run" data-id="${escapeHtml(t.id)}" ${t.enabled ? "" : "disabled"}>Ejecutar backup</button>
                    ${t.backup_strategy === "restic" ? `<button class="dropdown-item" data-action="snapshots" data-id="${escapeHtml(t.id)}">Snapshots</button>` : ""}
                    ${lastJob ? `<button class="dropdown-item" data-action="logs" data-id="${escapeHtml(t.id)}" data-job="${escapeHtml(lastJob.id)}">Ver logs</button>` : ""}
                    <button class="dropdown-item" data-action="edit" data-id="${escapeHtml(t.id)}">Editar</button>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item danger" data-action="delete" data-id="${escapeHtml(t.id)}" data-name="${escapeHtml(t.name)}">Eliminar</button>
                  </div>
                </div>
              </td>
            </tr>`;
          }).join("") : `<tr><td colspan="9" class="empty-state">Sin targets configurados</td></tr>`}</tbody>
        </table></div></div>
        <div id="targetLogPanel"></div>
      `;
      bindTargetForm();
      bindTargetActions();
      if (currentLogJobId) {
        const target = state.targets.find(t => {
          const jobs = (state.jobs || []).filter(j => j.id === currentLogJobId);
          return jobs.length ? t.id === jobs[0].target_id : false;
        });
        reopenLogPanel(currentLogJobId, target ? target.id : null);
      }
    }

    function getLastJobForTarget(targetId) {
      const targetJobs = (state.jobs || []).filter(j => j.target_id === targetId
        && ["backup.run", "restore.run", "restore.dry_run", "retention.run"].includes(j.command));
      if (!targetJobs.length) return null;
      return targetJobs.sort((a, b) => (b.updated_at || "").localeCompare(a.updated_at || ""))[0];
    }

    function bindTargetActions() {
      const container = document.querySelector(".table-wrap");
      if (!container) return;
      container.querySelectorAll(".dropdown-trigger").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const menu = document.getElementById("dd-" + btn.dataset.dropdown);
          if (!menu) return;
          const isOpen = menu.classList.contains("open");
          document.querySelectorAll(".dropdown-menu.open").forEach(m => { if (m !== menu) m.classList.remove("open"); });
          if (isOpen) {
            menu.classList.remove("open");
            return;
          }
          const rect = btn.getBoundingClientRect();
          menu.style.top = (rect.bottom + 4) + "px";
          menu.style.right = (window.innerWidth - rect.right) + "px";
          menu.classList.add("open");
        });
      });
      container.querySelectorAll("[data-action]").forEach(btn => {
        if (btn.dataset.action === "toggle") return;
        if (btn.classList.contains("dropdown-trigger")) return;
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const menu = btn.closest(".dropdown-menu");
          if (menu) menu.classList.remove("open");
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          const jobId = btn.dataset.job;
          const target = state.targets.find(t => t.id === id);
          if (!target) return;
          if (action === "run") { await runBackupNow(id); }
          else if (action === "snapshots") { openSnapshotsModal(target); }
          else if (action === "logs") { openLogPanel(jobId, id); }
          else if (action === "edit") { openEditTargetModal(target); }
          else if (action === "delete") { openDeleteTargetModal(id, btn.dataset.name); }
        });
      });
      container.querySelectorAll('input[type="checkbox"][data-action="toggle"]').forEach(cb => {
        cb.addEventListener("change", async () => {
          const id = cb.dataset.id;
          const newEnabled = cb.checked;
          try {
            await apiPatch(`/api/v1/targets/${id}`, { enabled: newEnabled });
            await refreshAll();
          } catch (error) {
            cb.checked = !newEnabled;
            alert(`Error cambiando estado del target: ${error.message}`);
          }
        });
      });
    }

    function openDeleteTargetModal(targetId, name) {
      const overlay = document.getElementById("modalOverlay");
      overlay.innerHTML = `
        <div class="modal" style="max-width:480px;">
          <div class="modal-header"><h3>Eliminar target</h3><button class="close" id="tdelClose">&times;</button></div>
          <div class="modal-body">
            <p>¿Eliminar el target <strong>${escapeHtml(name)}</strong>?</p>
            <div class="helper">Esta accion no se puede deshacer. Los jobs historicos se conservaran pero no se podran ejecutar nuevos backups para este target.</div>
          </div>
          <div class="modal-footer">
            <button class="btn" id="tdelCancel">Cancelar</button>
            <button class="btn danger" id="tdelConfirm">Eliminar</button>
          </div>
        </div>
      `;
      overlay.classList.add("open");
      function close() { overlay.classList.remove("open"); overlay.innerHTML = ""; }
      document.getElementById("tdelClose").addEventListener("click", close);
      document.getElementById("tdelCancel").addEventListener("click", close);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
      document.getElementById("tdelConfirm").addEventListener("click", async () => {
        try {
          await apiDelete(`/api/v1/targets/${targetId}`);
          await refreshAll();
          close();
        } catch (error) { alert(`Error eliminando target: ${error.message}`); }
      });
    }

    async function runBackupNow(targetId) {
      try {
        const job = await apiPost(`/api/v1/targets/${targetId}/backup`, { requested_by: "ui" });
        openLogPanel(job.id, targetId);
      } catch (error) { alert(`Error ejecutando backup: ${error.message}`); }
    }

    let snapshotBrowserState = null;

    async function openSnapshotsModal(target) {
      const overlay = document.getElementById("modalOverlay");
      if (!overlay) return;
      snapshotBrowserState = { target, snapshots: [], currentSnapshot: null, currentPath: "", entries: [], loading: false };
      overlay.innerHTML = `
        <div class="modal modal-snapshots" style="display:flex; flex-direction:column;">
          <div class="modal-header">
            <div><h3>Snapshots de ${escapeHtml(target.name)}</h3><div class="subtitle" style="font-size:12px; color:var(--muted-foreground); margin-top:2px;">Explora y descarga contenido de snapshots restic</div></div>
            <button class="close" id="snapClose" title="Cerrar">&times;</button>
          </div>
          <div id="snapContent" style="flex:1; overflow-y:auto; padding:20px; min-height:300px;"></div>
        </div>
      `;
      overlay.classList.add("open");
      document.getElementById("snapClose").addEventListener("click", () => { overlay.classList.remove("open"); overlay.innerHTML = ""; });
      await loadSnapshotsList(target);
    }

    async function loadSnapshotsList(target, opts) {
      const content = document.getElementById("snapContent");
      if (!content) return;
      const skipSync = opts && opts.skipSync;
      try {
        const snaps = await apiGet(`/api/v1/targets/${target.id}/snapshots`);
        snapshotBrowserState.snapshots = snaps.items || [];
        renderSnapshotsList(content);
        if (skipSync) return;
        triggerSnapshotsSync(target);
      } catch (error) {
        content.innerHTML = `<div class="snap-error"><strong>Error cargando snapshots:</strong> ${escapeHtml(error.message)}<button class="btn ghost xs" id="snapRefresh">Reintentar</button></div>`;
        const refreshBtn = document.getElementById("snapRefresh");
        if (refreshBtn) refreshBtn.addEventListener("click", () => loadSnapshotsList(target));
      }
    }

    async function triggerSnapshotsSync(target) {
      const content = document.getElementById("snapContent");
      if (!content) return;
      let banner = content.querySelector("#snapSyncBanner");
      if (banner) return;
      const bannerHtml = `<div class="snap-sync-banner" id="snapSyncBanner"><div class="snap-spinner-sm"></div><span id="snapSyncText">Sincronizando con el storage remoto...</span><button class="btn ghost xs" id="snapSyncCancel" style="margin-left:auto;">Ocultar</button></div>`;
      content.insertAdjacentHTML("afterbegin", bannerHtml);
      banner = content.querySelector("#snapSyncBanner");
      const cancelBtn = content.querySelector("#snapSyncCancel");
      if (cancelBtn) cancelBtn.addEventListener("click", () => { if (banner) banner.remove(); });
      try {
        const syncResp = await apiPost(`/api/v1/targets/${target.id}/snapshots-sync`, { requested_by: "ui" });
        const jobId = syncResp.id;
        if (!jobId) { if (banner) banner.remove(); return; }
        const maxAttempts = 150;
        for (let i = 0; i < maxAttempts; i++) {
          if (!document.getElementById("snapSyncBanner")) return;
          await new Promise(r => setTimeout(r, 1000));
          const syncText = document.getElementById("snapSyncText");
          if (syncText) syncText.textContent = `Sincronizando con el storage remoto... (${i + 1}/${maxAttempts})`;
          try {
            const job = await apiGet(`/api/v1/jobs/${jobId}`);
            if (job && (job.status === "succeeded" || job.status === "failed" || job.status === "cancelled")) {
              if (job.status === "succeeded") {
                if (banner) banner.remove();
                await loadSnapshotsList(target, { skipSync: true });
              } else {
                if (banner) {
                  const errLines = (job.log_lines || []).filter(l => l.toLowerCase().includes("error") || l.toLowerCase().includes("fail")).slice(-3);
                  banner.innerHTML = `<div class="snap-sync-error"><strong>Error sincronizando</strong>${errLines.length ? `<pre class="snap-error-log">${escapeHtml(errLines.join("\n"))}</pre>` : ""}<button class="btn ghost xs" id="snapSyncRetry">Reintentar sync</button></div>`;
                  const retryBtn = document.getElementById("snapSyncRetry");
                  if (retryBtn) retryBtn.addEventListener("click", () => { banner.remove(); triggerSnapshotsSync(target); });
                }
              }
              return;
            }
          } catch (e) {}
        }
        if (banner) {
          const syncText = document.getElementById("snapSyncText");
          if (syncText) syncText.textContent = "El sync sigue en background. Se actualizaran los snapshots cuando termine.";
        }
      } catch (error) {
        if (banner) banner.remove();
      }
    }

    let snapTableState = { sortKey: "created_at", sortDir: "desc", filters: { snapshot_id: "", created_at: "", paths: "" } };

    function renderSnapshotsList(content) {
      const allSnaps = snapshotBrowserState.snapshots;
      if (!allSnaps || allSnaps.length === 0) {
        content.innerHTML = `
          <div style="text-align:center; padding:40px;">
            <div style="color:var(--muted-foreground); margin-bottom:16px;">No hay snapshots disponibles para este target.</div>
            <button class="btn ghost xs" id="snapRefresh">Refrescar</button>
          </div>`;
        const refreshBtn = document.getElementById("snapRefresh");
        if (refreshBtn) refreshBtn.addEventListener("click", () => loadSnapshotsList(snapshotBrowserState.target));
        return;
      }

      const renderTable = () => {
        let snaps = allSnaps.slice();
        snaps = snaps.filter(s => {
          const id = (s.snapshot_id || "").toLowerCase();
          const date = s.created_at ? new Date(s.created_at).toLocaleString().toLowerCase() : "";
          const paths = (s.paths || []).join(", ").toLowerCase();
          if (snapTableState.filters.snapshot_id && !id.includes(snapTableState.filters.snapshot_id.toLowerCase())) return false;
          if (snapTableState.filters.created_at && !date.includes(snapTableState.filters.created_at.toLowerCase())) return false;
          if (snapTableState.filters.paths && !paths.includes(snapTableState.filters.paths.toLowerCase())) return false;
          return true;
        });
        const dir = snapTableState.sortDir === "asc" ? 1 : -1;
        snaps.sort((a, b) => {
          let va, vb;
          if (snapTableState.sortKey === "created_at") {
            va = new Date(a.created_at || 0).getTime();
            vb = new Date(b.created_at || 0).getTime();
          } else if (snapTableState.sortKey === "snapshot_id") {
            va = a.snapshot_id || "";
            vb = b.snapshot_id || "";
          } else if (snapTableState.sortKey === "paths") {
            va = (a.paths || []).join(", ");
            vb = (b.paths || []).join(", ");
          }
          if (va < vb) return -1 * dir;
          if (va > vb) return 1 * dir;
          return 0;
        });

        const sortIcon = (key) => {
          if (snapTableState.sortKey !== key) return " ↕";
          return snapTableState.sortDir === "asc" ? " ↑" : " ↓";
        };
        const sortAttrs = (key) => `data-sort="${key}" style="cursor:pointer; user-select:none;"`;

        content.innerHTML = `
          <div style="margin-bottom:16px; font-size:13px; color:var(--muted-foreground);">Selecciona un snapshot para explorar su contenido (${snaps.length} de ${allSnaps.length}):</div>
          <table class="table datatable" style="font-size:14px;">
            <thead>
              <tr>
                <th ${sortAttrs("snapshot_id")}>ID${sortIcon("snapshot_id")}</th>
                <th ${sortAttrs("created_at")}>Fecha${sortIcon("created_at")}</th>
                <th ${sortAttrs("paths")}>Paths${sortIcon("paths")}</th>
                <th style="width:120px;">Acciones</th>
              </tr>
              <tr class="filter-row">
                <th><input type="text" class="dt-filter" data-col="snapshot_id" placeholder="Filtrar ID..." value="${escapeHtml(snapTableState.filters.snapshot_id)}" /></th>
                <th><input type="text" class="dt-filter" data-col="created_at" placeholder="Filtrar fecha..." value="${escapeHtml(snapTableState.filters.created_at)}" /></th>
                <th><input type="text" class="dt-filter" data-col="paths" placeholder="Filtrar paths..." value="${escapeHtml(snapTableState.filters.paths)}" /></th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${snaps.length === 0 ? `<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--muted-foreground);">Sin resultados para los filtros aplicados.</td></tr>` : snaps.map(s => `
                <tr>
                  <td class="mono">${escapeHtml(s.snapshot_id || "—")}</td>
                  <td>${escapeHtml(s.created_at ? new Date(s.created_at).toLocaleString() : "—")}</td>
                  <td class="mono" style="font-size:12px; max-width:400px; overflow:hidden; text-overflow:ellipsis;">${escapeHtml((s.paths || []).join(", ") || "—")}</td>
                  <td class="action-cell">
                    <button class="btn primary xs" data-snap="${escapeHtml(s.snapshot_id)}">Explorar</button>
                    <button class="btn ghost xs danger" data-restore-snap="${escapeHtml(s.snapshot_id)}" data-restore-date="${escapeHtml(s.created_at ? new Date(s.created_at).toLocaleString() : '')}">Restaurar</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;

        content.querySelectorAll("[data-sort]").forEach(th => {
          th.addEventListener("click", () => {
            const key = th.dataset.sort;
            if (snapTableState.sortKey === key) {
              snapTableState.sortDir = snapTableState.sortDir === "asc" ? "desc" : "asc";
            } else {
              snapTableState.sortKey = key;
              snapTableState.sortDir = "desc";
            }
            renderTable();
          });
        });
        content.querySelectorAll(".dt-filter").forEach(input => {
          input.addEventListener("input", () => {
            snapTableState.filters[input.dataset.col] = input.value;
            renderTable();
          });
        });
        content.querySelectorAll("[data-snap]").forEach(btn => {
          btn.addEventListener("click", () => browseSnapshot(btn.dataset.snap, ""));
        });
        content.querySelectorAll("[data-restore-snap]").forEach(btn => {

    async function downloadSnapshotFile(snapshotId, filePath) {
      const fileName = filePath.split("/").pop() || "download";
      try {
        const btn = document.querySelector(`[data-download="${filePath.replace(/"/g, '&quot;')}"]`);
        if (btn) { btn.disabled = true; btn.textContent = "Descargando..."; }
        const result = await apiPost(`/api/v1/targets/${snapshotBrowserState.target.id}/snapshot-dump`, {
          snapshot_id: snapshotId,
          path: filePath,
        });
        if (btn) { btn.disabled = false; btn.textContent = "Descargar"; }
        if (!result.success || !result.b64_content) {
          const errMsg = result.error || "No se pudo obtener el contenido del archivo.";
          alert(`Error descargando ${fileName}:\n${errMsg.substring(0, 500)}`);
          return;
        }
        const binary = atob(result.b64_content);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const blob = new Blob([bytes], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (error) {
        const btn = document.querySelector(`[data-download="${filePath.replace(/"/g, '&quot;')}"]`);
        if (btn) { btn.disabled = false; btn.textContent = "Descargar"; }
        alert(`Error descargando ${fileName}: ${error.message}`);
      }
    }

    function cronNextRun(cronExpr, fromDate) {
      const parts = cronExpr.trim().split(/\s+/);
      if (parts.length !== 5) return null;
      const d = fromDate ? new Date(fromDate) : new Date();
      d.setSeconds(0, 0);
      const maxIter = 525600;
      for (let i = 0; i < maxIter; i++) {
        const next = new Date(d.getTime() + 60000 * (i + 1));
        const m = next.getMinutes();
        const h = next.getHours();
        const dom = next.getDate();
        const mon = next.getMonth() + 1;
        const dow = next.getDay();
        if (cronFieldMatch(parts[0], m) &&
            cronFieldMatch(parts[1], h) &&
            cronFieldMatch(parts[2], dom) &&
            cronFieldMatch(parts[3], mon) &&
            cronFieldMatch(parts[4], dow)) {
          return next;
        }
      }
      return null;
    }

    function cronFieldMatch(field, value) {
      if (field === "*") return true;
      for (let part of field.split(",")) {
        part = part.trim();
        let step = 1;
        if (part.includes("/")) {
          const [base, s] = part.split("/");
          step = parseInt(s, 10);
          part = base;
        }
        let lo, hi;
        if (part === "*") { lo = 0; hi = 59; }
        else if (part.includes("-")) { const [a, b] = part.split("-"); lo = parseInt(a, 10); hi = parseInt(b, 10); }
        else { lo = parseInt(part, 10); hi = lo; }
        if (isNaN(lo) || isNaN(hi) || isNaN(step)) continue;
        for (let v = lo; v <= hi; v += step) {
          if (v === value) return true;
        }
      }
      return false;
    }

    function cronDescribe(cronExpr) {
      const parts = cronExpr.trim().split(/\s+/);
      if (parts.length !== 5) return "";
      const [m, h, dom, mon, dow] = parts;
      if (m === "*" && h === "*" && dom === "*" && mon === "*" && dow === "*") return "cada minuto";
      const timeStr = (hh, mm) => `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
      if (m !== "*" && h !== "*" && !m.includes("/") && !h.includes("/") && dom === "*" && mon === "*" && dow === "*") {
        return `diario a las ${timeStr(parseInt(h,10), parseInt(m,10))}`;
      }
      if (m !== "*" && h !== "*" && !m.includes("/") && !h.includes("/") && dom === "*" && mon === "*" && dow !== "*") {
        const days = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
        const d = parseInt(dow,10);
        return `cada ${days[d]||""} a las ${timeStr(parseInt(h,10), parseInt(m,10))}`;
      }
      if (m !== "*" && h === "*" && dom === "*" && mon === "*" && dow === "*") {
        return `cada hora en el minuto ${parseInt(m,10)}`;
      }
      if (h.includes("*/") && m === "0" && dom === "*" && mon === "*" && dow === "*") {
        const every = parseInt(h.split("/")[1],10);
        return `cada ${every} horas`;
      }
      if (m.includes("*/") && h === "*" && dom === "*" && mon === "*" && dow === "*") {
        const every = parseInt(m.split("/")[1],10);
        return `cada ${every} minutos`;
      }
      if (dom !== "*" && mon === "*" && m !== "*" && h !== "*") {
        return `el dia ${dom} de cada mes a las ${timeStr(parseInt(h,10), parseInt(m,10))}`;
      }
      return `cron: ${cronExpr}`;
    }

    function updateCronPreview(inputId, previewId) {
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);
      if (!input || !preview) return;
      const expr = input.value.trim();
      if (!expr) {
        preview.innerHTML = '<span class="cron-manual">Solo manual (sin cron)</span>';
        return;
      }
      const parts = expr.split(/\s+/);
      if (parts.length !== 5) {
        preview.innerHTML = '<span class="cron-error">Formato invalido: debe tener 5 campos</span>';
        return;
      }
      try {
        const next = cronNextRun(expr);
        if (!next) {
          preview.innerHTML = '<span class="cron-error">No se encontro proxima ejecucion valida</span>';
          return;
        }
        const desc = cronDescribe(expr);
        const now = new Date();
        const diffMs = next.getTime() - now.getTime();
        const diffMin = Math.round(diffMs / 60000);
        let inStr;
        if (diffMin < 1) inStr = "ahora";
        else if (diffMin < 60) inStr = `en ${diffMin} min`;
        else if (diffMin < 1440) inStr = `en ${Math.floor(diffMin/60)}h ${diffMin%60}m`;
        else inStr = `en ${Math.floor(diffMin/1440)}d ${Math.floor((diffMin%1440)/60)}h`;
        const dateStr = next.toLocaleString("es-CO", { weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
        preview.innerHTML = `<span class="cron-badge">⏱ ${escapeHtml(desc)}</span><br><span class="cron-next">Proxima: <strong>${escapeHtml(dateStr)}</strong> (${inStr})</span>`;
      } catch (e) {
        preview.innerHTML = '<span class="cron-error">Error calculando proxima ejecucion</span>';
      }
    }

    function renderJobLogs(job) {
      const statusEl = document.getElementById("jobStatusBar");
      if (statusEl) {
        statusEl.innerHTML = `<span class="job-status-pill ${job.status}">${job.status}</span><span class="job-meta">Job: ${escapeHtml(job.id)}</span>`;
      }
      const container = document.getElementById("logContainer");
      if (!container) return;
      const lines = job.log_lines || [];
      if (!lines.length) { container.innerHTML = `<div class="log-line info">Esperando logs del worker...</div>`; return; }
      container.innerHTML = lines.map(line => {
        const lower = line.toLowerCase();
        let cls = "info";
        if (lower.includes("error") || lower.includes("err:") || lower.includes("failed") || lower.includes("traceback") || lower.includes("exception")) cls = "error";
        else if (lower.includes("warn") || lower.includes("warning")) cls = "warning";
        else if (lower.includes("info") || lower.includes("status") || lower.includes("starting") || lower.includes("success") || lower.includes("snapshot") || lower.includes("backup")) cls = "info";
        return `<div class="log-line ${cls}">${escapeHtml(line)}</div>`;
      }).join("");
      container.scrollTop = container.scrollHeight;
    }

    function pollJobLogs(jobId) {
      if (jobPollTimer) clearInterval(jobPollTimer);
      const fetchJob = async () => {
        try {
          const job = await apiGet(`/api/v1/jobs/${jobId}`);
          renderJobLogs(job);
          if (job.status === "succeeded" || job.status === "failed" || job.status === "canceled") {
            if (jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
            await refreshAll();
          }
        } catch (error) { }
      };
      fetchJob();
      jobPollTimer = setInterval(fetchJob, 2000);
    }
