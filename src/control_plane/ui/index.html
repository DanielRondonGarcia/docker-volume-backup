<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docker Volume Backup | Control Plane</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/app.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div class="modal-overlay" id="modalOverlay"></div>

  <script>
    const ICONS = {
      dashboard: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>',
      workers: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 6h12M6 3v10"/></svg>',
      targets: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r="0.5" fill="currentColor"/></svg>',
      jobs: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v4l3 2"/><circle cx="8" cy="8" r="6"/></svg>',
      storage: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1 2 2 5 2s5-1 5-2V4M3 8c0 1 2 2 5 2s5-1 5-2"/></svg>',
      retention: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v6l4 2"/><circle cx="8" cy="8" r="6"/><path d="M5 1.5 3 3M11 1.5 13 3"/></svg>',
      secrets: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>',
      users: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3 3-5 6-5s6 2 6 5"/></svg>',
      logout: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2H3v12h3M10 5l3 3-3 3M6 8h7"/></svg>',
    };

    const NAV_ITEMS = [
      { id: "dashboard", label: "Dashboard", icon: "dashboard", roles: ["admin", "operator", "viewer"] },
      { id: "workers", label: "Workers", icon: "workers", roles: ["admin", "operator", "viewer"] },
      { id: "targets", label: "Targets", icon: "targets", roles: ["admin", "operator", "viewer"] },
      { id: "jobs", label: "Jobs", icon: "jobs", roles: ["admin", "operator", "viewer"] },
      { id: "storage", label: "Storage", icon: "storage", roles: ["admin", "operator"] },
      { id: "retention", label: "Retention", icon: "retention", roles: ["admin", "operator"] },
      { id: "secrets", label: "Secretos", icon: "secrets", roles: ["admin"] },
      { id: "users", label: "Usuarios", icon: "users", roles: ["admin"] },
      { id: "settings", label: "Settings", icon: "settings", roles: ["admin"] },
    ];

    const state = {
      workers: [],
      targets: [],
      jobs: [],
      storageProfiles: [],
      retentionPolicies: [],
      secrets: [],
      localUsers: [],
      userManagement: null,
      currentUser: null,
      currentRole: null,
      workerInventories: {},
      currentView: "dashboard",
    };

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function emptyToNull(v) { return v && v.trim() ? v.trim() : null; }
    function parseJsonField(id, label) {
      const raw = document.getElementById(id).value.trim();
      if (!raw) return {};
      try { return JSON.parse(raw); } catch (e) { throw new Error(`JSON invalido en ${label}: ${e.message}`); }
    }
    function fmtDate(ts) {
      if (!ts) return "—";
      try { return new Date(ts).toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" }); } catch (e) { return ts; }
    }
    function fmtStatus(status) {
      const cls = status === "online" ? "ok" : status === "offline" ? "warn" : "muted";
      return `<span class="pill ${cls}">${escapeHtml(status || "—")}</span>`;
    }

    async function apiGet(path) {
      const resp = await fetch(path);
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
      return resp.json();
    }
    async function apiPost(path, body) {
      const resp = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `${resp.status} ${resp.statusText}`);
      }
      return resp.json();
    }
    async function apiPatch(path, body) {
      const resp = await fetch(path, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `${resp.status} ${resp.statusText}`);
      }
      return resp.json();
    }
    async function apiDelete(path) {
      const resp = await fetch(path, { method: "DELETE" });
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (resp.status === 204) return null;
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `${resp.status} ${resp.statusText}`);
      }
      return resp.json();
    }

    async function fetchWorkerInventory(workerId) {
      if (!workerId) return null;
      if (state.workerInventories[workerId]) return state.workerInventories[workerId];
      try {
        const snapshot = await apiGet(`/api/v1/workers/${encodeURIComponent(workerId)}/inventory`);
        state.workerInventories[workerId] = snapshot;
        return snapshot;
      } catch (e) { return null; }
    }
    function getWorkerComposeProjects(workerId) {
      const snapshot = state.workerInventories[workerId];
      if (!snapshot || !snapshot.inventory) return [];
      return snapshot.inventory.compose_project_details || [];
    }

    function renderSidebar() {
      const sidebar = document.getElementById("sidebar");
      const items = NAV_ITEMS.filter(item => !state.currentRole || item.roles.includes(state.currentRole));
      sidebar.innerHTML = `
        <div class="workspace"><span class="logo">DV</span><span>Docker Volume Backup</span></div>
        <div class="section-label">Operacion</div>
        <nav class="section">
          ${items.map(item => `
            <a class="item ${state.currentView === item.id ? "active" : ""}" href="#/${item.id}" data-view="${item.id}">
              ${ICONS[item.icon] || ""}<span>${escapeHtml(item.label)}</span>
            </a>
          `).join("")}
        </nav>
        <div class="footer">
          <div class="section-label">Sesion</div>
          <nav class="section">
            <a class="item" href="#" id="logoutBtn">${ICONS.logout}<span>Cerrar sesion</span></a>
          </nav>
        </div>
      `;
      sidebar.querySelector("#logoutBtn").addEventListener("click", async (e) => {
        e.preventDefault();
        try { await fetch("/api/v1/auth/logout", { method: "POST" }); } catch (err) {}
        window.location.href = "/login";
      });
    }

    function renderTopbar() {
      const topbar = document.getElementById("topbar");
      const titles = {
        dashboard: "Dashboard", workers: "Workers", targets: "Targets", jobs: "Jobs",
        storage: "Storage Profiles", retention: "Retention Policies", secrets: "Secretos", users: "Usuarios", settings: "Settings",
      };
      topbar.innerHTML = `
        <div class="page-title">${escapeHtml(titles[state.currentView] || "")}</div>
        <div class="spacer"></div>
        <div class="user-chip">
          <span class="name">${escapeHtml(state.currentUser || "")}</span>
          <span class="pill muted">${escapeHtml(state.currentRole || "")}</span>
        </div>
      `;
    }

    function setView(view) {
      state.currentView = view;
      renderSidebar();
      renderTopbar();
      const content = document.getElementById("content");
      content.innerHTML = "";
      const viewRenderers = {
        dashboard: renderDashboard, workers: renderWorkers, targets: renderTargets, jobs: renderJobs,
        storage: renderStorage, retention: renderRetention, secrets: renderSecrets, users: renderUsers, settings: renderSettings,
      };
      const renderer = viewRenderers[view];
      if (renderer) renderer(content);
    }

    function route() {
      const hash = window.location.hash.replace(/^#\/?/, "") || "dashboard";
      const view = NAV_ITEMS.some(i => i.id === hash) ? hash : "dashboard";
      setView(view);
    }
    window.addEventListener("hashchange", route);

    function statCard(eyebrow, title, value, meta) {
      return `<article class="card compact"><span class="eyebrow">${escapeHtml(eyebrow)}</span><div class="title">${escapeHtml(title)}</div><div class="value">${escapeHtml(String(value))}</div><div class="meta">${escapeHtml(meta || "")}</div></article>`;
    }

    function renderDashboard(content) {
      const onlineWorkers = state.workers.filter(w => w.status === "online").length;
      content.innerHTML = `
        <div class="page-header"><div><h2>Resumen</h2><div class="subtitle">Estado general del Control Plane</div></div></div>
        <div class="stat-grid">
          ${statCard("Workers", "Online", onlineWorkers, `${state.workers.length} total`)}
          ${statCard("Targets", "Configurados", state.targets.length, "targets de backup")}
          ${statCard("Jobs", "Total", state.jobs.length, "historico de jobs")}
          ${statCard("Storage", "Profiles", state.storageProfiles.length, "profiles configurados")}
        </div>
        <div class="page-header"><div><h2>Workers recientes</h2><div class="subtitle">Estado de los agentes registrados</div></div></div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>Nombre</th><th>Host</th><th>Status</th><th>Version</th><th>Ult. seen</th></tr></thead>
          <tbody>${state.workers.length ? state.workers.slice(0, 5).map(w => `<tr><td>${escapeHtml(w.name)}</td><td class="mono">${escapeHtml(w.host_name || "—")}</td><td>${fmtStatus(w.status)}</td><td class="mono">${escapeHtml(w.version || "—")}</td><td class="mono">${fmtDate(w.last_seen_at)}</td></tr>`).join("") : `<tr><td colspan="5" class="empty-state">Sin workers registrados</td></tr>`}</tbody>
        </table></div></div>
        <div class="page-header"><div><h2>Jobs recientes</h2><div class="subtitle">Ultimos jobs ejecutados</div></div></div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>ID</th><th>Target</th><th>Status</th><th>Inicio</th><th>Fin</th></tr></thead>
          <tbody>${state.jobs.length ? state.jobs.slice(0, 5).map(j => `<tr><td class="mono">${escapeHtml(String(j.id).slice(0,8))}</td><td>${escapeHtml(j.target_id || "—")}</td><td>${fmtStatus(j.status)}</td><td class="mono">${fmtDate(j.started_at)}</td><td class="mono">${fmtDate(j.finished_at)}</td></tr>`).join("") : `<tr><td colspan="5" class="empty-state">Sin jobs ejecutados</td></tr>`}</tbody>
        </table></div></div>
      `;
    }

    function renderWorkers(content) {
      const canEnroll = state.currentRole === "admin";
      content.innerHTML = `
        <div class="page-header">
          <div><h2>Workers</h2><div class="subtitle">Agentes registrados en el Control Plane</div></div>
          ${canEnroll ? `<button class="btn primary sm" id="addWorkerBtn">+ Agregar worker</button>` : ""}
        </div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>Nombre</th><th>Host</th><th>Status</th><th>Version</th><th>Labels</th><th>Ult. seen</th></tr></thead>
          <tbody>${state.workers.length ? state.workers.map(w => `<tr><td>${escapeHtml(w.name)}</td><td class="mono">${escapeHtml(w.host_name || "—")}</td><td>${fmtStatus(w.status)}</td><td class="mono">${escapeHtml(w.version || "—")}</td><td class="mono">${escapeHtml(w.labels ? JSON.stringify(w.labels) : "—")}</td><td class="mono">${fmtDate(w.last_seen_at)}</td></tr>`).join("") : `<tr><td colspan="6" class="empty-state">Sin workers registrados</td></tr>`}</tbody>
        </table></div></div>
      `;
      const addBtn = document.getElementById("addWorkerBtn");
      if (addBtn) addBtn.addEventListener("click", openAddWorkerModal);
    }

    let addWorkerState = { step: "form", enrollment: null, activeTab: "compose" };

    async function openAddWorkerModal() {
      addWorkerState = { step: "form", enrollment: null, activeTab: "compose" };
      renderAddWorkerModal();
      const overlay = document.getElementById("modalOverlay");
      if (overlay) overlay.classList.add("open");
    }

    function closeAddWorkerModal() {
      const overlay = document.getElementById("modalOverlay");
      if (overlay) overlay.classList.remove("open");
    }

    function renderAddWorkerModal() {
      const overlay = document.getElementById("modalOverlay");
      if (!overlay) return;
      if (addWorkerState.step === "form") {
        overlay.innerHTML = `
          <div class="modal">
            <div class="modal-header"><h3>Agregar worker</h3><button class="close" id="modalClose">&times;</button></div>
            <div class="modal-body">
              <div class="helper">Genera un token de enrolamiento para registrar un nuevo worker. El token se usa una sola vez y expira automaticamente.</div>
              <div class="field-row">
                <div class="field"><label for="awName">Nombre del worker</label><input id="awName" placeholder="worker-prod-01" value="worker" /></div>
                <div class="field"><label for="awHost">Host</label><input id="awHost" placeholder="srv-prod-01" value="unknown-host" /></div>
                <div class="field"><label for="awTtl">TTL (minutos)</label><input id="awTtl" type="number" value="60" /></div>
              </div>
              <div class="btn-row">
                <button class="btn primary sm" id="awGenerate">Generar token</button>
                <button class="btn ghost sm" id="awCancel">Cancelar</button>
              </div>
              <div class="alert" id="awError"></div>
            </div>
          </div>
        `;
        document.getElementById("modalClose").addEventListener("click", closeAddWorkerModal);
        document.getElementById("awCancel").addEventListener("click", closeAddWorkerModal);
        overlay.addEventListener("click", (e) => { if (e.target === overlay) closeAddWorkerModal(); });
        document.getElementById("awGenerate").addEventListener("click", generateEnrollment);
      } else if (addWorkerState.step === "commands") {
        renderAddWorkerCommands();
      }
    }

    async function generateEnrollment() {
      const errorBox = document.getElementById("awError");
      errorBox.textContent = "";
      const name = document.getElementById("awName").value.trim() || "worker";
      const host_name = document.getElementById("awHost").value.trim() || "unknown-host";
      const ttl_minutes = parseInt(document.getElementById("awTtl").value) || 60;
      try {
        const enrollment = await apiPost("/api/v1/admin/worker-enrollments", { name, host_name, ttl_minutes });
        addWorkerState.enrollment = enrollment;
        addWorkerState.tlsEnabled = true;
        addWorkerState.step = "commands";
        renderAddWorkerModal();
      } catch (error) {
        if (error.message.includes("TLS manager")) {
          addWorkerState.enrollment = { name, host_name, worker_id: "—", token: null, expires_at: null, ca_certificate_pem: null };
          addWorkerState.tlsEnabled = false;
          addWorkerState.step = "commands";
          renderAddWorkerModal();
        } else {
          errorBox.textContent = `Error generando token: ${error.message}`;
        }
      }
    }

    function renderAddWorkerCommands() {
      const overlay = document.getElementById("modalOverlay");
      if (!overlay) return;
      const e = addWorkerState.enrollment;
      if (!e) return;
      const tlsEnabled = addWorkerState.tlsEnabled !== false;
      const cpHost = window.location.hostname || "localhost";
      const cpPort = window.location.port || "8080";
      const cpUrl = `http://${cpHost}:${cpPort}`;
      const token = e.token || "";
      const workerId = e.worker_id || "";
      const caPem = (e.ca_certificate_pem || "").replace(/\n/g, "\\n");
      const wName = e.name || "worker";
      const wHost = e.host_name || "unknown-host";

      const enrollEnv = tlsEnabled ? `
      WORKER_ENROLLMENT_TOKEN: ${token}
      WORKER_ENROLLMENT_CA_PEM: "${caPem}"
      WORKER_TLS_DIR: /data/tls
      WORKER_TLS_CA_FILE: /data/tls/ca.pem
      WORKER_TLS_CERT_FILE: /data/tls/cert.pem
      WORKER_TLS_KEY_FILE: /data/tls/key.pem` : "";

      const enrollRunEnv = tlsEnabled ? ` \\
  -e WORKER_ENROLLMENT_TOKEN="${token}" \\
  -e WORKER_ENROLLMENT_CA_PEM="${caPem}" \\
  -e WORKER_TLS_DIR="/data/tls" \\
  -e WORKER_TLS_CA_FILE="/data/tls/ca.pem" \\
  -e WORKER_TLS_CERT_FILE="/data/tls/cert.pem" \\
  -e WORKER_TLS_KEY_FILE="/data/tls/key.pem"` : "";

      const enrollVol = tlsEnabled ? `
      - worker_tls:/data/tls` : "";
      const enrollVolRun = tlsEnabled ? ` -v ${wName}-tls:/data/tls` : "";
      const enrollVolName = tlsEnabled ? `
volumes:
  worker_tls:` : "";

      const composeYml = `services:
  worker:
    image: ghcr.io/danielrondongarcia/docker-volume-backup-worker:latest
    restart: unless-stopped
    environment:
      CONTROL_PLANE_URL: ${cpUrl}
      WORKER_NAME: ${wName}
      WORKER_HOST_NAME: ${wHost}
      WORKER_VERSION: ghcr
      WORKER_RUN_ONCE: "false"
      WORKER_POLL_INTERVAL_SECONDS: "15"
      WORKER_HEALTH_PORT: "8081"${enrollEnv}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock${enrollVol}
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5${enrollVolName}`;

      const dockerRun = `docker run -d --name ${wName} \\
  --restart unless-stopped \\
  -v /var/run/docker.sock:/var/run/docker.sock${enrollVolRun} \\
  -e CONTROL_PLANE_URL="${cpUrl}" \\
  -e WORKER_NAME="${wName}" \\
  -e WORKER_HOST_NAME="${wHost}" \\
  -e WORKER_VERSION="ghcr" \\
  -e WORKER_RUN_ONCE="false" \\
  -e WORKER_POLL_INTERVAL_SECONDS="15" \\
  -e WORKER_HEALTH_PORT="8081"${enrollRunEnv} \\
  ghcr.io/danielrondongarcia/docker-volume-backup-worker:latest`;

      const composeCmd = `# Guarda este archivo como docker-compose.yml y ejecuta:
docker compose up -d

# El worker se auto-enrolara con el token embebido.`;

      const tlsNote = tlsEnabled
        ? `<div class="card compact"><div class="eyebrow">Worker ID</div><div class="value" style="font-size:13px;font-family:var(--font-mono);word-break:break-all">${escapeHtml(workerId)}</div><div class="meta">Token expira: ${escapeHtml(fmtDate(e.expires_at))}</div></div>`
        : `<div class="card compact"><div class="eyebrow">Modo</div><div class="title">Sin TLS</div><div class="support">El Control Plane no tiene TLS habilitado. El worker se registrara automaticamente al arrancar usando el flujo <strong>register</strong>. No se requiere token ni CA.</div></div>`;

      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>Comandos para desplegar el worker</h3>
            <button class="close" id="modalClose">&times;</button>
          </div>
          <div class="modal-body">
            ${tlsNote}
            <div class="tabs">
              <button class="tab ${addWorkerState.activeTab === "compose" ? "active" : ""}" data-tab="compose">docker-compose.yml</button>
              <button class="tab ${addWorkerState.activeTab === "run" ? "active" : ""}" data-tab="run">docker run</button>
              <button class="tab ${addWorkerState.activeTab === "ghcr" ? "active" : ""}" data-tab="ghcr">GHCR compose</button>
            </div>
            <div id="tabContent"></div>
            <div class="btn-row">
              <button class="btn primary sm" id="awDone">Listo</button>
              <button class="btn ghost sm" id="awBack">Volver</button>
            </div>
            <div class="helper">${tlsEnabled ? "El token se usa una sola vez al arrancar el worker. Si necesitas re-enrolar, genera uno nuevo." : "El worker se registrara automaticamente. Para produccion, habilita TLS en el Control Plane."}</div>
          </div>
        </div>
      `;
      document.getElementById("modalClose").addEventListener("click", closeAddWorkerModal);
      document.getElementById("awDone").addEventListener("click", async () => { closeAddWorkerModal(); await refreshAll(); });
      document.getElementById("awBack").addEventListener("click", () => { addWorkerState.step = "form"; renderAddWorkerModal(); });
      overlay.addEventListener("click", (e2) => { if (e2.target === overlay) closeAddWorkerModal(); });

      const tabs = overlay.querySelectorAll(".tab");
      tabs.forEach(tab => tab.addEventListener("click", () => {
        addWorkerState.activeTab = tab.dataset.tab;
        renderAddWorkerCommands();
      }));

      const tabContent = document.getElementById("tabContent");
      let code = "";
      let label = "";
      if (addWorkerState.activeTab === "compose") { code = composeYml; label = "docker-compose.yml"; }
      else if (addWorkerState.activeTab === "run") { code = dockerRun; label = "docker run"; }
      else if (addWorkerState.activeTab === "ghcr") { code = composeCmd + "\\n\\n# --- docker-compose.yml ---\\n" + composeYml; label = "GHCR"; }
      tabContent.innerHTML = `
        <div class="helper">${escapeHtml(label)}</div>
        <div class="code-block"><button class="copy-btn" data-code-id="modalCode">Copiar</button><pre id="modalCode">${escapeHtml(code)}</pre></div>
      `;
      const copyBtn = tabContent.querySelector(".copy-btn");
      if (copyBtn) {
        copyBtn.addEventListener("click", () => {
          const codeEl = document.getElementById("modalCode");
          if (!codeEl) return;
          navigator.clipboard.writeText(codeEl.textContent).then(() => {
            copyBtn.textContent = "Copiado";
            copyBtn.classList.add("copied");
            setTimeout(() => { copyBtn.textContent = "Copiar"; copyBtn.classList.remove("copied"); }, 1500);
          }).catch(() => {});
        });
      }
    }

    let targetModalState = { mode: "create", target: null, volumeProject: null, isEditing: false };

    function renderTargets(content) {
      const workerOptions = state.workers.map(w => `<option value="${escapeHtml(w.id)}">${escapeHtml(w.name)}</option>`).join("");
      const storageOptions = state.storageProfiles.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("");
      const retentionOptions = state.retentionPolicies.map(r => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.name)}</option>`).join("");
      const settings = state.settings || {};
      const hasDefaultPassword = !!(settings.restic_password_secret_id);
      const passwordSecretOptions = state.secrets.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("");
      content.innerHTML = `
        <div class="page-header"><div><h2>Targets</h2><div class="subtitle">Configura que se va a backupear por worker y compose project</div></div></div>

    function getLastJobForTarget(targetId) {
      const targetJobs = (state.jobs || []).filter(j => j.target_id === targetId
        && ["backup.run", "restore.run", "restore.dry_run", "retention.run"].includes(j.command));
      if (!targetJobs.length) return null;
      return targetJobs.sort((a, b) => (b.updated_at || "").localeCompare(a.updated_at || ""))[0];
    }

    function bindTargetActions() {
      const container = document.querySelector(".table-wrap");
      if (!container) return;
      container.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          const jobId = btn.dataset.job;
          const target = state.targets.find(t => t.id === id);
          if (!target) return;
          if (action === "run") { await runBackupNow(id); }
          else if (action === "snapshots") { openSnapshotsModal(target); }
          else if (action === "logs") { openLogPanel(jobId, id); }
          else if (action === "edit") { openEditTargetModal(target); }
          else if (action === "delete") { await deleteTarget(id); }
        });
      });
    }

    async function runBackupNow(targetId) {
      try {
        const job = await apiPost(`/api/v1/targets/${targetId}/backup`, { requested_by: "ui" });
        openLogPanel(job.id, targetId);
      } catch (error) { alert(`Error ejecutando backup: ${error.message}`); }
    }

      if (!confirm("¿Eliminar este target? Esta accion no se puede deshacer.")) return;
      try {
        await apiDelete(`/api/v1/targets/${targetId}`);
        await refreshAll();
      } catch (error) { alert(`Error eliminando target: ${error.message}`); }
    }

    let snapshotBrowserState = null;

    async function openSnapshotsModal(target) {

    async function loadSnapshotsList(target) {
      const content = document.getElementById("snapContent");
      if (!content) return;
      content.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted-foreground);">Sincronizando snapshots desde el repositorio...</div>';
      try {
        const syncResp = await apiPost(`/api/v1/targets/${target.id}/snapshots-sync`, { requested_by: "ui" });
        const jobId = syncResp.id;
        if (jobId) {
          let done = false;
          for (let i = 0; i < 30; i++) {
            await new Promise(r => setTimeout(r, 2000));
            try {
              const job = await apiGet(`/api/v1/jobs/${jobId}`);
              if (job && (job.status === "succeeded" || job.status === "failed" || job.status === "cancelled")) {
                done = true;
                break;
              }
            } catch (e) {}
          }
          if (!done) {
            content.innerHTML = `<div style="padding:20px; color:var(--warning, #f59e0b);">El sincronizado tardo demasiado. <button class="btn ghost xs" id="snapRefresh">Reintentar</button></div>`;
            const refreshBtn = document.getElementById("snapRefresh");
            if (refreshBtn) refreshBtn.addEventListener("click", () => loadSnapshotsList(target));
            return;
          }
        }
        const snaps = await apiGet(`/api/v1/targets/${target.id}/snapshots`);
        snapshotBrowserState.snapshots = snaps.items || [];
        renderSnapshotsList(content);
      } catch (error) {
        content.innerHTML = `<div style="padding:20px; color:var(--destructive);">Error cargando snapshots: ${escapeHtml(error.message)} <button class="btn ghost xs" id="snapRefresh">Reintentar</button></div>`;
        const refreshBtn = document.getElementById("snapRefresh");
        if (refreshBtn) refreshBtn.addEventListener("click", () => loadSnapshotsList(target));
      }
    }

    let snapTableState = { sortKey: "created_at", sortDir: "desc", filters: { snapshot_id: "", created_at: "", paths: "" } };

    function renderSnapshotsList(content) {
      const allSnaps = snapshotBrowserState.snapshots;
      if (!allSnaps || allSnaps.length === 0) {
        content.innerHTML = `
          <div style="text-align:center; padding:40px;">
            <div style="color:var(--muted-foreground); margin-bottom:16px;">No hay snapshots disponibles para este target.</div>
            <button class="btn ghost xs" id="snapRefresh">Refrescar</button>
          </div>`;
        const refreshBtn = document.getElementById("snapRefresh");
        if (refreshBtn) refreshBtn.addEventListener("click", () => loadSnapshotsList(snapshotBrowserState.target));
        return;
      }

      const renderTable = () => {
        let snaps = allSnaps.slice();
        snaps = snaps.filter(s => {
          const id = (s.snapshot_id || "").toLowerCase();
          const date = s.created_at ? new Date(s.created_at).toLocaleString().toLowerCase() : "";
          const paths = (s.paths || []).join(", ").toLowerCase();
          if (snapTableState.filters.snapshot_id && !id.includes(snapTableState.filters.snapshot_id.toLowerCase())) return false;
          if (snapTableState.filters.created_at && !date.includes(snapTableState.filters.created_at.toLowerCase())) return false;
          if (snapTableState.filters.paths && !paths.includes(snapTableState.filters.paths.toLowerCase())) return false;
          return true;
        });
        const dir = snapTableState.sortDir === "asc" ? 1 : -1;
        snaps.sort((a, b) => {
          let va, vb;
          if (snapTableState.sortKey === "created_at") {
            va = new Date(a.created_at || 0).getTime();
            vb = new Date(b.created_at || 0).getTime();
          } else if (snapTableState.sortKey === "snapshot_id") {
            va = a.snapshot_id || "";
            vb = b.snapshot_id || "";
          } else if (snapTableState.sortKey === "paths") {
            va = (a.paths || []).join(", ");
            vb = (b.paths || []).join(", ");
          }
          if (va < vb) return -1 * dir;
          if (va > vb) return 1 * dir;
          return 0;
        });

        const sortIcon = (key) => {
          if (snapTableState.sortKey !== key) return " ↕";
          return snapTableState.sortDir === "asc" ? " ↑" : " ↓";
        };
        const sortAttrs = (key) => `data-sort="${key}" style="cursor:pointer; user-select:none;"`;

        content.innerHTML = `
          <div style="margin-bottom:16px; font-size:13px; color:var(--muted-foreground);">Selecciona un snapshot para explorar su contenido (${snaps.length} de ${allSnaps.length}):</div>
          <table class="table datatable" style="font-size:14px;">
            <thead>
              <tr>
                <th ${sortAttrs("snapshot_id")}>ID${sortIcon("snapshot_id")}</th>
                <th ${sortAttrs("created_at")}>Fecha${sortIcon("created_at")}</th>
                <th ${sortAttrs("paths")}>Paths${sortIcon("paths")}</th>
                <th style="width:120px;">Acciones</th>
              </tr>
              <tr class="filter-row">
                <th><input type="text" class="dt-filter" data-col="snapshot_id" placeholder="Filtrar ID..." value="${escapeHtml(snapTableState.filters.snapshot_id)}" /></th>
                <th><input type="text" class="dt-filter" data-col="created_at" placeholder="Filtrar fecha..." value="${escapeHtml(snapTableState.filters.created_at)}" /></th>
                <th><input type="text" class="dt-filter" data-col="paths" placeholder="Filtrar paths..." value="${escapeHtml(snapTableState.filters.paths)}" /></th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${snaps.length === 0 ? `<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--muted-foreground);">Sin resultados para los filtros aplicados.</td></tr>` : snaps.map(s => `
                <tr>
                  <td class="mono">${escapeHtml(s.snapshot_id || "—")}</td>
                  <td>${escapeHtml(s.created_at ? new Date(s.created_at).toLocaleString() : "—")}</td>
                  <td class="mono" style="font-size:12px; max-width:400px; overflow:hidden; text-overflow:ellipsis;">${escapeHtml((s.paths || []).join(", ") || "—")}</td>
                  <td><button class="btn primary xs" data-snap="${escapeHtml(s.snapshot_id)}">Explorar</button></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;

        content.querySelectorAll("[data-sort]").forEach(th => {
          th.addEventListener("click", () => {
            const key = th.dataset.sort;
            if (snapTableState.sortKey === key) {
              snapTableState.sortDir = snapTableState.sortDir === "asc" ? "desc" : "asc";
            } else {
              snapTableState.sortKey = key;
              snapTableState.sortDir = "desc";
            }
            renderTable();
          });
        });
        content.querySelectorAll(".dt-filter").forEach(input => {
          input.addEventListener("input", () => {
            snapTableState.filters[input.dataset.col] = input.value;
            renderTable();
          });
        });
        content.querySelectorAll("[data-snap]").forEach(btn => {
          btn.addEventListener("click", () => browseSnapshot(btn.dataset.snap, ""));
        });
      };

      renderTable();
    }

    async function browseSnapshot(snapshotId, path) {
      const content = document.getElementById("snapContent");
      if (!content) return;
      snapshotBrowserState.currentSnapshot = snapshotId;
      snapshotBrowserState.currentPath = path;
      content.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted-foreground);">Listando contenido de ${escapeHtml(path || "/")}...</div>`;
      try {
        const result = await apiPost(`/api/v1/targets/${snapshotBrowserState.target.id}/snapshot-ls`, {
          snapshot_id: snapshotId,
          path: path,
        });
        snapshotBrowserState.entries = result.entries || [];
        renderSnapshotBrowser(content, snapshotId, path, result.entries || []);
      } catch (error) {
        content.innerHTML = `<div style="padding:20px; color:var(--destructive);">Error listando contenido: ${escapeHtml(error.message)}</div>`;
      }
    }

    function renderSnapshotBrowser(content, snapshotId, path, entries) {
      const fileEntries = entries.filter(e => e && (e.struct_type === "node" || e.type === "file" || e.type === "dir"));
      const dirs = [];
      const files = [];
      for (const e of fileEntries) {
        const isDir = e.type === "dir";
        const item = { path: e.path || "", name: (e.path || "").split("/").pop() || e.path, isDir };
        if (isDir) dirs.push(item); else files.push(item);
      }
      const pathPrefix = path ? `/${path}` : "";
      const visibleDirs = dirs.filter(d => {
        const p = (d.path || "").replace(/^\//, "");
        if (!path) return p.split("/").filter(Boolean).length === 1;
        return p.startsWith(path + "/") && p.split("/").filter(Boolean).length === path.split("/").filter(Boolean).length + 1;
      });
      const visibleFiles = files.filter(f => {
        const p = (f.path || "").replace(/^\//, "");
        if (!path) return p.split("/").filter(Boolean).length === 1;
        return p.startsWith(path + "/") && p.split("/").filter(Boolean).length === path.split("/").filter(Boolean).length + 1;
      });
      visibleDirs.sort((a, b) => a.name.localeCompare(b.name));
      visibleFiles.sort((a, b) => a.name.localeCompare(b.name));
      const pathParts = path ? path.split("/").filter(Boolean) : [];
      const breadcrumbs = ['<a href="#" data-path="" style="color:var(--primary);">raiz</a>'];
      let acc = "";
      for (const p of pathParts) {
        acc = acc ? `${acc}/${p}` : p;
        breadcrumbs.push(`<span style="color:var(--muted-foreground);">/</span><a href="#" data-path="${escapeHtml(acc)}" style="color:var(--primary);">${escapeHtml(p)}</a>`);
      }
      content.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <div>
            <button class="btn ghost xs" id="snapBackToList">← Lista de snapshots</button>
          </div>
          <div style="font-size:12px; color:var(--muted-foreground);">Snapshot: <code>${escapeHtml(snapshotId)}</code></div>
        </div>
        <div style="margin-bottom:20px; padding:10px 14px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); font-size:14px;">
          ${breadcrumbs.join(" ")}
        </div>
        ${(visibleDirs.length === 0 && visibleFiles.length === 0) ? '<div style="padding:40px; text-align:center; color:var(--muted-foreground);">Carpeta vacia o no se pudo listar.</div>' : `
        <table class="table" style="font-size:14px;">
          <thead><tr><th style="width:36px;"></th><th>Nombre</th><th>Tipo</th><th style="width:120px;">Acciones</th></tr></thead>
          <tbody>
            ${visibleDirs.map(d => {
              const relPath = d.path.replace(/^\//, "");
              return `<tr>
                <td>📁</td>
                <td class="mono"><a href="#" data-dir="${escapeHtml(relPath)}" style="color:var(--primary);">${escapeHtml(d.name)}/</a></td>
                <td>directorio</td>
                <td><button class="btn ghost xs" data-dir-btn="${escapeHtml(relPath)}">Abrir</button></td>
              </tr>`;
            }).join("")}
            ${visibleFiles.map(f => {
              const relPath = f.path.replace(/^\//, "");
              return `<tr>
                <td>📄</td>
                <td class="mono">${escapeHtml(f.name)}</td>
                <td>archivo</td>
                <td><button class="btn primary xs" data-download="${escapeHtml(relPath)}">Descargar</button></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>`}
      `;
      const backBtn = document.getElementById("snapBackToList");
      if (backBtn) backBtn.addEventListener("click", () => renderSnapshotsList(content));
      content.querySelectorAll("[data-dir]").forEach(a => {
        a.addEventListener("click", (e) => { e.preventDefault(); browseSnapshot(snapshotId, a.dataset.dir); });
      });
      content.querySelectorAll("[data-dir-btn]").forEach(btn => {
        btn.addEventListener("click", () => browseSnapshot(snapshotId, btn.dataset.dirBtn));
      });
      content.querySelectorAll("[data-download]").forEach(btn => {
        btn.addEventListener("click", () => downloadSnapshotFile(snapshotId, btn.dataset.download));
      });
    }

    async function downloadSnapshotFile(snapshotId, filePath) {
      const fileName = filePath.split("/").pop() || "download";
      try {
        const btn = document.querySelector(`[data-download="${filePath.replace(/"/g, '&quot;')}"]`);
        if (btn) { btn.disabled = true; btn.textContent = "Descargando..."; }
        const result = await apiPost(`/api/v1/targets/${snapshotBrowserState.target.id}/snapshot-dump`, {
          snapshot_id: snapshotId,
          path: filePath,
        });
        if (btn) { btn.disabled = false; btn.textContent = "Descargar"; }
        if (!result.success || !result.b64_content) {
          const errMsg = result.error || "No se pudo obtener el contenido del archivo.";
          alert(`Error descargando ${fileName}:\n${errMsg.substring(0, 500)}`);
          return;
        }
        const binary = atob(result.b64_content);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const blob = new Blob([bytes], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (error) {
        const btn = document.querySelector(`[data-download="${filePath.replace(/"/g, '&quot;')}"]`);
        if (btn) { btn.disabled = false; btn.textContent = "Descargar"; }
        alert(`Error descargando ${fileName}: ${error.message}`);
      }
    }

      overlay.innerHTML = `

    function renderJobLogs(job) {
      const statusEl = document.getElementById("jobStatusBar");
      if (statusEl) {
        statusEl.innerHTML = `<span class="job-status-pill ${job.status}">${job.status}</span><span class="job-meta">Job: ${escapeHtml(job.id)}</span>`;
      }
      const container = document.getElementById("logContainer");
      if (!container) return;
      const lines = job.log_lines || [];
      if (!lines.length) { container.innerHTML = `<div class="log-line info">Esperando logs del worker...</div>`; return; }
      container.innerHTML = lines.map(line => {
        const lower = line.toLowerCase();
        let cls = "info";
        if (lower.includes("error") || lower.includes("err:") || lower.includes("failed") || lower.includes("traceback") || lower.includes("exception")) cls = "error";
        else if (lower.includes("warn") || lower.includes("warning")) cls = "warning";
        else if (lower.includes("info") || lower.includes("status") || lower.includes("starting") || lower.includes("success") || lower.includes("snapshot") || lower.includes("backup")) cls = "info";
        return `<div class="log-line ${cls}">${escapeHtml(line)}</div>`;
      }).join("");
      container.scrollTop = container.scrollHeight;
    }

    function pollJobLogs(jobId) {
      if (jobPollTimer) clearInterval(jobPollTimer);
      const fetchJob = async () => {
        try {
          const job = await apiGet(`/api/v1/jobs/${jobId}`);
          renderJobLogs(job);
          if (job.status === "succeeded" || job.status === "failed" || job.status === "canceled") {
            if (jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
            await refreshAll();
          }
        } catch (error) { }
      };
      fetchJob();
      jobPollTimer = setInterval(fetchJob, 2000);
    }

    let volumeSelectionState = { stacks: {}, expanded: {} };

    function renderVolumeCheckboxes(project) {
      const container = document.getElementById("targetVolumeList");
      if (!container) return;
      if (!project) {
        container.innerHTML = `<div class="helper">Selecciona un compose project para ver los volumenes disponibles.</div>`;
        return;
      }
      const volumes = project.volume_targets || [];
      const runtimeVols = project.runtime_volumes || {};
      if (!volumes.length) {
        container.innerHTML = `<div class="helper">Este proyecto no tiene volumenes de datos detectados.</div>`;
        return;
      }
      const stackKey = project.name;
      if (!volumeSelectionState.stacks[stackKey]) {
        volumeSelectionState.stacks[stackKey] = {};
        volumes.forEach(v => { volumeSelectionState.stacks[stackKey][v] = true; });
      }
      if (volumeSelectionState.expanded[stackKey] === undefined) {
        volumeSelectionState.expanded[stackKey] = true;
      }
      const isExpanded = volumeSelectionState.expanded[stackKey];
      const selectedCount = Object.values(volumeSelectionState.stacks[stackKey]).filter(Boolean).length;
      const totalCount = volumes.length;
      const allSelected = selectedCount === totalCount;
      container.innerHTML = `
        <div class="volume-group" data-stack="${escapeHtml(stackKey)}">
          <div class="volume-group-header" data-stack-toggle="${escapeHtml(stackKey)}">
            <div>
              <div class="stack-name">${escapeHtml(stackKey)}</div>
              <div class="stack-meta">${selectedCount}/${totalCount} volumenes seleccionados</div>
            </div>
            <div class="stack-toggle">${isExpanded ? "▾" : "▸"}</div>
          </div>
          <div class="volume-group-body" style="${isExpanded ? "" : "display:none"}">
            ${volumes.map(v => {
              const volName = Object.keys(runtimeVols).find(k => runtimeVols[k].bind === v) || "";
              const isSelected = volumeSelectionState.stacks[stackKey][v];
              return `<div class="volume-card ${isSelected ? "selected" : ""}" data-volume="${escapeHtml(v)}" data-stack="${escapeHtml(stackKey)}">
                <div class="vol-icon">📦</div>
                <div class="vol-info">
                  <div class="vol-path">${escapeHtml(v)}</div>
                  ${volName ? `<div class="vol-name">${escapeHtml(volName)}</div>` : ""}
                </div>
                <div class="vol-check"></div>
              </div>`;
            }).join("")}
          </div>
        </div>
      `;
      const group = container.querySelector(".volume-group");
      if (group) {
        const header = group.querySelector(".volume-group-header");
        if (header) {
          header.addEventListener("click", () => {
            volumeSelectionState.expanded[stackKey] = !volumeSelectionState.expanded[stackKey];
            renderVolumeCheckboxes(project);
          });
        }
        group.querySelectorAll(".volume-card").forEach(card => {
          card.addEventListener("click", () => {
            const vol = card.dataset.volume;
            volumeSelectionState.stacks[stackKey][vol] = !volumeSelectionState.stacks[stackKey][vol];
            renderVolumeCheckboxes(project);
          });
        });
      }
    }

    function getSelectedVolumes() {
      const container = document.getElementById("targetVolumeList");
      if (!container) return [];
      const stackKey = container.querySelector(".volume-group")?.dataset.stack;
      if (!stackKey || !volumeSelectionState.stacks[stackKey]) return [];
      return Object.entries(volumeSelectionState.stacks[stackKey])
        .filter(([_, selected]) => selected)
        .map(([vol]) => vol);
    }

    function bindTargetForm() {
      const form = document.getElementById("createTargetForm");
      if (!form) return;
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const selectedVols = getSelectedVolumes();
          const backupStrategy = document.getElementById("targetBackupStrategy").value;
          const resticPasswordSecret = emptyToNull(document.getElementById("targetResticPasswordSecret")?.value || "");
          const hasDefault = !!(state.settings && state.settings.restic_password_secret_id);
          if (backupStrategy === "restic" && !hasDefault && !resticPasswordSecret) {
            alert("Debes seleccionar un secret de password restic, o configurar un default en Settings.");
            return;
          }
          await apiPost("/api/v1/targets", {
            name: document.getElementById("targetName").value.trim(),
            worker_id: document.getElementById("targetWorkerId").value,
            compose_project: emptyToNull(document.getElementById("targetComposeProject").value),
            volume_targets: selectedVols.length ? selectedVols : null,
            backup_mode: document.getElementById("targetBackupMode").value,
            backup_strategy: backupStrategy,
            runtime_command: emptyToNull(document.getElementById("targetRuntimeCommand").value),
            runtime_environment: parseJsonField("targetRuntimeEnvironment", "runtime environment del target"),
            storage_profile_id: emptyToNull(document.getElementById("targetStorageProfileId").value),
            retention_policy_id: emptyToNull(document.getElementById("targetRetentionPolicyId").value),
            restic_password_secret_id: resticPasswordSecret,
            restore_defaults: parseJsonField("targetRestoreDefaults", "restore defaults del target"),
          });
          await refreshAll();
        } catch (error) { alert(`Error creando target: ${error.message}`); }
      });
      const workerSelect = document.getElementById("targetWorkerId");
      const projectSelect = document.getElementById("targetComposeProject");
      const summary = document.getElementById("targetProjectSummary");
      async function refreshProjects() {
        const workerId = workerSelect.value;
        projectSelect.innerHTML = `<option value="">-- Seleccionar compose project --</option>`;
        renderVolumeCheckboxes(null);
        if (!workerId) { summary.textContent = "Selecciona un worker para ver sus compose projects y volumenes detectados."; return; }
        const snapshot = await fetchWorkerInventory(workerId);
        if (!snapshot || !snapshot.inventory) { summary.textContent = "Sin inventario reportado por el worker todavia."; return; }
        if (!snapshot.inventory.docker_available) { summary.textContent = "El worker reporta que no tiene acceso al daemon de Docker."; return; }
        const projects = snapshot.inventory.compose_project_details || [];
        if (!projects.length) { summary.textContent = "Docker disponible, pero no se detectaron compose projects en este worker."; return; }
        projectSelect.innerHTML = projects.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join("");
        projectSelect.value = projects[0].name;
        renderProjectSummary(projects[0]);
        renderVolumeCheckboxes(projects[0]);
      }
      function renderProjectSummary(project) {
        if (!project) { summary.textContent = "Selecciona un compose project."; return; }
        const vols = (project.volume_targets || []).join(", ") || "sin volumenes";
        const containers = (project.containers || []).map(c => escapeHtml(c.name)).join(", ") || "sin contenedores";
        summary.innerHTML = `Proyecto <strong>${escapeHtml(project.name)}</strong> | Volumenes: ${escapeHtml(vols)} | Contenedores: ${containers}`;
      }
      workerSelect.addEventListener("change", refreshProjects);
      projectSelect.addEventListener("change", () => {
        const projects = getWorkerComposeProjects(workerSelect.value);
        const selected = projects.find(p => p.name === projectSelect.value);
        renderProjectSummary(selected);
        renderVolumeCheckboxes(selected);
      });
      refreshProjects();
    }

            const uiType = document.getElementById("secType").value;
            const backendType = uiType === "rclone" ? "file" : uiType;
            await apiPost("/api/v1/secrets", {
              name: document.getElementById("secName").value.trim(),
              secret_type: backendType,
              plaintext: document.getElementById("secPlaintext").value,
            });
            await refreshAll();
          } catch (error) { alert(`Error creando secreto: ${error.message}`); }
        });
      }
    }

    function renderUsers(content) {
      const canManage = state.currentRole === "admin";
      content.innerHTML = `
        <div class="page-header"><div><h2>Usuarios</h2><div class="subtitle">Usuarios locales del Control Plane</div></div></div>
        ${canManage ? `<details class="form-section"><summary>Crear usuario</summary><div class="form-body">
          <form id="createUserForm">
            <div class="form-grid">
              <div class="field"><label for="usrName">Usuario</label><input id="usrName" required /></div>
              <div class="field"><label for="usrPassword">Contrasenia</label><input id="usrPassword" type="password" required /></div>
              <div class="field"><label for="usrRole">Rol</label><select id="usrRole"><option value="viewer">viewer</option><option value="operator">operator</option><option value="admin">admin</option></select></div>
            </div>
            <div class="btn-row"><button type="submit" class="btn primary sm">Crear usuario</button></div>
          </form>
        </div></details>` : ""}
        <div class="page-header"><div><h2>Usuarios configurados</h2></div></div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>Usuario</th><th>Rol</th><th>Cambio obligatorio</th><th>Creado</th></tr></thead>
          <tbody>${state.localUsers.length ? state.localUsers.map(u => `<tr><td>${escapeHtml(u.username)}</td><td><span class="pill muted">${escapeHtml(u.role)}</span></td><td>${u.must_change_password ? '<span class="pill warn">si</span>' : '<span class="pill ok">no</span>'}</td><td class="mono">${fmtDate(u.created_at)}</td></tr>`).join("") : `<tr><td colspan="4" class="empty-state">Sin usuarios</td></tr>`}</tbody>
        </table></div></div>
      `;
      const form = document.getElementById("createUserForm");
      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            await apiPost("/api/v1/admin/users", {
              username: document.getElementById("usrName").value.trim(),
              password: document.getElementById("usrPassword").value,
              role: document.getElementById("usrRole").value,
            });
            await refreshAll();
          } catch (error) { alert(`Error creando usuario: ${error.message}`); }
        });
      }
    }

    function renderSettings(content) {
      const settings = state.settings || {};
      const hasDefaultPassword = !!(settings.restic_password_secret_id);
      const hasRcloneConf = !!(settings.rclone_conf_secret_id);
      const passwordSecretOptions = state.secrets.map(s => `<option value="${escapeHtml(s.id)}" ${s.id === settings.restic_password_secret_id ? "selected" : ""}>${escapeHtml(s.name)}</option>`).join("");
      const rcloneSecretOptions = state.secrets.filter(s => s.secret_type === "file").map(s => `<option value="${escapeHtml(s.id)}" ${s.id === settings.rclone_conf_secret_id ? "selected" : ""}>${escapeHtml(s.name)}</option>`).join("");
      content.innerHTML = `
        <div class="page-header"><div><h2>Settings</h2><div class="subtitle">Configuracion global del Control Plane para backups restic</div></div></div>
        <div class="sheet" style="max-width:680px; padding: 24px;">
          <form id="settingsForm">
            <div style="margin-bottom: 20px;">
              <h3 style="margin:0 0 4px; font-size:15px; font-weight:700;">Repositorio restic</h3>
              <div class="helper" style="margin-bottom:16px;">Define la ruta base del repositorio. Para cada target se usara <code>{base}/{target_name}</code>. Si el target tiene su propio <code>RESTIC_REPOSITORY</code>, ese tiene prioridad.</div>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label for="settingsRepoBase">Ruta base del repositorio restic</label>
                <input id="settingsRepoBase" value="${escapeHtml(settings.restic_repository_base || "")}" placeholder="rclone:daniel.actsis:backup" />
                <div class="helper">Para cada target se usara <code>{base}/{target_name}</code> como repositorio.</div>
                <div id="repoPreview" style="margin-top:8px; padding:8px 10px; border-radius:var(--radius); background:var(--card); border:1px solid var(--border); font-size:12px;"></div>
                <div id="repoWarning" style="margin-top:6px;"></div>
              </div>
            </div>
            <div style="height:1px; background:var(--border); margin:24px 0;"></div>
            <div style="margin-bottom: 20px;">
              <h3 style="margin:0 0 4px; font-size:15px; font-weight:700;">rclone.conf global (opcional)</h3>
              <div class="helper" style="margin-bottom:16px;">Si el <code>RESTIC_REPOSITORY</code> usa <code>rclone:</code> como backend, monta este <code>rclone.conf</code> en el contenedor de backup. Solo se aplica si el storage profile del target no monta el suyo propio.</div>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label for="settingsRcloneSecret">rclone.conf (secret tipo rclone)</label>
                <select id="settingsRcloneSecret"><option value="">-- Sin rclone.conf --</option>${rcloneSecretOptions}</select>
                <div class="helper">${hasRcloneConf ? '<span class="pill ok" style="font-size:10px;">rclone.conf activo</span> Se montara en el contenedor y se usara automaticamente.' : '<span class="pill muted" style="font-size:10px;">Sin rclone.conf</span> Solo necesario si usas <code>rclone:</code> en el repositorio.'}</div>
              </div>
            </div>
            <div style="height:1px; background:var(--border); margin:24px 0;"></div>
            <div style="margin-bottom: 20px;">
              <h3 style="margin:0 0 4px; font-size:15px; font-weight:700;">Password por defecto</h3>
              <div class="helper" style="margin-bottom:16px;">Si se configura, los targets no necesitan especificar password (queda en opciones avanzadas). Si no se configura, cada target debe elegir su propio secret de password.</div>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label for="settingsPasswordSecret">Password restic por defecto (secret)</label>
                <select id="settingsPasswordSecret"><option value="">-- Sin default --</option>${passwordSecretOptions}</select>
                <div class="helper">${hasDefaultPassword ? '<span class="pill ok" style="font-size:10px;">Default activo</span> Los targets usaran este password por defecto.' : '<span class="pill muted" style="font-size:10px;">Sin default</span> Cada target debe especificar su propio password.'}</div>
              </div>
            </div>
            <div class="btn-row" style="margin-top:24px; justify-content:flex-end;">
              <button type="submit" class="btn primary">Guardar configuracion</button>
            </div>
            <div id="settingsFeedback" style="margin-top:16px;"></div>
          </form>
        </div>
      `;
      const feedbackEl = () => document.getElementById("settingsFeedback");
      const showFeedback = (msg, type) => {
        const el = feedbackEl();
        if (!el) return;
        const color = type === "error" ? "var(--destructive)" : type === "success" ? "var(--success)" : "var(--muted-foreground)";
        el.innerHTML = `<div style="padding:10px 12px; border-radius:var(--radius); background:color-mix(in srgb, ${color} 10%, var(--background)); border:1px solid color-mix(in srgb, ${color} 30%, transparent); color:${color}; font-size:13px; font-weight:600;">${escapeHtml(msg)}</div>`;
        if (type === "success") setTimeout(() => { if (el) el.innerHTML = ""; }, 4000);
      };
      const updateRepoPreview = () => {
        const base = document.getElementById("settingsRepoBase").value.trim();
        const previewEl = document.getElementById("repoPreview");
        const warningEl = document.getElementById("repoWarning");
        if (!previewEl || !warningEl) return;
        const rcloneSecret = document.getElementById("settingsRcloneSecret").value;
        const rcloneRemote = state.rcloneRemote || "";
        if (!base) {
          let hint = 'Ejemplo: <code>backup</code>';
          if (rcloneSecret && rcloneRemote) hint = `Con rclone.conf seleccionado solo pon la ruta. Ej: <code>backup</code> → <code>rclone:${escapeHtml(rcloneRemote)}:backup/nginx</code>`;
          previewEl.innerHTML = `<span style="color:var(--muted-foreground);">${hint}</span>`;
          warningEl.innerHTML = "";
          return;
        }
        const cleanBase = base.replace(/^\/+|\/+$/g, "");
        const hasPrefix = /^[a-z]+:/i.test(base);
        const exampleTarget = "nginx";
        let exampleRepo;
        if (hasPrefix) {
          exampleRepo = `${base.replace(/\/+$/, "")}/${exampleTarget}`;
        } else if (rcloneSecret && rcloneRemote) {
          exampleRepo = `rclone:${rcloneRemote}:${cleanBase}/${exampleTarget}`;
        } else {
          exampleRepo = `${cleanBase}/${exampleTarget}`;
        }
        if (hasPrefix) {
          const isRclone = /^rclone:/i.test(base);
          previewEl.innerHTML = `<span style="color:var(--muted-foreground);">Resultado para target <code>${exampleTarget}</code>:&nbsp;</span><code style="color:var(--success); font-weight:700;">${escapeHtml(exampleRepo)}</code>`;
          if (isRclone && !rcloneSecret) {
            warningEl.innerHTML = `<div style="padding:6px 10px; border-radius:var(--radius); background:color-mix(in srgb, var(--warning, #f59e0b) 10%, var(--background)); border:1px solid color-mix(in srgb, var(--warning, #f59e0b) 30%, transparent); color:var(--warning, #f59e0b); font-size:12px; font-weight:600;">⚠ Usas rclone: pero no hay rclone.conf seleccionado. El backup fallara si no lo configuras.</div>`;
          } else {
            warningEl.innerHTML = "";
          }
        } else if (rcloneSecret && rcloneRemote) {
          previewEl.innerHTML = `<span style="color:var(--muted-foreground);">Con rclone.conf [<code>${escapeHtml(rcloneRemote)}</code>], resultado para target <code>${exampleTarget}</code>:&nbsp;</span><code style="color:var(--success); font-weight:700;">${escapeHtml(exampleRepo)}</code>`;
          warningEl.innerHTML = "";
        } else {
          previewEl.innerHTML = `<span style="color:var(--destructive); font-weight:700;">✗ ${escapeHtml(exampleRepo)}</span> <span style="color:var(--muted-foreground);">(path local: el backup se perdera al terminar el contenedor)</span>`;
          warningEl.innerHTML = `<div style="padding:6px 10px; border-radius:var(--radius); background:color-mix(in srgb, var(--destructive) 10%, var(--background)); border:1px solid color-mix(in srgb, var(--destructive) 30%, transparent); color:var(--destructive); font-size:12px; font-weight:600;">⚠ Path local sin backend. Selecciona un rclone.conf arriba para usar rclone, o usa un prefijo como rclone:, s3:, etc.</div>`;
        }
      };
      document.getElementById("settingsRepoBase").addEventListener("input", updateRepoPreview);
      document.getElementById("settingsRcloneSecret").addEventListener("change", updateRepoPreview);
      updateRepoPreview();
      document.getElementById("settingsForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const repoBase = document.getElementById("settingsRepoBase").value.trim();
        const passwordSecret = emptyToNull(document.getElementById("settingsPasswordSecret").value);
        const rcloneSecret = emptyToNull(document.getElementById("settingsRcloneSecret").value);
        if (!repoBase) {
          showFeedback("La ruta base del repositorio es obligatoria.", "error");
          document.getElementById("settingsRepoBase").focus();
          return;
        }
        if (!/^[a-z]+:/.test(repoBase) && !rcloneSecret) {
          showFeedback("La ruta base no tiene prefijo (rclone:, s3:, etc) y no hay rclone.conf seleccionado. Selecciona un rclone.conf o usa un prefijo.", "error");
          document.getElementById("settingsRepoBase").focus();
          return;
        }
        try {
          await apiPatch("/api/v1/settings", {
            restic_repository_base: repoBase,
            restic_password_secret_id: passwordSecret,
            rclone_conf_secret_id: rcloneSecret,
          });
          await refreshAll();
          showFeedback("Guardado exitosamente.", "success");
        } catch (error) {
          showFeedback(`Error guardando configuracion: ${error.message}`, "error");
        }
      });
    }

    async function refreshAll() {
      try {
        const me = await apiGet("/api/v1/auth/me");
        state.currentUser = me.username;
        state.currentRole = me.role;
        const [workers, targets, jobs, storageProfiles, retentionPolicies, secrets, users, settings] = await Promise.all([
          apiGet("/api/v1/workers"),
          apiGet("/api/v1/targets"),
          apiGet("/api/v1/jobs"),
          apiGet("/api/v1/storage-profiles"),
          apiGet("/api/v1/retention-policies"),
          apiGet("/api/v1/secrets").catch(() => ({ items: [] })),
          apiGet("/api/v1/admin/users").catch(() => ({ items: [] })),
          apiGet("/api/v1/settings").catch(() => ({})),
        ]);
        state.workers = workers.items || [];
        state.targets = targets.items || [];
        state.jobs = jobs.items || [];
        state.storageProfiles = storageProfiles.items || [];
        state.retentionPolicies = retentionPolicies.items || [];
        state.secrets = secrets.items || [];
        state.localUsers = users.items || [];
        state.settings = settings || {};
        let rcloneRemote = null;
        try {
          const rr = await apiGet("/api/v1/settings/rclone-remote");
          rcloneRemote = rr.remote_name || null;
        } catch (e) {}
        state.rcloneRemote = rcloneRemote;
        state.workerInventories = {};
        route();
      } catch (error) {
        if (error.message !== "auth") console.error(error);
      }
    }

    (async function init() {
      try {
        const me = await apiGet("/api/v1/auth/me");
        state.currentUser = me.username;
        state.currentRole = me.role;
        if (me.must_change_password) { window.location.href = "/change-password"; return; }
        await refreshAll();
      } catch (error) {
        if (error.message !== "auth") console.error(error);
      }
    })();
  </script>
</body>
</html>
