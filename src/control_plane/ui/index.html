<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docker Volume Backup | Control Plane</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/app.css" />
  <style>
    .modal-snapshots {
      width: min(1180px, 96vw);
      max-width: none;
      height: min(88vh, 820px);
      max-height: none;
      overflow: hidden;
    }
    .snapshot-explorer-shell {
      display: grid;
      grid-template-columns: minmax(230px, 290px) minmax(0, 1fr);
      min-height: 0;
      flex: 1;
    }
    .snapshot-navigation {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 16px;
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--background) 55%, var(--card));
    }
    .snapshot-target-card {
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }
    .snapshot-target-label,
    .snapshot-section-label {
      color: var(--muted-foreground);
      font: 600 10px/1.2 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .snapshot-target-name { margin-top: 6px; font-weight: 700; overflow-wrap: anywhere; }
    .snapshot-target-id { margin-top: 4px; color: var(--muted-foreground); font: 11px/1.4 var(--font-mono); overflow-wrap: anywhere; }
    .snapshot-navigation-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .snapshot-refresh-button { min-width: 94px; }
    .snapshot-refresh-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      opacity: .72;
      visibility: hidden;
      animation: snapshot-refresh-spin .7s linear infinite;
      animation-play-state: paused;
    }
    .snapshot-refresh-button[aria-busy="true"] .snapshot-refresh-spinner {
      visibility: visible;
      animation-play-state: running;
    }
    @keyframes snapshot-refresh-spin { to { transform: rotate(360deg); } }
    .snapshot-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      overflow-y: auto;
      outline: none;
    }
    .snapshot-list:focus-visible,
    .snapshot-entry-list:focus-visible { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring); border-radius: var(--radius); }
    .snapshot-option {
      display: block;
      width: 100%;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--foreground);
      text-align: left;
      cursor: pointer;
    }
    .snapshot-option:hover { background: var(--accent); }
    .snapshot-option:focus-visible { outline: 0; border-color: var(--ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 35%, transparent); }
    .snapshot-option[aria-selected="true"] { border-color: color-mix(in srgb, var(--primary) 48%, var(--border)); background: color-mix(in srgb, var(--primary) 12%, var(--card)); }
    .snapshot-option-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .snapshot-option-id { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 12px/1.4 var(--font-mono); }
    .snapshot-option-date { color: var(--muted-foreground); font-size: 11px; white-space: nowrap; }
    .snapshot-option-paths { margin-top: 5px; color: var(--muted-foreground); font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
    .snapshot-option-actions { display: flex; justify-content: flex-end; margin-top: 7px; }
    .snapshot-workspace { min-width: 0; min-height: 0; overflow-y: auto; padding: 20px; }
    .snapshot-workspace-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .snapshot-workspace-title { margin: 0; font-size: 16px; }
    .snapshot-workspace-subtitle { margin-top: 4px; color: var(--muted-foreground); font-size: 12px; }
    .snapshot-workspace-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .snapshot-search-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .snapshot-search-field { position: relative; flex: 1; min-width: 180px; }
    .snapshot-search-field input { width: 100%; box-sizing: border-box; padding: 9px 38px 9px 11px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--background); color: var(--foreground); }
    .snapshot-search-field input:focus { outline: 0; border-color: var(--ring); box-shadow: 0 0 0 2px var(--background), 0 0 0 4px color-mix(in srgb, var(--ring) 40%, transparent); }
    .snapshot-search-clear { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; padding: 0; border: 0; border-radius: var(--radius); background: transparent; color: var(--muted-foreground); cursor: pointer; }
    .snapshot-search-clear:hover { background: var(--accent); color: var(--foreground); }
    .snapshot-breadcrumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); font: 12px/1.5 var(--font-mono); }
    .snapshot-breadcrumb { padding: 2px 4px; border: 0; border-radius: 3px; background: transparent; color: var(--primary); cursor: pointer; font: inherit; }
    .snapshot-breadcrumb:hover { background: var(--accent); }
    .snapshot-breadcrumb:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
    .snapshot-entry-list { display: flex; flex-direction: column; gap: 6px; outline: none; }
    .snapshot-entry-option { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); cursor: pointer; }
    .snapshot-entry-option:hover { border-color: color-mix(in srgb, var(--primary) 42%, var(--border)); background: color-mix(in srgb, var(--accent) 55%, var(--card)); }
    .snapshot-entry-option:focus-visible { outline: 0; border-color: var(--ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 35%, transparent); }
    .snapshot-entry-icon { color: var(--muted-foreground); font-size: 16px; text-align: center; }
    .snapshot-entry-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px/1.5 var(--font-mono); }
    .snapshot-entry-meta { color: var(--muted-foreground); font-size: 11px; }
    .snapshot-entry-action { justify-self: end; }
     .snapshot-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--muted-foreground); font-size: 12px; }
     .snapshot-status[hidden] { display: none !important; }
     .snapshot-status strong { color: var(--foreground); }
    .snapshot-status[data-state="error"], .snapshot-status[data-state="deleted"], .snapshot-status[data-state="blocked"], .snapshot-status[data-state="oversized"] { border-color: color-mix(in srgb, var(--destructive) 48%, var(--border)); }
    .snapshot-status[data-state="stale"] { border-color: color-mix(in srgb, var(--warning, #d97706) 48%, var(--border)); }
    .snapshot-status[data-state="canceled"] { border-color: color-mix(in srgb, var(--muted-foreground) 48%, var(--border)); }
    .snapshot-status .btn { margin-left: auto; }
    .snapshot-skeleton-list { display: flex; flex-direction: column; gap: 8px; }
    .snapshot-skeleton-row { height: 44px; border: 1px solid var(--border); border-radius: var(--radius); background: linear-gradient(90deg, var(--card) 25%, var(--muted) 50%, var(--card) 75%); background-size: 200% 100%; animation: snapshot-skeleton 1.2s ease-in-out infinite; }
    @keyframes snapshot-skeleton { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .snapshot-empty { padding: 34px 18px; color: var(--muted-foreground); text-align: center; }
    .snapshot-empty strong { display: block; margin-bottom: 6px; color: var(--foreground); }
    .snapshot-pagination-control { display: flex; justify-content: center; padding: 12px 0 4px; }
    .snapshot-pagination-control .btn { min-width: 128px; touch-action: manipulation; }
    .snapshot-safe-note { margin-top: 8px; color: var(--muted-foreground); font-size: 11px; line-height: 1.5; }
    @media (max-width: 760px) {
      .modal-snapshots { width: 100%; height: 92vh; }
      .snapshot-explorer-shell { grid-template-columns: 1fr; grid-template-rows: minmax(170px, 34%) minmax(0, 1fr); }
      .snapshot-navigation { padding: 12px; border-right: 0; border-bottom: 1px solid var(--border); }
      .snapshot-target-card { margin-bottom: 10px; padding: 9px 10px; }
      .snapshot-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); overflow-y: auto; }
      .snapshot-workspace { padding: 14px; }
      .snapshot-workspace-header { flex-direction: column; }
      .snapshot-workspace-actions { justify-content: flex-start; }
      .snapshot-entry-option { grid-template-columns: 24px minmax(0, 1fr); }
      .snapshot-entry-action { grid-column: 2; justify-self: start; }
    }
  </style>
</head>
<body>
  <div id="appLoader" class="app-loader">
    <div class="app-loader-content">
      <div class="app-loader-spinner"></div>
      <div class="app-loader-text">Cargando Docker Volume Backup...</div>
    </div>
  </div>
  <div id="app" class="app" style="visibility:hidden;">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div id="versionBanner" class="version-banner" style="display:none;"></div>
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div class="modal-overlay" id="modalOverlay"></div>

  <script>
    const ICONS = {
      dashboard: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>',
      workers: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 6h12M6 3v10"/></svg>',
      targets: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r="0.5" fill="currentColor"/></svg>',
      jobs: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v4l3 2"/><circle cx="8" cy="8" r="6"/></svg>',
      storage: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1 2 2 5 2s5-1 5-2V4M3 8c0 1 2 2 5 2s5-1 5-2"/></svg>',
      retention: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v6l4 2"/><circle cx="8" cy="8" r="6"/><path d="M5 1.5 3 3M11 1.5 13 3"/></svg>',
      secrets: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>',
      users: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3 3-5 6-5s6 2 6 5"/></svg>',
      logout: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2H3v12h3M10 5l3 3-3 3M6 8h7"/></svg>',
      github: '<svg class="icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>',
    };

    const NAV_ITEMS = [
      { id: "dashboard", label: "Dashboard", icon: "dashboard", roles: ["admin", "operator", "viewer"] },
      { id: "workers", label: "Workers", icon: "workers", roles: ["admin", "operator", "viewer"] },
      { id: "targets", label: "Targets", icon: "targets", roles: ["admin", "operator", "viewer"] },
      { id: "jobs", label: "Jobs", icon: "jobs", roles: ["admin", "operator", "viewer"] },
      { id: "storage", label: "Storage", icon: "storage", roles: ["admin", "operator"] },
      { id: "retention", label: "Retention", icon: "retention", roles: ["admin", "operator"] },
      { id: "secrets", label: "Secretos", icon: "secrets", roles: ["admin"] },
      { id: "users", label: "Usuarios", icon: "users", roles: ["admin"] },
      { id: "settings", label: "Settings", icon: "settings", roles: ["admin"] },
    ];

    const state = {
      workers: [],
      targets: [],
      jobs: [],
      storageProfiles: [],
      retentionPolicies: [],
      secrets: [],
      localUsers: [],
      userManagement: null,
      currentUser: null,
      currentRole: null,
      workerInventories: {},
      currentView: "dashboard",
      systemVersion: "dev",
      latestVersion: null,
      latestVersionUrl: null,
      schedulerTimezone: null,
    };
    let workersNotice = null;

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function emptyToNull(v) { return v && v.trim() ? v.trim() : null; }
    function parseJsonField(id, label) {
      const raw = document.getElementById(id).value.trim();
      if (!raw) return {};
      try { return JSON.parse(raw); } catch (e) { throw new Error(`JSON invalido en ${label}: ${e.message}`); }
    }
    function fmtDate(ts) {
      if (!ts) return "—";
      try { return new Date(ts).toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" }); } catch (e) { return ts; }
    }
    function fmtSchedulerDate(ts, timeZone) {
      if (!ts) return "—";
      if (!timeZone) return "zona del scheduler no disponible";
      try {
        return new Date(ts).toLocaleString("es-CO", { timeZone, dateStyle: "short", timeStyle: "short" });
      } catch (e) { return ts; }
    }
    function fmtStatus(status) {
      const statusInfo = {
        online: { cls: "ok", label: "online" },
        offline: { cls: "warn", label: "offline" },
        disabled: { cls: "danger", label: "Revocado", title: "Worker revocado y no elegible para nuevos jobs" },
      }[status] || { cls: "muted", label: status || "—" };
      return `<span class="pill ${statusInfo.cls}"${statusInfo.title ? ` title="${escapeHtml(statusInfo.title)}"` : ""}>${escapeHtml(statusInfo.label)}</span>`;
    }

    function fmtTargetWorkerState(target) {
      const statusInfo = {
        online: { cls: "ok", label: "Online" },
        offline: { cls: "warn", label: "Offline" },
        disabled: { cls: "danger", label: "Revocado" },
        missing: { cls: "danger", label: "Eliminado" },
        pending: { cls: "warn", label: "Pendiente" },
      }[target.worker_status] || { cls: "muted", label: target.worker_status || "Sin estado" };
      const reasonLabels = {
        target_disabled: "Target deshabilitado",
        worker_revoked: "Worker revocado",
        worker_missing: "Worker eliminado",
        worker_offline: "Worker offline",
      };
      const reason = reasonLabels[target.blocked_reason];
      return `<div class="target-worker-state"><span class="pill ${statusInfo.cls}">${escapeHtml(statusInfo.label)}</span>${reason ? `<span class="target-blocked-reason">${escapeHtml(reason)}</span>` : ""}</div>`;
    }

    function fmtJobStatus(status) {
      const normalized = normalizeJobStatus(status);
      const map = {
        succeeded: { cls: "job-success", icon: "✓", label: "Exitoso" },
        failed: { cls: "job-failed", icon: "✕", label: "Fallido" },
        in_progress: { cls: "job-running", icon: "↻", label: "En progreso" },
        pending: { cls: "job-pending", icon: "◔", label: "Pendiente" },
        canceled: { cls: "job-canceled", icon: "⊘", label: "Cancelado" },
      };
      const m = map[normalized] || { cls: "job-unknown", icon: "•", label: normalized || "—" };
      return `<span class="job-badge ${m.cls}"><span class="job-badge-icon">${m.icon}</span>${escapeHtml(m.label)}</span>`;
    }

    function normalizeJobStatus(status) {
      const value = String(status || "").toLowerCase();
      if (value === "running") return "in_progress";
      if (value === "cancelled") return "canceled";
      return value;
    }

    function jobStatusLabel(status) {
      return {
        pending: "Pendiente",
        in_progress: "En progreso",
        succeeded: "Exitoso",
        failed: "Fallido",
        canceled: "Cancelado",
      }[normalizeJobStatus(status)] || String(status || "—");
    }

    function formatJobBytes(value) {
      const amount = Number(value);
      if (!Number.isFinite(amount) || amount < 0) return null;
      if (amount < 1024) return `${Math.round(amount)} B`;
      const units = ["KB", "MB", "GB", "TB", "PB"];
      let scaled = amount;
      let unit = "B";
      for (const candidate of units) {
        scaled /= 1024;
        unit = candidate;
        if (scaled < 1024 || candidate === units[units.length - 1]) break;
      }
      return `${scaled.toFixed(scaled >= 10 ? 0 : 1)} ${unit}`;
    }

    function jobStorageContext(job) {
      const summary = job && job.result_summary && typeof job.result_summary === "object" ? job.result_summary : {};
      return (job && job.storage_context && typeof job.storage_context === "object")
        ? job.storage_context
        : (summary.storage_context && typeof summary.storage_context === "object" ? summary.storage_context : null);
    }

    function renderJobStorageContext(job) {
      const context = jobStorageContext(job);
      if (!context || context.repository_source === "unconfigured" || !context.repository_display) {
        return `<div class="job-storage-context job-storage-context-empty" role="status"><strong>Storage no configurado</strong><span>Repositorio no configurado. Configure RESTIC_REPOSITORY en el target, storage profile o Settings.</span></div>`;
      }
      const profile = context.storage_profile_name || context.storage_profile_id || "Sin perfil";
      const backend = context.backend_type || context.repository_kind || "unknown";
      const rclone = context.rclone_config_source && context.rclone_config_source !== "none" ? ` · rclone.conf: ${context.rclone_config_source}` : "";
      return `<div class="job-storage-context" role="status"><span><strong>Storage:</strong> ${escapeHtml(profile)} · ${escapeHtml(backend)}${escapeHtml(rclone)}</span><span><strong>Repositorio:</strong> <code>${escapeHtml(context.repository_display)}</code></span></div>`;
    }

    function jobPhaseLabel(phase) {
      const key = String(phase || "").trim().toLowerCase();
      return {
        starting: "Preparando",
        preparing: "Preparando",
        initializing: "Inicializando",
        backup: "Backup",
        pruning: "Pruning",
        finalizing: "Finalizando",
      }[key] || (key ? String(phase) : "");
    }

    function renderJobProgress(job) {
      const status = normalizeJobStatus(job && job.status);
      const summary = job && job.result_summary && typeof job.result_summary === "object" ? job.result_summary : {};
      const progress = job && job.progress && typeof job.progress === "object" ? job.progress : (summary.progress || {});
      let percent = Number(progress.percent_done);
      if (status === "succeeded") percent = 100;
      const hasPercent = Number.isFinite(percent) && percent >= 0 && percent <= 100 && (status !== "in_progress" || percent < 100);
      const progressLabel = hasPercent ? `${percent.toFixed(percent % 1 ? 1 : 0)}%` : (status === "in_progress" ? "Procesando..." : "Sin porcentaje disponible");
      const bytesDone = formatJobBytes(progress.bytes_done);
      const totalBytes = formatJobBytes(progress.total_bytes);
      const filesDone = Number.isFinite(Number(progress.files_done)) ? Math.round(Number(progress.files_done)) : null;
      const totalFiles = Number.isFinite(Number(progress.total_files)) ? Math.round(Number(progress.total_files)) : null;
      const counters = [];
      if (bytesDone !== null) counters.push(totalBytes !== null ? `${bytesDone} / ${totalBytes}` : bytesDone);
      if (filesDone !== null) counters.push(totalFiles !== null ? `${filesDone} / ${totalFiles} archivos` : `${filesDone} archivos`);
      if (progress.current_file) counters.push(String(progress.current_file));
      const phaseLabel = jobPhaseLabel(progress.phase);
      const phase = phaseLabel ? `Fase: ${phaseLabel}` : "";
      const track = hasPercent
        ? `<div class="job-progress-track" role="progressbar" aria-label="Progreso del job" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}"><div class="job-progress-fill" style="width:${percent}%"></div></div>`
        : (status === "in_progress" ? `<div class="job-progress-track" role="progressbar" aria-label="Job en progreso" aria-valuetext="Procesando sin porcentaje disponible"><div class="job-progress-fill indeterminate"></div></div>` : "");
      const meta = counters.join(" · ") || (phaseLabel ? `Estado: ${phaseLabel}` : (status === "in_progress" ? "Esperando estado del runtime..." : "Sin metricas de progreso"));
      return `<div class="job-progress" aria-live="polite"><div class="job-progress-heading"><strong>${escapeHtml(progressLabel)}</strong><span>${escapeHtml(phase)}</span></div>${track}<div class="job-progress-meta">${escapeHtml(meta)}</div></div>`;
    }

    function jobTriggerInfo(trigger) {
      const raw = String(trigger || "").trim();
      const known = {
        manual: { cls: "job-pending", icon: "M", label: "Manual" },
        schedule: { cls: "job-running", icon: "C", label: "Cron automatico" },
        automatic: { cls: "job-success", icon: "S", label: "Sistema automatico" },
        interactive: { cls: "job-canceled", icon: "I", label: "Interactivo" },
      }[raw];
      return known || { cls: "job-unknown", icon: "?", label: raw ? `Desconocido (${raw})` : "Desconocido" };
    }

    function fmtJobCommand(cmd) {
      const map = {
        "backup.run": { cls: "cmd-backup", icon: "▲", label: "backup.run" },
        "restore.run": { cls: "cmd-restore", icon: "▼", label: "restore.run" },

        "snapshot.ls": { cls: "cmd-list", icon: "≡", label: "snapshot.ls" },
        "snapshot.dump": { cls: "cmd-dump", icon: "◆", label: "snapshot.dump" },
        "snapshot.restore": { cls: "cmd-restore", icon: "▼", label: "snapshot.restore" },
      };
      const m = map[cmd] || { cls: "cmd-other", icon: "•", label: cmd || "—" };
      return `<span class="cmd-badge ${m.cls}"><span class="cmd-badge-icon">${m.icon}</span>${escapeHtml(m.label)}</span>`;
    }

    async function apiGet(path, options = {}) {
      const resp = await fetch(path, { ...options, method: "GET" });
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        const error = new Error(typeof err.error === "string" ? err.error : `${resp.status} ${resp.statusText}`);
        error.status = resp.status;
        error.code = typeof err.code === "string" ? err.code : "";
        error.reason = typeof err.reason === "string" ? err.reason : "";
        error.path = typeof err.path === "string" ? err.path : "";
        throw error;
      }
      return resp.json();
    }
    async function apiPost(path, body, options = {}) {
      const resp = await fetch(path, {
        ...options,
        method: "POST",
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        body: JSON.stringify(body),
      });
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        const error = new Error(err.error || `${resp.status} ${resp.statusText}`);
        error.status = resp.status;
        throw error;
      }
      return resp.json();
    }
    async function apiPatch(path, body) {
      const resp = await fetch(path, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        const error = new Error(err.error || `${resp.status} ${resp.statusText}`);
        error.status = resp.status;
        throw error;
      }
      return resp.json();
    }
    async function apiDelete(path) {
      const resp = await fetch(path, { method: "DELETE" });
      if (resp.status === 401) { window.location.href = "/login"; throw new Error("auth"); }
      if (resp.status === 204) return null;
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        const error = new Error(err.error || `${resp.status} ${resp.statusText}`);
        error.status = resp.status;
        throw error;
      }
      return resp.json();
    }

    async function withBtnLoading(btn, asyncFn, loadingText) {
      if (!btn) return asyncFn();
      if (btn.disabled) return;
      const originalHTML = btn.innerHTML;
      const originalDisabled = btn.disabled;
      btn.disabled = true;
      btn.innerHTML = `<span class="btn-spinner"></span> ${escapeHtml(loadingText || "Procesando...")}`;
      try {
        return await asyncFn();
      } catch (error) {
        alert(`Error: ${error.message}`);
        throw error;
      } finally {
        btn.disabled = originalDisabled;
        btn.innerHTML = originalHTML;
      }
    }

    async function fetchWorkerInventory(workerId) {
      if (!workerId) return null;
      if (state.workerInventories[workerId]) return state.workerInventories[workerId];
      try {
        const snapshot = await apiGet(`/api/v1/workers/${encodeURIComponent(workerId)}/inventory`);
        state.workerInventories[workerId] = snapshot;
        return snapshot;
      } catch (e) { return null; }
    }
    function getWorkerComposeProjects(workerId) {
      const snapshot = state.workerInventories[workerId];
      if (!snapshot || !snapshot.inventory) return [];
      return snapshot.inventory.compose_project_details || [];
    }

      const normalize = v => (v || "").replace(/^v/, "").trim();
      const cur = normalize(current);
      const lat = normalize(latest);
      if (!cur || !lat || cur === "dev") return false;
      return cur !== lat;
    }

    function statCard(eyebrow, title, value, meta) {
      return `<article class="card compact"><span class="eyebrow">${escapeHtml(eyebrow)}</span><div class="title">${escapeHtml(title)}</div><div class="value">${escapeHtml(String(value))}</div><div class="meta">${escapeHtml(meta || "")}</div></article>`;

    function renderDashboard(content) {
      const onlineWorkers = state.workers.filter(w => w.status === "online").length;
      const jobsSuccess = state.jobs.filter(j => j.status === "succeeded" || j.status === "success").length;
      const jobsFailed = state.jobs.filter(j => j.status === "failed").length;
      const jobsRunning = state.jobs.filter(j => j.status === "in_progress" || j.status === "running").length;
      const jobsOther = state.jobs.length - jobsSuccess - jobsFailed - jobsRunning;
      const successRate = state.jobs.length > 0 ? Math.round((jobsSuccess / state.jobs.length) * 100) : 0;

      const now = new Date();
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const dayEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
        const dayJobs = state.jobs.filter(j => {
          const ts = j.started_at ? new Date(j.started_at) : null;
          return ts && ts >= dayStart && ts < dayEnd;
        });
        days.push({
          label: d.toLocaleDateString("es", { weekday: "short" }),
          total: dayJobs.length,
          success: dayJobs.filter(j => j.status === "succeeded" || j.status === "success").length,
          failed: dayJobs.filter(j => j.status === "failed").length,
        });
      }
      const maxDay = Math.max(1, ...days.map(d => d.total));

      const donutSegments = [
        { label: "Exitosos", value: jobsSuccess, color: "var(--success)" },
        { label: "Fallidos", value: jobsFailed, color: "var(--destructive)" },
        { label: "En progreso", value: jobsRunning, color: "var(--chart-2)" },
        { label: "Otros", value: jobsOther, color: "var(--muted-foreground)" },
      ].filter(s => s.value > 0);

      const donutTotal = donutSegments.reduce((sum, s) => sum + s.value, 0) || 1;
      let cumulativeAngle = 0;
      const donutPaths = donutSegments.map(seg => {
        const angle = (seg.value / donutTotal) * 2 * Math.PI;
        const startAngle = cumulativeAngle;
        const endAngle = cumulativeAngle + angle;
        cumulativeAngle = endAngle;
        const cx = 60, cy = 60, r = 45, ir = 28;
        const x1 = cx + r * Math.sin(startAngle);
        const y1 = cy - r * Math.cos(startAngle);
        const x2 = cx + r * Math.sin(endAngle);
        const y2 = cy - r * Math.cos(endAngle);
        const ix2 = cx + ir * Math.sin(endAngle);
        const iy2 = cy - ir * Math.cos(endAngle);
        const ix1 = cx + ir * Math.sin(startAngle);
        const iy1 = cy - ir * Math.cos(startAngle);
        const largeArc = angle > Math.PI ? 1 : 0;
        if (donutSegments.length === 1) {
          return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="17" />`;
        }
        return `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${ix2} ${iy2} A ${ir} ${ir} 0 ${largeArc} 0 ${ix1} ${iy1} Z" fill="${seg.color}" />`;
      }).join("");

      const barWidth = 200 / 7;
      const barChart = days.map((day, i) => {
        const h = (day.total / maxDay) * 80;
        const successH = day.total > 0 ? (day.success / day.total) * h : 0;
        const failedH = day.total > 0 ? (day.failed / day.total) * h : 0;
        const x = i * barWidth + barWidth * 0.2;
        const w = barWidth * 0.6;
        const y = 90 - h;
        return `
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="var(--border)" opacity="0.3" />
          <rect x="${x}" y="${90 - successH}" width="${w}" height="${successH}" rx="2" fill="var(--success)" />
          <rect x="${x}" y="${90 - successH - failedH}" width="${w}" height="${failedH}" rx="2" fill="var(--destructive)" />
          <text x="${x + w/2}" y="103" text-anchor="middle" font-size="11" fill="var(--muted-foreground)" font-family="var(--font-mono)">${day.label}</text>
        `;
      }).join("");

      const targetsWithBackup = state.targets.filter(t => t.backup_strategy).length;
      const storageWithRclone = state.storageProfiles.filter(s => s.runtime_volumes && Object.keys(s.runtime_volumes).length > 0).length;

      content.innerHTML = `
        <div class="page-header"><div><h2>Resumen</h2><div class="subtitle">Estado general del Control Plane</div></div></div>
        <div class="stat-grid">
          ${statCard("Workers", "Online", onlineWorkers, `${state.workers.length} total`)}
          ${statCard("Targets", "Configurados", state.targets.length, "targets de backup")}
          ${statCard("Jobs", "Total", state.jobs.length, "historico de jobs")}
          ${statCard("Storage", "Profiles", state.storageProfiles.length, "profiles configurados")}
        </div>

        <div class="dashboard-charts">
          <div class="card compact chart-card">
            <div class="chart-header"><span class="eyebrow">Estado de Jobs</span><span class="chart-value">${successRate}% exito</span></div>
            <div class="donut-container">
              <svg viewBox="0 0 120 120" class="donut-svg">
                ${donutPaths || `<circle cx="60" cy="60" r="36.5" fill="none" stroke="var(--border)" stroke-width="17" />`}
                <text x="60" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="var(--foreground)">${state.jobs.length}</text>
                <text x="60" y="72" text-anchor="middle" font-size="9" fill="var(--muted-foreground)">jobs</text>
              </svg>
              <div class="donut-legend">
                ${donutSegments.map(s => `<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span><span class="legend-label">${escapeHtml(s.label)}</span><span class="legend-value">${s.value}</span></div>`).join("") || '<div class="legend-empty">Sin datos</div>'}
              </div>
            </div>
          </div>

          <div class="card compact chart-card">
            <div class="chart-header"><span class="eyebrow">Actividad (7 dias)</span><span class="chart-value">${days.reduce((s, d) => s + d.total, 0)} jobs</span></div>
            <svg viewBox="0 0 200 110" class="bar-svg">
              <line x1="0" y1="90" x2="200" y2="90" stroke="var(--border)" stroke-width="0.5" />
              ${barChart}
            </svg>
            <div class="bar-legend">
              <span class="legend-item-inline"><span class="legend-dot" style="background:var(--success)"></span>Exitosos</span>
              <span class="legend-item-inline"><span class="legend-dot" style="background:var(--destructive)"></span>Fallidos</span>
            </div>
          </div>
        </div>

        <div class="dashboard-bars">
          <div class="card compact">
            <div class="chart-header"><span class="eyebrow">Cobertura de Targets</span><span class="chart-value">${targetsWithBackup}/${state.targets.length}</span></div>
            <div class="progress-bar-container">
              <div class="progress-bar" style="width: ${state.targets.length > 0 ? (targetsWithBackup / state.targets.length) * 100 : 0}%"></div>
            </div>
            <div class="bar-meta">${state.targets.length > 0 ? Math.round((targetsWithBackup / state.targets.length) * 100) : 0}% con estrategia configurada</div>
          </div>
          <div class="card compact">
            <div class="chart-header"><span class="eyebrow">Storage con Volumes</span><span class="chart-value">${storageWithRclone}/${state.storageProfiles.length}</span></div>
            <div class="progress-bar-container">
              <div class="progress-bar progress-bar-blue" style="width: ${state.storageProfiles.length > 0 ? (storageWithRclone / state.storageProfiles.length) * 100 : 0}%"></div>
            </div>
            <div class="bar-meta">${state.storageProfiles.length > 0 ? Math.round((storageWithRclone / state.storageProfiles.length) * 100) : 0}% con runtime_volumes</div>
          </div>
        </div>

        <div class="page-header"><div><h2>Workers recientes</h2><div class="subtitle">Estado de los agentes registrados</div></div></div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>Nombre</th><th>Host</th><th>Status</th><th>Version</th><th>Ult. seen</th></tr></thead>
          <tbody>${state.workers.length ? state.workers.slice(0, 5).map(w => `<tr><td>${escapeHtml(w.name)}</td><td class="mono">${escapeHtml(w.host_name || "—")}</td><td>${fmtStatus(w.status)}</td><td class="mono">${escapeHtml(w.version || "—")}</td><td class="mono">${fmtDate(w.last_seen_at)}</td></tr>`).join("") : `<tr><td colspan="5" class="empty-state">Sin workers registrados</td></tr>`}</tbody>
        </table></div></div>
        <div class="page-header"><div><h2>Jobs recientes</h2><div class="subtitle">Ultimos jobs ejecutados</div></div></div>
        <div class="table-wrap"><div class="sheet"><table class="table">
          <thead><tr><th>ID</th><th>Target</th><th>Status</th><th>Inicio</th><th>Fin</th></tr></thead>
          <tbody>${state.jobs.length ? state.jobs.slice(0, 5).map(j => `<tr><td class="mono">${escapeHtml(String(j.id).slice(0,8))}</td><td>${escapeHtml(j.target_id || "—")}</td><td>${fmtStatus(j.status)}</td><td class="mono">${fmtDate(j.started_at)}</td><td class="mono">${fmtDate(j.finished_at)}</td></tr>`).join("") : `<tr><td colspan="5" class="empty-state">Sin jobs ejecutados</td></tr>`}</tbody>

    let _editLabelsWorkerId = null;

      }));

    function renderWorkerLabelRows() {

      if (!container) return;
      if (!_editLabelsRows.length) {
        container.innerHTML = `<div class="label-editor-empty">Este worker no tiene labels. Agrega una fila o guarda para quitarlas todas.</div>`;
        return;

    }

    function addWorkerLabelRow() {
      _editLabelsRows = workerLabelRowsFromDom();
      _editLabelsRows.push({ key: "", value: "" });
      renderWorkerLabelRows();
      clearWorkerLabelError();
      document.querySelector("#editLabelsRows [data-label-row]:last-child [data-label-key]")?.focus();
    }

    function collectWorkerLabels() {
      const labels = {};
      const seen = new Map();
      const rows = document.querySelectorAll("#editLabelsRows [data-label-row]");
      for (const row of rows) {
        const keyInput = row.querySelector("[data-label-key]");
        const valueInput = row.querySelector("[data-label-value]");
        const key = (keyInput?.value || "").trim();
        if (!key) {
          keyInput?.setAttribute("aria-invalid", "true");
          return { error: "La clave de cada label es obligatoria.", focus: keyInput };
        }
        if (seen.has(key)) {
          keyInput?.setAttribute("aria-invalid", "true");
          seen.get(key)?.setAttribute("aria-invalid", "true");
          return { error: `La clave "${key}" esta repetida. Usa una clave distinta.`, focus: keyInput };
        }
        seen.set(key, keyInput);
        labels[key] = valueInput?.value || "";
      }
      return { labels };
    }

    function workerFingerprint(worker) {
      const labels = Object.keys(worker.labels || {})
        .sort((a, b) => a.localeCompare(b, "es"))
        .map(key => [key, String(worker.labels[key])]);
      return JSON.stringify([worker.id, worker.status, worker.version || "", labels]);

    let workersPollTimer = null;

    function startWorkersPolling() {
      if (workersPolling) return;
      workersPolling = true;
      const tick = async () => {
        if (!workersPolling) return;
        try {
          const resp = await apiGet("/api/v1/workers");
          const newWorkers = resp.items || [];
          const hasChanged = JSON.stringify(newWorkers.map(workerFingerprint)) !== JSON.stringify((state.workers || []).map(workerFingerprint));
          state.workers = newWorkers;
          if (hasChanged) {
            const content = document.getElementById("content");
            if (content && state.currentView === "workers") {
              renderWorkers(content);
            }
          }
        } catch (e) {
          // ignore polling errors
        }
        if (workersPolling) {
          workersPollTimer = setTimeout(tick, 3000);
        }
      };
      workersPollTimer = setTimeout(tick, 3000);
    }

    function stopWorkersPolling() {
      workersPolling = false;
      if (workersPollTimer) {
        clearTimeout(workersPollTimer);
        workersPollTimer = null;
      }
    }

    function startTargetsPolling() {
      if (targetsPolling) return;
      targetsPolling = true;
      const tick = async () => {
        if (!targetsPolling) return;
        try {
          const [targetsResponse, workersResponse] = await Promise.all([
            apiGet("/api/v1/targets"),
            apiGet("/api/v1/workers"),
          ]);
          const newTargets = targetsResponse.items || [];
          const newWorkers = workersResponse.items || [];
          const targetsChanged = JSON.stringify(newTargets.map(targetFingerprint)) !== JSON.stringify((state.targets || []).map(targetFingerprint));
          const workersChanged = JSON.stringify(newWorkers.map(workerFingerprint)) !== JSON.stringify((state.workers || []).map(workerFingerprint));
          state.targets = newTargets;
          state.workers = newWorkers;
          if ((targetsChanged || workersChanged) && state.currentView === "targets") renderTargetsTable();
        } catch (e) {
          // Keep the last target state visible when a polling request fails.
        }
        if (targetsPolling) targetsPollTimer = setTimeout(tick, 3000);
      };
      targetsPollTimer = setTimeout(tick, 3000);
    }

    function createEnrollmentSecret() { return btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }

    async function generateEnrollment() {
      const errorBox = document.getElementById("awError");
      errorBox.textContent = "";
      const isRenewal = addWorkerState.mode === "renew";
      const workerId = isRenewal ? addWorkerState.worker?.id : null;
      const name = document.getElementById("awName").value.trim() || "worker";
      const host_name = document.getElementById("awHost").value.trim() || "unknown-host";
      const ttl_minutes = parseInt(document.getElementById("awTtl").value) || 60;
      const genBtn = document.getElementById("awGenerate");
      await withBtnLoading(genBtn, async () => {
        const secret = createEnrollmentSecret();
        const endpoint = isRenewal
          ? `/api/v1/admin/workers/${encodeURIComponent(workerId)}/enrollment`
          : "/api/v1/admin/worker-enrollments";
        const payload = isRenewal ? { ttl_minutes, secret } : { name, host_name, ttl_minutes, secret };
        const enrollment = await apiPost(endpoint, payload);
        addWorkerState.enrollment = { ...enrollment, worker_id: enrollment.worker_id || workerId, name, host_name, secret };
        addWorkerState.step = "commands";
        renderAddWorkerModal();

               ${hasDefaultPassword ? "" : `<div class="field"><label for="targetResticPasswordSecret">Password restic (secret) *</label><select id="targetResticPasswordSecret"><option value="">-- Seleccionar --</option>${passwordSecretOptions}</select><div class="helper">Obligatorio: no hay password default en Settings.</div></div>`}

               <summary>Opciones avanzadas</summary>

                 ${hasDefaultPassword ? `<div class="field"><label for="targetResticPasswordSecret">Password restic (secret) — opcional</label><select id="targetResticPasswordSecret"><option value="">-- Usar default de Settings --</option>${passwordSecretOptions}</select><div class="helper">Si lo dejas vacio, se usara el password default del Control Plane.</div></div>` : ""}
                 <div class="field"><label for="targetRuntimeCommand">Comando de backup (opcional)</label><input id="targetRuntimeCommand" placeholder="Por defecto: /root/backup.sh" /></div>

           </form>

      content.innerHTML = `

         <div id="targetsTableContainer"></div>
       `;
      bindTargetForm();

      if (currentLogJobId) {
        const target = state.targets.find(t => {
          const jobs = (state.jobs || []).filter(j => j.id === currentLogJobId);
          return jobs.length ? t.id === jobs[0].target_id : false;

        reopenLogPanel(currentLogJobId, currentLogTargetId || (target ? target.id : null));

    function targetCronExpression(target) {
      return target && (target.effective_cron_expression || target.cron_expression) || "";
    }

    function cronSourceLabel(source) {
      return source === "target" ? "Cron del target" : source === "global" ? "Cron global" : "Solo manual";
    }

    function renderTargetCronLabel(target) {
      const expression = targetCronExpression(target);
      const timeZone = target.scheduler_timezone || state.schedulerTimezone || "";
      const timeZoneLabel = timeZone ? `zona ${escapeHtml(timeZone)}` : "zona del scheduler no disponible";
      if (!expression) {
        return `<span style="color:var(--muted-foreground);">manual</span><div class="helper">${timeZoneLabel}</div>`;
      }
      if (target.cron_valid === false) {
        return `<code class="mono cron-error" style="font-size:11px;">${escapeHtml(expression)}</code><div class="helper">Expresion invalida - ${timeZoneLabel}</div>`;
      }
      const source = cronSourceLabel(target.cron_source || (target.cron_expression ? "target" : "global"));
      const next = target.next_scheduled_at
        ? ` - Proxima: ${escapeHtml(fmtSchedulerDate(target.next_scheduled_at, timeZone))}`
        : "";
      return `<code class="mono" style="font-size:11px;">${escapeHtml(expression)}</code><div class="helper">${escapeHtml(source)} - ${timeZoneLabel}${next}</div>`;
    }

    function getFilteredTargets() {
      const f = targetsTableState.filters;
      return (state.targets || []).filter(t => {
        const worker = state.workers.find(w => w.id === t.worker_id);
        const retention = state.retentionPolicies.find(r => r.id === t.retention_policy_id);
        const wName = t.worker_name || (worker ? worker.name : (t.worker_id || ""));
        const rName = retention ? retention.name : "";
        const cron = targetCronExpression(t) || "manual";
        if (f.name && !(t.name || "").toLowerCase().includes(f.name.toLowerCase())) return false;
        if (f.worker && !wName.toLowerCase().includes(f.worker.toLowerCase())) return false;
        if (f.compose && !(t.compose_project || "").toLowerCase().includes(f.compose.toLowerCase())) return false;
        if (f.mode && !(t.backup_mode || "").toLowerCase().includes(f.mode.toLowerCase())) return false;
        if (f.retention && !rName.toLowerCase().includes(f.retention.toLowerCase())) return false;
        if (f.cron && !cron.toLowerCase().includes(f.cron.toLowerCase())) return false;
        return true;
      });
    }

    function sortTargets(list) {
      const dir = targetsTableState.sortDir === "asc" ? 1 : -1;
      const key = targetsTableState.sortKey;
      return list.sort((a, b) => {
        let va = "", vb = "";
        if (key === "name") { va = a.name || ""; vb = b.name || ""; }
        else if (key === "worker") {
          const wa = state.workers.find(w => w.id === a.worker_id);
          const wb = state.workers.find(w => w.id === b.worker_id);
          va = a.worker_name || (wa ? wa.name : (a.worker_id || "")); vb = b.worker_name || (wb ? wb.name : (b.worker_id || ""));
        }
        else if (key === "compose") { va = a.compose_project || ""; vb = b.compose_project || ""; }
        else if (key === "mode") { va = a.backup_mode || ""; vb = b.backup_mode || ""; }
        else if (key === "retention") {
          const ra = state.retentionPolicies.find(r => r.id === a.retention_policy_id);
          const rb = state.retentionPolicies.find(r => r.id === b.retention_policy_id);
          va = ra ? ra.name : ""; vb = rb ? rb.name : "";
        }
        else if (key === "cron") { va = targetCronExpression(a) || "manual"; vb = targetCronExpression(b) || "manual"; }
        return va.localeCompare(vb) * dir;
      });
    }

            const k2 = t2.dataset.tsort;
            t2.innerHTML = `${k2 === "name" ? "Nombre" : k2 === "worker" ? "Worker" : k2 === "compose" ? "Compose project" : k2 === "mode" ? "Modo" : k2 === "retention" ? "Retencion" : "Cron"}${sortIcon(k2)}`;

      const pageSizeSelect = document.getElementById("targetsPageSize");
      if (pageSizeSelect) {
        pageSizeSelect.addEventListener("change", () => {

    function renderTargetsTableBody(preservedDropdown = captureTargetDropdownState()) {
      const tbody = document.getElementById("targetsTbody");
      if (!tbody) return;
      const filtered = sortTargets(getFilteredTargets());
      const total = filtered.length;
      const pageSize = targetsTableState.pageSize;
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      if (targetsTableState.page > totalPages) targetsTableState.page = totalPages;
      if (targetsTableState.page < 1) targetsTableState.page = 1;
      const startIdx = (targetsTableState.page - 1) * pageSize;
      const paged = filtered.slice(startIdx, startIdx + pageSize);
      const selectedTarget = currentLogTargetId
        ? paged.find(t => String(t.id) === String(currentLogTargetId))
        : null;
      if (currentLogTargetId && !selectedTarget) closeLogPanel();
      const activeLogTargetId = currentLogTargetId;
      tbody.innerHTML = paged.length ? paged.map(t => {
        const canManageTargets = state.currentRole === "admin";
        const canRunTargets = state.currentRole === "admin" || state.currentRole === "operator";
        const worker = state.workers.find(w => String(w.id) === String(t.worker_id));
        const retention = state.retentionPolicies.find(r => r.id === t.retention_policy_id);
        const lastJob = getLastJobForTarget(t.id);
        const cronLabel = renderTargetCronLabel(t);
        const workerName = t.worker_name || (worker && worker.name) || t.worker_id || "—";
        const workerStatus = t.worker_status || (worker && worker.status) || "missing";
        const fallbackWorkerReason = { disabled: "worker_revoked", missing: "worker_missing" }[workerStatus] || "worker_offline";
        const blockedReason = t.blocked_reason || (!t.enabled ? "target_disabled" : workerStatus !== "online" ? fallbackWorkerReason : null);
        const executionBlocked = Boolean(t.execution_blocked || blockedReason);
        const workerIneligible = workerStatus !== "online";
        const enableBlocked = executionBlocked && blockedReason !== "target_disabled";
        const toggleDisabled = !canManageTargets || enableBlocked;
        const runDisabled = !canRunTargets || executionBlocked;
        const targetStatusLabel = t.enabled && !executionBlocked ? "Si" : t.enabled ? "Bloqueado" : "No";
        const toggleTitle = workerIneligible
          ? "No se puede habilitar: el worker no es elegible"
          : t.enabled ? "Deshabilitar backups de este target" : "Habilitar backups de este target";
        const targetRow = `<tr class="${executionBlocked ? "target-execution-blocked" : ""}" title="${executionBlocked ? "Ejecucion bloqueada hasta resolver el estado del target o worker" : ""}">

           <td><div class="target-worker-name">${escapeHtml(workerName)}</div>${fmtTargetWorkerState({ ...t, worker_status: workerStatus, blocked_reason: blockedReason })}</td>
           <td class="mono target-compose-cell">${escapeHtml(t.compose_project || "—")}</td>
           <td>${escapeHtml(t.backup_mode)}</td>
           <td class="vol-targets-cell">${renderVolumeTargetsCell(t)}</td>
           <td>${escapeHtml(retention ? retention.name : "—")}</td>
           <td class="target-cron-cell">${cronLabel}</td>
           <td class="toggle-cell">
             ${canManageTargets ? `<label class="switch" title="${escapeHtml(toggleTitle)}">
               <input type="checkbox" data-action="toggle" data-id="${escapeHtml(t.id)}" aria-label="${escapeHtml(toggleTitle)}" ${t.enabled ? "checked" : ""} ${toggleDisabled ? "disabled" : ""} />
               <span class="slider"></span>
             </label>` : ""}
             <span class="toggle-label ${t.enabled && !executionBlocked ? "on" : ""}">${targetStatusLabel}</span>
            </td>
            <td class="action-cell">
              <div class="dropdown">
               <button type="button" class="btn ghost xs dropdown-trigger" id="target-dropdown-trigger-${escapeHtml(t.id)}" data-dropdown="${escapeHtml(t.id)}" aria-haspopup="menu" aria-expanded="false" aria-controls="dd-${escapeHtml(t.id)}">Acciones ▾</button>
               <div class="dropdown-menu" id="dd-${escapeHtml(t.id)}" role="menu" aria-labelledby="target-dropdown-trigger-${escapeHtml(t.id)}">
                  ${canRunTargets ? `<button type="button" role="menuitem" class="dropdown-item" data-action="run" data-id="${escapeHtml(t.id)}" ${runDisabled ? "disabled" : ""}>Ejecutar backup</button>` : ""}
                  ${t.backup_strategy === "restic" ? `<button type="button" role="menuitem" class="dropdown-item" data-action="snapshots" data-id="${escapeHtml(t.id)}">Snapshots</button>` : ""}
                   ${lastJob ? `<button type="button" role="menuitem" class="dropdown-item" data-action="logs" data-id="${escapeHtml(t.id)}" data-job="${escapeHtml(lastJob.id)}">Ver ultimos logs</button>` : ""}
                  ${t.live_access_enabled ? `<button type="button" role="menuitem" class="dropdown-item" data-action="live-browser" data-id="${escapeHtml(t.id)}">Ver archivos en vivo</button>` : `<span class="dropdown-item live-access-state" role="status">Live: deshabilitado</span>`}
                  ${canManageTargets ? `<button type="button" role="menuitem" class="dropdown-item" data-action="live-toggle" data-id="${escapeHtml(t.id)}" data-enabled="${t.live_access_enabled ? "false" : "true"}">${t.live_access_enabled ? "Deshabilitar acceso live" : "Habilitar acceso live"}</button>` : ""}
                  ${canManageTargets ? `<button type="button" role="menuitem" class="dropdown-item" data-action="edit" data-id="${escapeHtml(t.id)}">Editar</button>
                  <div class="dropdown-divider"></div>
                  <button type="button" role="menuitem" class="dropdown-item danger" data-action="delete" data-id="${escapeHtml(t.id)}" data-name="${escapeHtml(t.name)}">Eliminar</button>` : ""}
                </div>
              </div>
           </td>
         </tr>`;
        return targetRow + (currentLogJobId && String(activeLogTargetId) === String(t.id) ? renderTargetLogDetailRow(t) : "");
      }).join("") : `<tr><td colspan="9" class="empty-state">Sin targets que coincidan con los filtros</td></tr>`;
      const infoEl = document.querySelector("#targetsTableContainer .pagination-info");
      if (infoEl) infoEl.textContent = total === 0 ? "Sin resultados" : `${startIdx + 1}-${Math.min(startIdx + pageSize, total)} de ${total}`;
      const controlsEl = document.querySelector("#targetsTableContainer .pagination-controls");
      if (controlsEl) {
        const cur = targetsTableState.page;
        controlsEl.innerHTML = totalPages <= 1 ? "" : Array.from({length: totalPages}, (_, i) => i + 1).map(p =>
          `<button class="btn ghost xs ${p === cur ? "active" : ""}" data-tpage="${p}">${p}</button>`
        ).join("");
        controlsEl.querySelectorAll("[data-tpage]").forEach(btn => {
          btn.addEventListener("click", () => {
            targetsTableState.page = parseInt(btn.dataset.tpage, 10);
            renderTargetsTableBody();
          });
        });
      }
      bindTargetActions();
      const activeLogContent = activeLogTargetId ? document.getElementById(targetLogContentId(activeLogTargetId)) : null;
      if (activeLogContent && currentLogJobId) {
        bindTargetLogClose(activeLogContent);
        const currentJob = currentLogJobSnapshot && currentLogJobSnapshot.id === currentLogJobId
          ? currentLogJobSnapshot
          : (state.jobs || []).find(j => j.id === currentLogJobId);
        if (currentJob) renderTargetJobLogsInto(currentJob, activeLogContent);
      }
      restoreTargetDropdownState(preservedDropdown);
    }

    function renderVolumeTargetsCell(target) {
      const paths = target.volume_targets || [];
      if (!paths.length) return '<span style="color:var(--muted-foreground);">— (todos)</span>';
      const runtimeVols = target.runtime_volumes || {};
      const items = paths.map(p => {
        const entry = Object.entries(runtimeVols).find(([_, v]) => v && v.bind === p);
        const volName = entry ? entry[0] : null;
        return { path: p, name: volName };
      });
      const maxVisible = 2;
      if (items.length <= maxVisible) {
        return items.map(it => `<div class="vol-cell">${it.name ? `<span class="vol-name-pill">${escapeHtml(it.name)}</span> ` : ""}<code class="mono">${escapeHtml(it.path)}</code></div>`).join("");
      }
      const visible = items.slice(0, maxVisible);
      const hidden = items.slice(maxVisible);
      return `${visible.map(it => `<div class="vol-cell">${it.name ? `<span class="vol-name-pill">${escapeHtml(it.name)}</span> ` : ""}<code class="mono">${escapeHtml(it.path)}</code></div>`).join("")}<details class="vol-more"><summary>+${hidden.length} mas</summary>${hidden.map(it => `<div class="vol-cell">${it.name ? `<span class="vol-name-pill">${escapeHtml(it.name)}</span> ` : ""}<code class="mono">${escapeHtml(it.path)}</code></div>`).join("")}</details>`;
    }

    function getLastJobForTarget(targetId) {
      const targetJobs = (state.jobs || []).filter(j => j.target_id === targetId
        && ["backup.run", "restore.run", "restore.dry_run", "retention.run"].includes(j.command));
      if (!targetJobs.length) return null;
      return targetJobs.sort((a, b) => (b.updated_at || "").localeCompare(a.updated_at || ""))[0];
    }

    function setTargetDropdownOpen(menu, open) {
      if (!menu) return;
      const trigger = menu.parentElement?.querySelector(".dropdown-trigger");
      menu.classList.toggle("open", open);
      if (trigger) trigger.setAttribute("aria-expanded", String(open));
      if (!open && trigger && menu.contains(document.activeElement)) trigger.focus();
    }

    function closeTargetDropdowns(except = null) {
      document.querySelectorAll(".dropdown-menu.open").forEach(menu => {
        if (menu !== except) setTargetDropdownOpen(menu, false);
      });
    }

    function targetDropdownItems(menu) {
      return Array.from(menu?.querySelectorAll('[role="menuitem"]:not(:disabled)') || []);
    }

    function focusTargetDropdownItem(menu, index) {
      const items = targetDropdownItems(menu);
      if (!items.length) return;
      items[(index + items.length) % items.length].focus();
    }

    function captureTargetDropdownState() {
      const menu = document.querySelector(".targets-table .dropdown-menu.open");
      if (!menu) return null;
      const trigger = menu.parentElement?.querySelector(".dropdown-trigger");
      if (!trigger) return null;
      const items = targetDropdownItems(menu);
      const active = document.activeElement;
      return {
        targetId: trigger.dataset.dropdown,
        focus: active === trigger ? "trigger" : menu.contains(active) ? "item" : "none",
        itemIndex: items.indexOf(active),
        itemAction: active?.dataset?.action || "",
      };
    }

    function restoreTargetDropdownState(snapshot) {
      if (!snapshot || state.currentView !== "targets") return;
      const trigger = Array.from(document.querySelectorAll(".targets-table .dropdown-trigger"))
        .find(button => button.dataset.dropdown === snapshot.targetId);
      if (!trigger) return;
      const menu = document.getElementById("dd-" + trigger.dataset.dropdown);
      if (!menu) return;
      positionTargetDropdown(trigger, menu);
      if (snapshot.focus === "trigger") trigger.focus();
      else if (snapshot.focus === "item") {
        const items = targetDropdownItems(menu);
        const actionIndex = items.findIndex(item => item.dataset.action === snapshot.itemAction);
        focusTargetDropdownItem(menu, actionIndex >= 0 ? actionIndex : snapshot.itemIndex < 0 ? 0 : snapshot.itemIndex);
      }
      else focusTargetDropdownItem(menu, 0);
    }

    function moveTargetDropdownFocus(menu, direction) {
      const items = targetDropdownItems(menu);
      if (!items.length) return;
      const current = items.indexOf(document.activeElement);
      focusTargetDropdownItem(menu, current < 0 ? (direction > 0 ? 0 : items.length - 1) : current + direction);
    }

    function positionTargetDropdown(trigger, menu) {
      const viewportPadding = 8;
      const gap = 4;
      const triggerRect = trigger.getBoundingClientRect();
      menu.style.top = `${viewportPadding}px`;
      menu.style.left = `${viewportPadding}px`;
      menu.style.right = "auto";
      menu.style.bottom = "auto";
      setTargetDropdownOpen(menu, true);
      const menuRect = menu.getBoundingClientRect();
      const menuWidth = Math.min(menuRect.width, Math.max(0, window.innerWidth - viewportPadding * 2));
      const menuHeight = Math.min(menuRect.height, Math.max(0, window.innerHeight - viewportPadding * 2));
      const belowTop = triggerRect.bottom + gap;
      const aboveTop = triggerRect.top - gap - menuHeight;
      const bottomLimit = window.innerHeight - viewportPadding;
      let top = belowTop;
      if (top + menuHeight > bottomLimit && aboveTop >= viewportPadding) top = aboveTop;
      top = Math.min(Math.max(top, viewportPadding), Math.max(viewportPadding, bottomLimit - menuHeight));
      let left = triggerRect.right - menuWidth;
      left = Math.min(Math.max(left, viewportPadding), Math.max(viewportPadding, window.innerWidth - menuWidth - viewportPadding));
      menu.style.top = `${top}px`;
      menu.style.left = `${left}px`;
    }

    function bindTargetActions() {
      const container = document.querySelector("#targetsTableContainer .table-wrap") || document.querySelector(".table-wrap");
      if (!container) return;
      container.querySelectorAll(".dropdown-trigger").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const menu = document.getElementById("dd-" + btn.dataset.dropdown);
          if (!menu) return;
          const isOpen = menu.classList.contains("open");
          closeTargetDropdowns(menu);
          if (isOpen) {
            setTargetDropdownOpen(menu, false);
            return;
          }
           positionTargetDropdown(btn, menu);
           focusTargetDropdownItem(menu, 0);
         });
         btn.addEventListener("keydown", (e) => {
           if (!["ArrowDown", "ArrowUp", "Escape"].includes(e.key)) return;
           e.preventDefault();
           const menu = document.getElementById("dd-" + btn.dataset.dropdown);
           if (!menu) return;
           if (e.key === "Escape") {
             setTargetDropdownOpen(menu, false);
             return;
           }
           closeTargetDropdowns(menu);
           if (!menu.classList.contains("open")) positionTargetDropdown(btn, menu);
           focusTargetDropdownItem(menu, e.key === "ArrowUp" ? -1 : 0);
         });
       });
       container.querySelectorAll('.dropdown-menu[role="menu"]').forEach(menu => {
         menu.addEventListener("keydown", (e) => {
           const trigger = menu.parentElement?.querySelector(".dropdown-trigger");
           if (e.key === "Escape") {
             e.preventDefault();
             setTargetDropdownOpen(menu, false);
             trigger?.focus();
           } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
             e.preventDefault();
             moveTargetDropdownFocus(menu, e.key === "ArrowDown" ? 1 : -1);
           } else if (e.key === "Home" || e.key === "End") {
             e.preventDefault();
             focusTargetDropdownItem(menu, e.key === "Home" ? 0 : -1);
           } else if (e.key === "Tab") {
             setTargetDropdownOpen(menu, false);
           }
         });
       });
      container.querySelectorAll("[data-action]").forEach(btn => {
        if (btn.dataset.action === "toggle") return;
        if (btn.classList.contains("dropdown-trigger")) return;
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const menu = btn.closest(".dropdown-menu");
          if (menu) setTargetDropdownOpen(menu, false);
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          const jobId = btn.dataset.job;
          const target = state.targets.find(t => t.id === id);
          if (!target) return;
          if (action === "run") { await runBackupNow(id, e.currentTarget); }
          else if (action === "snapshots") { openSnapshotsModal(target); }
          else if (action === "logs") { openLogPanel(jobId, id); }
          else if (action === "live-browser") { openLiveBrowser(target); }
          else if (action === "live-toggle") {
            if (state.currentRole !== "admin") return;
            try { await apiPatch(`/api/v1/targets/${encodeURIComponent(id)}`, { live_access_enabled: btn.dataset.enabled === "true" }); await refreshAll(); }
            catch (error) { alert(`Error cambiando acceso live: ${error.message}`); }
          }
          else if (action === "edit") { openEditTargetModal(target); }
          else if (action === "delete") { openDeleteTargetModal(id, btn.dataset.name); }
        });
      });
      container.querySelectorAll('input[type="checkbox"][data-action="toggle"]').forEach(cb => {
        cb.addEventListener("change", async () => {
          if (state.currentRole !== "admin" || cb.disabled) return;
          const id = cb.dataset.id;
          const newEnabled = cb.checked;
          try {
            await apiPatch(`/api/v1/targets/${id}`, { enabled: newEnabled });
            await refreshAll();
          } catch (error) {
            cb.checked = !newEnabled;
            alert(`Error cambiando estado del target: ${error.message}`);
          }
        });
      });
    }

    function liveBrowserParent(path) {
      const parts = String(path || "/").split("/").filter(Boolean);
      parts.pop();
      return parts.length ? `/${parts.join("/")}` : "/";
    }

    function setLiveBrowserStatus(kind, text) {
      const status = document.getElementById("liveBrowserStatus");
      if (!status) return;
      status.dataset.state = kind;
      status.textContent = text;
    }

    function liveBrowserErrorMessage(error, requestedPath, fallback) {
      if (error?.code === "live_access_denied" && error.reason === "protected_volume") {
        const path = typeof error.path === "string" && error.path.startsWith("/") ? error.path : requestedPath;
        const context = path && path !== "/" ? ` Carpeta solicitada: ${path}.` : "";
        return `Acceso restringido: este volumen está protegido por permisos del sistema y no se puede leer en modo seguro.${context}`;
      }
      const reasonMessages = {
        source_unavailable: "La fuente configurada del target no está disponible en el worker.",
        helper_start_failed: "El worker no pudo iniciar el helper de archivos live.",
        helper_request_failed: "El helper de archivos live rechazó la solicitud del worker.",
        live_session_unavailable: "El worker no pudo abrir la sesión de archivos live.",
        invalid_source: "La fuente configurada del target no es válida para acceso live.",
        invalid_request: "La solicitud de archivos live no es válida.",
      };
      if (error?.reason && reasonMessages[error.reason]) return reasonMessages[error.reason];
      return fallback;
    }

    async function downloadLiveBrowserFile(path, name) {
      if (!liveBrowserState || liveBrowserState.closed) return;
      setLiveBrowserStatus("connected", "Descargando bytes...");
      try {
        const response = await fetch(`/api/v1/targets/${encodeURIComponent(liveBrowserState.target.id)}/live/file?path=${encodeURIComponent(path)}`, { credentials: "same-origin" });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          const error = new Error(typeof body.error === "string" ? body.error : `${response.status} ${response.statusText}`);
          error.status = response.status;
          error.code = typeof body.code === "string" ? body.code : "";
          error.reason = typeof body.reason === "string" ? body.reason : "";
          error.path = typeof body.path === "string" ? body.path : "";
          throw error;
        }
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement("a");
        link.href = url;
        link.download = name || "download";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        setLiveBrowserStatus("connected", "Conectado · descarga iniciada");
      } catch (error) {
        const message = liveBrowserErrorMessage(error, path, "No se pudo descargar el archivo");
        setLiveBrowserStatus(error?.code === "live_access_denied" ? "restricted" : "error", message);
      }
    }

    function renderLiveBrowserEntries(entries) {
      const container = document.getElementById("liveBrowserEntries");
      if (!container) return;
      container.innerHTML = entries.length ? entries.map(entry => {
        const isDirectory = entry.type === "dir";
        const label = `${isDirectory ? "Abrir" : "Descargar"} ${entry.name || "entrada"}`;
        const meta = isDirectory ? "Directorio" : (formatJobBytes(entry.size) || "Archivo");
        return `<button type="button" class="live-browser-entry" role="treeitem" data-live-path="${escapeHtml(entry.path)}" data-live-type="${isDirectory ? "dir" : "file"}" data-live-name="${escapeHtml(entry.name)}" aria-label="${escapeHtml(label)}"><span class="live-browser-entry-icon" aria-hidden="true">${isDirectory ? "▸" : "•"}</span><span class="live-browser-entry-name">${escapeHtml(entry.name)}</span><span class="live-browser-entry-meta">${escapeHtml(meta)}</span></button>`;
      }).join("") : '<div class="live-browser-empty" role="status">Directorio vacio</div>';
      container.querySelectorAll("[data-live-path]").forEach(button => button.addEventListener("click", () => {
        const path = button.dataset.livePath;
        if (button.dataset.liveType === "dir") void loadLiveBrowserEntries(path);
        else void downloadLiveBrowserFile(path, button.dataset.liveName);
      }));
    }

    async function loadLiveBrowserEntries(path = "/", cursor = null) {
      const browser = liveBrowserState;
      if (!browser || browser.closed) return;
      setLiveBrowserStatus("connecting", "Cargando lista acotada...");
      try {
        const query = `?path=${encodeURIComponent(path)}&limit=100${cursor ? `&cursor=${encodeURIComponent(cursor)}` : ""}`;
        const result = await apiGet(`/api/v1/targets/${encodeURIComponent(browser.target.id)}/live/entries${query}`);
        if (browser !== liveBrowserState || browser.closed) return;
        browser.path = path;
        browser.nextCursor = result.next_cursor || null;
        const pathEl = document.getElementById("liveBrowserPath");
        if (pathEl) pathEl.textContent = path;
        renderLiveBrowserEntries(Array.isArray(result.entries) ? result.entries : []);
        const next = document.getElementById("liveBrowserNext");
        if (next) next.hidden = !browser.nextCursor;
        setLiveBrowserStatus("connected", "Conectado · lista actualizada");
      } catch (error) {
        const message = liveBrowserErrorMessage(error, path, "No se pudo cargar la lista live");
        setLiveBrowserStatus(error?.code === "live_access_denied" ? "restricted" : "error", message);
      }
    }

    async function preflightLiveBrowserEvents(browser) {
      const controller = new AbortController();
      try {
        const response = await fetch(`/api/v1/targets/${encodeURIComponent(browser.target.id)}/live/events`, {
          credentials: "same-origin",
          headers: { Accept: "text/event-stream" },
          signal: controller.signal,
        });
        if (response.ok) return;
        const body = await response.json().catch(() => ({}));
        const error = new Error(typeof body.error === "string" ? body.error : `${response.status} ${response.statusText}`);
        error.status = response.status;
        error.code = typeof body.code === "string" ? body.code : "";
        error.reason = typeof body.reason === "string" ? body.reason : "";
        error.path = typeof body.path === "string" ? body.path : "";
        throw error;
      } finally {
        controller.abort();
      }
    }

    async function connectLiveBrowserEvents() {
      const browser = liveBrowserState;
      if (!browser || browser.closed) return;
      setLiveBrowserStatus(browser.reconnects ? "reconnecting" : "connecting", browser.reconnects ? "Reconectando eventos..." : "Conectando eventos...");
      try {
        await preflightLiveBrowserEvents(browser);
      } catch (error) {
        if (browser !== liveBrowserState || browser.closed || error?.name === "AbortError") return;
        browser.eventSource = null;
        browser.reconnects = 5;
        const message = liveBrowserErrorMessage(error, browser.path, "Eventos live no disponibles; reintenta mas tarde");
        setLiveBrowserStatus(error?.code === "live_access_denied" ? "restricted" : "error", message);
        return;
      }
      if (browser !== liveBrowserState || browser.closed) return;
      const source = new EventSource(`/api/v1/targets/${encodeURIComponent(browser.target.id)}/live/events`, { withCredentials: true });
      browser.eventSource = source;
      source.onopen = () => { browser.reconnects = 0; setLiveBrowserStatus("connected", "Conectado · cambios en vivo activos"); };
      source.addEventListener("changed", event => {
        browser.lastEventId = event.lastEventId || browser.lastEventId;
        setLiveBrowserStatus("connected", "Cambio detectado · actualizando lista...");
        void loadLiveBrowserEntries(browser.path);
      });
      source.addEventListener("resync_required", () => {
        browser.nextCursor = null;
        setLiveBrowserStatus("resync", "Resincronizando lista autorizada...");
        void loadLiveBrowserEntries(browser.path);
      });
      source.onerror = () => {
        source.close();
        browser.eventSource = null;
        browser.reconnects += 1;
        if (browser.reconnects > 4) { setLiveBrowserStatus("error", "Eventos live no disponibles; reintenta mas tarde"); return; }
        setLiveBrowserStatus("reconnecting", "Conexion perdida · reintentando...");
        browser.retryTimer = setTimeout(connectLiveBrowserEvents, Math.min(8000, 500 * 2 ** (browser.reconnects - 1)));
      };
    }

    function closeLiveBrowser() {
      if (!liveBrowserState) return;
      liveBrowserState.closed = true;
      liveBrowserState.eventSource?.close();
      if (liveBrowserState.retryTimer) clearTimeout(liveBrowserState.retryTimer);
      liveBrowserState = null;
      const overlay = document.getElementById("modalOverlay");
      if (overlay) { overlay.classList.remove("open", "active"); overlay.innerHTML = ""; }
    }

    function openLiveBrowser(target) {

      liveBrowserState = { target, path: "/", nextCursor: null, reconnects: 0, eventSource: null, retryTimer: null, closed: false };
      overlay.innerHTML = `<div class="modal live-browser-modal" role="dialog" aria-modal="true" aria-labelledby="liveBrowserTitle" aria-describedby="liveBrowserHelp"><div class="modal-header"><h3 id="liveBrowserTitle">Archivos en vivo · ${escapeHtml(target.name)}</h3><button type="button" class="close" id="liveBrowserClose" aria-label="Cerrar archivos en vivo">&times;</button></div><div class="modal-body"><div class="helper" id="liveBrowserHelp">Solo lectura. El Control Plane limita la lista y descarga bytes sin abrir rutas del host.</div><div id="liveBrowserStatus" class="live-browser-status" data-state="connecting" role="status" aria-live="polite">Conectando...</div><div class="live-browser-toolbar"><button type="button" class="btn ghost sm" id="liveBrowserUp">Subir</button><code id="liveBrowserPath">/</code></div><div id="liveBrowserEntries" class="live-browser-entries" role="tree" tabindex="0" aria-label="Archivos y directorios del target"></div><div class="live-browser-pagination"><button type="button" class="btn ghost sm" id="liveBrowserNext" hidden>Siguiente pagina</button></div></div></div>`;
      overlay.classList.add("open");
      document.getElementById("liveBrowserClose").addEventListener("click", closeLiveBrowser);

      document.getElementById("liveBrowserNext").addEventListener("click", () => void loadLiveBrowserEntries(liveBrowserState.path, liveBrowserState.nextCursor));

      connectLiveBrowserEvents();
    }
