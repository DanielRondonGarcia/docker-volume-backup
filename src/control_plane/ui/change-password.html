<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambiar Contraseña | Docker Volume Backup</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .pw-wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }
    .brand .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--primary);
      color: var(--primary-foreground);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: 700 13px/1 var(--font-sans);
    }
    .brand .name {
      font-size: 16px;
      font-weight: 700;
    }
    .pw-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .pw-card h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }
    .pw-card .subtitle {
      color: var(--muted-foreground);
      font-size: 13px;
      line-height: 1.5;
    }
    .pw-card form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .pw-card .field {
      gap: 8px;
    }
    .pw-card .field input {
      padding: 10px 12px;
    }
    .pw-card .alert { font-size: 12px; color: var(--destructive); min-height: 16px; margin-top: 4px; }
    .pw-card .success { font-size: 12px; color: var(--success); min-height: 16px; margin-top: 4px; }
    .pw-card .helper { margin-top: 4px; }
  </style>
</head>
<body>
  <div class="pw-wrap">
    <div class="brand"><span class="logo">DV</span><span class="name">Docker Volume Backup</span></div>
    <div class="card pw-card">
      <div>
        <h1>Cambio obligatorio</h1>
        <div class="subtitle">Este usuario fue creado con una contraseña inicial temporal. Define una nueva antes de entrar al dashboard.</div>
      </div>
      <form id="changePasswordForm">
        <div class="field">
          <label for="currentPassword">Contraseña actual</label>
          <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="newPassword">Nueva contraseña</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirmar nueva contraseña</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" class="btn primary full">Actualizar contraseña</button>
        <div class="alert" id="errorBox"></div>
        <div class="success" id="successBox"></div>
      </form>
      <div class="helper">Requisito mínimo: 8 caracteres y que no sea una clave trivial como <strong>changeme</strong>.</div>
    </div>
  </div>

  <script>
    async function loadSession() {
      const response = await fetch("/api/v1/auth/me");
      if (response.status === 401) { window.location.href = "/login"; return; }
      const payload = await response.json().catch(() => ({}));
      if (!payload.must_change_password) { window.location.href = "/"; }
    }

    document.getElementById("changePasswordForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const currentPassword = document.getElementById("currentPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");
      errorBox.textContent = "";
      successBox.textContent = "";
      if (newPassword !== confirmPassword) {
        errorBox.textContent = "La confirmación no coincide con la nueva contraseña.";
        return;
      }
      try {
        const response = await fetch("/api/v1/auth/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ current_password: currentPassword, new_password: newPassword }),
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          errorBox.textContent = payload.error || "No fue posible actualizar la contraseña";
          return;
        }
        successBox.textContent = "Contraseña actualizada. Redirigiendo...";
        window.setTimeout(() => { window.location.href = "/"; }, 600);
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    loadSession().catch(() => { window.location.href = "/login"; });
  </script>
</body>
</html>
