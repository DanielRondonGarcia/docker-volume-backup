name: docker-volume-backup-control-plane

services:
  control-plane:
    image: docker-volume-backup-control-plane-local:dev
    build:
      context: ../..
      dockerfile: Dockerfile
      target: control-plane
    restart: unless-stopped
    environment:
      CONTROL_PLANE_HOST: 0.0.0.0
      CONTROL_PLANE_PORT: 8080
      CONTROL_PLANE_REPOSITORY: sqlite
      CONTROL_PLANE_DB_PATH: /data/control_plane.db
      CONTROL_PLANE_KEY_FILE: /data/.control_plane.key
      CONTROL_PLANE_SESSION_KEY_FILE: /data/.control_plane.session.key
      CONTROL_PLANE_USERS_FILE: /data/.control_plane.users.json
      CONTROL_PLANE_TIMEZONE: ${CONTROL_PLANE_TIMEZONE:-America/Bogota}
      CONTROL_PLANE_PUBLIC_URL: ${CONTROL_PLANE_PUBLIC_URL:-}
      CONTROL_PLANE_TLS_ENABLED: ${CONTROL_PLANE_TLS_ENABLED:-false}
    ports:
      - "${CONTROL_PLANE_PUBLISHED_PORT:-8080}:8080"
    volumes:
      - control_plane_state:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 160m
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - snapshot_explorer_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  control_plane_state:
  snapshot_explorer_redis:
