name: docker-volume-backup-worker

# Este compose agrupa el Worker Agent junto con los servicios demo que se
# quieren backupear. El worker detecta automaticamente los compose projects
# visibles desde el daemon de Docker y reporta sus volumenes al Control Plane.
#
# Anade aqui los servicios de tu aplicacion con sus volumenes. El worker los
# descubrira y los expondra en la UI del Control Plane como compose projects
# seleccionables al crear un target.

services:
  # ------------------------------------------------------------------
  # Servicios demo: sus volumenes seran detectados por el worker y quedaran
  # disponibles para seleccionar al crear un target.
  # ------------------------------------------------------------------
  demo-app:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${DEMO_APP_PORT:-8082}:80"
    volumes:
      - demo_nginx_html:/usr/share/nginx/html
      - demo_nginx_cache:/var/cache/nginx
    labels:
      docker-volume-backup.stop-during-backup: "true"

  demo-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DEMO_POSTGRES_DB:-demo_db}"
      POSTGRES_USER: "${DEMO_POSTGRES_USER:-demo_user}"
      POSTGRES_PASSWORD: "${DEMO_POSTGRES_PASSWORD:-demo-only-password}"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    labels:
      docker-volume-backup.stop-during-backup: "true"

  demo-redis:
    image: redis:7-alpine
    user: "0:0"
    working_dir: /var/lib/redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--dir", "/var/lib/redis"]
    volumes:
      - demo_redis_data:/var/lib/redis
    labels:
      docker-volume-backup.stop-during-backup: "true"

  demo-files:
    image: alpine:3.20
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' 'Docker volume backup demo' > /demo-files/README.txt
        printf '%s\n' 'sample file A' > /demo-files/sample-a.txt
        printf '%s\n' 'sample file B' > /demo-files/sample-b.txt
        exec tail -f /dev/null
    volumes:
      - demo_files_data:/demo-files
    labels:
      docker-volume-backup.stop-during-backup: "true"

  # ------------------------------------------------------------------
  # Worker Agent: se registra contra el Control Plane y reporta el
  # inventario de compose projects (incluido este mismo stack).
  # ------------------------------------------------------------------
  worker:
    image: docker-volume-backup-worker-local:dev
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      # URL del Control Plane. Ajusta al host:puerto donde expongas el CP.
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://control-plane:8080}
      # HTTP is trusted-network default; set CONTROL_PLANE_CA_FILE for server HTTPS.
      WORKER_NAME: ${WORKER_NAME:-worker-docker}
      WORKER_HOST_NAME: ${WORKER_HOST_NAME:-worker-docker}
      WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_TOKEN:-}
      WORKER_CREDENTIAL_FILE: /data/worker_credentials.json
      WORKER_RUN_ONCE: "false"
      WORKER_POLL_INTERVAL_SECONDS: "15"
      WORKER_HEALTH_PORT: "8081"
      # Imagen usada para ejecutar los jobs de backup/restore.
      BACKUP_RUNTIME_IMAGE: ${BACKUP_RUNTIME_IMAGE:-docker-volume-backup-runtime-local:dev}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - worker_state:/data
    networks:
      - default
      - control-plane
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  control-plane:
    name: docker-volume-backup-control-plane_default
    external: true

volumes:
  demo_nginx_html:
  demo_nginx_cache:
  demo_postgres_data:
  demo_redis_data:
  demo_files_data:
  worker_state:
