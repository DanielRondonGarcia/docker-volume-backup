name: docker-volume-backup-worker

# Este compose agrupa el Worker Agent junto con los servicios demo que se
# quieren backupear. El worker detecta automaticamente los compose projects
# visibles desde el daemon de Docker y reporta sus volumenes al Control Plane.
#
# Anade aqui los servicios de tu aplicacion con sus volumenes. El worker los
# descubrira y los expondra en la UI del Control Plane como compose projects
# seleccionables al crear un target.

services:
  # ------------------------------------------------------------------
  # Servicios demo: sus volumenes seran detectados por el worker y quedaran
  # disponibles para seleccionar al crear un target.
  # ------------------------------------------------------------------
  demo-app:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${DEMO_APP_PORT:-8082}:80"
    volumes:
      - demo_nginx_html:/usr/share/nginx/html
      - demo_nginx_cache:/var/cache/nginx
    labels:
      docker-volume-backup.stop-during-backup: "true"

  demo-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DEMO_POSTGRES_DB:-demo_db}"
      POSTGRES_USER: "${DEMO_POSTGRES_USER:-demo_user}"
      POSTGRES_PASSWORD: "${DEMO_POSTGRES_PASSWORD:-demo-only-password}"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    labels:
      docker-volume-backup.stop-during-backup: "true"

  demo-redis:
    image: redis:7-alpine
    user: "0:0"
    working_dir: /var/lib/redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--dir", "/var/lib/redis"]
    volumes:
      - demo_redis_data:/var/lib/redis
    labels:
      docker-volume-backup.stop-during-backup: "true"

  demo-files:
    image: alpine:3.20
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' 'Docker volume backup demo' > /demo-files/README.txt
        printf '%s\n' 'sample file A' > /demo-files/sample-a.txt
        printf '%s\n' 'sample file B' > /demo-files/sample-b.txt
        exec tail -f /dev/null
    volumes:
      - demo_files_data:/demo-files
    labels:
      docker-volume-backup.stop-during-backup: "true"

  # ------------------------------------------------------------------
  # Worker Agent: se registra contra el Control Plane y reporta el
  # inventario de compose projects (incluido este mismo stack).
  # ------------------------------------------------------------------
  worker:
    image: docker-volume-backup-worker-local:dev
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      # URL del Control Plane. Ajusta al host:puerto donde expongas el CP.
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://control-plane:8080}
      # HTTP is trusted-network default; set CONTROL_PLANE_CA_FILE for server HTTPS.
      WORKER_NAME: ${WORKER_NAME:-worker-docker}
      WORKER_HOST_NAME: ${WORKER_HOST_NAME:-worker-docker}
      WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_TOKEN:-}
      WORKER_CREDENTIAL_FILE: /data/worker_credentials.json
      WORKER_RUN_ONCE: "false"
      WORKER_POLL_INTERVAL_SECONDS: "15"
      WORKER_HEALTH_PORT: "8081"
      # Imagen usada para ejecutar los jobs de backup/restore.
      BACKUP_RUNTIME_IMAGE: ${BACKUP_RUNTIME_IMAGE:-docker-volume-backup-runtime-local:dev}
      # Live browsing starts a helper from this same worker image. The helper
      # receives only the server-selected source as a read-only Docker mount;
      # the worker does not need the host Docker volume tree mounted.
      LIVE_FILE_HELPER_IMAGE: ${LIVE_FILE_HELPER_IMAGE:-docker-volume-backup-worker-local:dev}
      # Snapshot Explorer v2 feature flags and bounded Redis cache settings.
      SNAPSHOT_EXPLORER_NO_LOCK: ${SNAPSHOT_EXPLORER_NO_LOCK:-false}
      SNAPSHOT_EXPLORER_CACHE_DIR: ${SNAPSHOT_EXPLORER_CACHE_DIR:-/var/cache/restic-explorer}
      SNAPSHOT_EXPLORER_REDIS_URL: ${SNAPSHOT_EXPLORER_REDIS_URL:-redis://redis:6379/0}
      # Preserve whether the host explicitly supplied an empty URL; Compose's
      # default expansion otherwise turns that empty value into the default.
      SNAPSHOT_EXPLORER_REDIS_URL_SET: ${SNAPSHOT_EXPLORER_REDIS_URL+true}
      SNAPSHOT_EXPLORER_REDIS_URL_NONEMPTY: ${SNAPSHOT_EXPLORER_REDIS_URL:+true}
      SNAPSHOT_EXPLORER_REDIS_TTL_SECONDS: ${SNAPSHOT_EXPLORER_REDIS_TTL_SECONDS:-86400}
      SNAPSHOT_EXPLORER_REDIS_MAX_ENTRIES: ${SNAPSHOT_EXPLORER_REDIS_MAX_ENTRIES:-1000}
      SNAPSHOT_EXPLORER_REDIS_MAX_VALUE_BYTES: ${SNAPSHOT_EXPLORER_REDIS_MAX_VALUE_BYTES:-262144}
      SNAPSHOT_EXPLORER_REDIS_LOCK_TTL_MS: ${SNAPSHOT_EXPLORER_REDIS_LOCK_TTL_MS:-5000}
      SNAPSHOT_EXPLORER_REDIS_LOCK_WAIT_MS: ${SNAPSHOT_EXPLORER_REDIS_LOCK_WAIT_MS:-1000}
      SNAPSHOT_EXPLORER_REDIS_LOCK_POLL_MS: ${SNAPSHOT_EXPLORER_REDIS_LOCK_POLL_MS:-25}
      SNAPSHOT_EXPLORER_EAGER_INDEX: ${SNAPSHOT_EXPLORER_EAGER_INDEX:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - worker_state:/data
      # Persistent restic cache, isolated per target ID + repository fingerprint
      # by the worker runtime (subdirectories under SNAPSHOT_EXPLORER_CACHE_DIR).
      - worker_restic_cache:/var/cache/restic-explorer
    networks:
      - default
      - control-plane
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  control-plane:
    name: docker-volume-backup-control-plane_default
    external: true

volumes:
  demo_nginx_html:
  demo_nginx_cache:
  demo_postgres_data:
  demo_redis_data:
  demo_files_data:
  worker_state:
  worker_restic_cache:
